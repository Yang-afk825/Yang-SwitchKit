w storm-control\nend\n\n# --------------------------------------------------------------------\n# [提示] 锐捷交换机所有端口出厂默认就配了 10% 的广播/组播/单播抑制，没有特殊需求可以不动。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。"}},{"label":"按包速率 pps","values":{"受控端口":"1/0/1-22","抑制广播":"启用","抑制组播":"启用","抑制未知单播":"不启用","阈值单位":"按包速率 pps","阈值":"10"},"commands":{"h3c":"\n# ---- 配置风暴抑制 ----\n# H3C 的百分比关键字是 ratio（不是 percent）。pps 与 kbps 模式下设备会按芯片步长取整，实际生效值可能与填写的略有出入。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n broadcast-suppression pps 10\n multicast-suppression pps 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 同一类型报文的 broadcast-suppression 与 storm-constrain 不能同时配置，否则抑制效果不确定。\n\n# --------------------------------------------------------------------\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","huawei":"\n# ---- 配置风暴控制 ----\n# 华为必须同时给低阈值和高阈值两个值，只给一个会报错；工具按「高阈值的一半」自动算低阈值。超过了只丢包、不关端口，动作是 storm control action block。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n storm control broadcast min-rate 5 max-rate 10\n storm control multicast min-rate 5 max-rate 10\n storm control action block\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 部分 VRP V5 版本（如早期 S5700）的命令写作 storm-control（带连字符）且单位为 min-rate / max-rate 两个纯数字，下发前请用 storm control ? 确认本机写法。\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：display storm-control。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","cisco":"\n# ---- 配置风暴控制 ----\n# level 后面跟一个数字表示带宽百分比；想按包速率限就用 level pps <值>，但部分平台不支持 pps 模式，下发前用 storm-control broadcast ? 确认。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 22\n storm-control broadcast level pps 10\n storm-control multicast level pps 10\n exit\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 默认动作是丢弃超限报文、端口保持 up。\n# [提示] 查看运行情况：show storm-control broadcast。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","ruijie":"\n# ---- 配置风暴抑制 ----\n# level 后面跟数字表示带宽百分比；按包速率限速用 pps <值>。web 界面不支持 pps 模式，只能用命令行配。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-22\n storm-control broadcast pps 10\n storm-control multicast pps 10\n exit\nend\nwrite\n\n# ---- 核对结果 ----\n# 确认阈值已经按填写值生效。\nconfigure terminal\nshow storm-control\nend\n\n# --------------------------------------------------------------------\n# [提示] 锐捷交换机所有端口出厂默认就配了 10% 的广播/组播/单播抑制，没有特殊需求可以不动。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。"}}]},{"key":"loop_guard","name":"环路检测与 BPDU 保护","group":"二层","summary":"接傻瓜交换机、随手插网线最容易出环路，这两条是兜底防护。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。","环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。","锐捷的环路检测是全局开关，不能按端口单独开关。"],"params":[{"label":"检测的 VLAN","help":"留空用 all 表示所有已创建的 VLAN。","example":"10,20","default":"10,20"},{"label":"检测到环路后","help":"","example":"","default":"shutdown"},{"label":"检测周期（秒）","help":"","example":"","default":"10"},{"label":"同时开启 BPDU 保护","help":"","example":"","default":"1"},{"label":"边缘端口","help":"接终端的口。BPDU 保护只对这些口有意义。支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-22","default":"1/0/1-22"}],"samples":[{"label":"默认参数","values":{"检测的 VLAN":"10,20","检测到环路后":"关闭端口","检测周期（秒）":"10","同时开启 BPDU 保护":"启用","边缘端口":"1/0/1-22"},"commands":{"h3c":"\n# ---- 全局开启环路检测 ----\n# 环路检测默认只记日志、不动端口，所以要显式配置处理动作。检测周期默认 30 秒，这里按填写值下发。\nsystem-view\nloopback-detection global enable vlan 10 20\nloopback-detection interval-time 10\nloopback-detection global action shutdown\n\n# ---- 全局开启 BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口关闭。\nsystem-view\nstp bpdu-protection\n\n# ---- 边缘端口设为边缘口 ----\n# 只有边缘端口才受 BPDU 保护管辖；上行口不要配边缘端口。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n stp edged-port\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 被环路检测关掉的端口，可以在接口视图下 shutdown 再 undo shutdown 恢复。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","huawei":"\n# ---- 全局开启 Loop Detection ----\n# 必须先开全局开关，再开 VLAN 开关，两步都做了才生效。全局开启后每个接口默认都参与检测。\nsystem-view\nloop-detection enable\nloop-detection enable vlan 10 20\nloop-detection interval-time 10\n\n# ---- 全局开启 BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口关闭。\nsystem-view\nstp bpdu-protection\n\n# ---- 设置边缘端口 ----\n# 只有边缘端口才受 BPDU 保护管辖；上行口不要配。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n stp edged-port enable\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] Loop Detection 与 ERPS、RRPP、SEP、Smart Link、STP/RSTP/MSTP 冲突。跑了环网协议的接口，要先在接口下执行 loop-detection disable 把它关掉。\n# [风险] 部分 V200 版本的处理动作关键字是 loop-detection mode {block | nolearning | shutdown | quitvlan | trap}，本工具生成的是 port-shutdown 写法，下发前请用 loop-detection mode ? 确认。\n\n# --------------------------------------------------------------------\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","cisco":"\n# ---- 说明：思科没有环路检测（发探测帧）功能 ----\n# 这一段只是说明，不会下发到设备。\n! 思科没有与 H3C / 华为 / 锐捷「环路检测」对应的功能。\n! 接入层防环路的正解是：生成树 + PortFast 边缘端口 + BPDU 保护 + 风暴控制。\n! 下面按这套组合生成。\n\n# ---- 边缘端口 + BPDU 保护 ----\n# 全局一条让所有 PortFast 口都受 BPDU 保护；接口下再逐口确认一次。边缘口收到 BPDU 会直接 err-disable。\nconfigure terminal\nspanning-tree portfast bpduguard default\ninterface range GigabitEthernet1/0/1 - 22\n switchport mode access\n spanning-tree portfast\n spanning-tree bpduguard enable\n exit\nend\n\n# ---- BPDU 保护触发后的自动恢复 ----\n# err-disable 的端口默认不会自己恢复，配了这两条才会定时重试。\nconfigure terminal\nerrdisable recovery cause bpduguard\nerrdisable recovery interval 10\nend\n\n# ---- 确认生成树模式 ----\n# 思科默认就是 rapid-pvst。全网生成树模式要统一。\nconfigure terminal\nspanning-tree mode rapid-pvst\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] 自动恢复间隔 10 秒偏短，环路没排除就恢复会反复震荡，接入层一般设 300 秒以上。\n\n# --------------------------------------------------------------------\n# [提示] 接口下还可以用 spanning-tree guard loop 防单向链路导致的环路，适合配在上行 / 根端口上。\n# [提示] 查看被 err-disable 的端口：show interfaces status err-disabled。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","ruijie":"\n# ---- 全局开启环路检测 ----\n# 锐捷的环路检测是全局开关，不能只对某几个端口开或关，开启后所有 up 的端口都会发检测报文。默认控制方式是「断开连接（shutdown）」，自动恢复时间默认 60 秒。\nconfigure terminal\nloopback-detection enable\nloopback-detection interval 10\nend\nwrite\n\n# ---- 边缘端口 + BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口 err-disable。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-22\n spanning-tree portfast\n spanning-tree bpduguard enable\n exit\nend\n\n# ---- BPDU 保护触发后的自动恢复 ----\n# err-disable 的端口默认不会自己恢复，配了这两条才会定时重试。部分版本没有 errdisable 命令，下发前用 ? 确认。\nconfigure terminal\nerrdisable recovery cause bpduguard\nerrdisable recovery interval 300\nend\n\n# ---- 核对结果 ----\n# 查看全局环路检测状态与检测到的环路端口。\nconfigure terminal\nshow loopback-detection\nend\n\n# --------------------------------------------------------------------\n# [提示] 环路检测和生成树不要同时乱开：跑了 STP 的二层网络里，环路应由 STP 处理，环路检测更适合兜底傻瓜交换机造成的环路。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。"}},{"label":"阻塞端口","values":{"检测的 VLAN":"10,20","检测到环路后":"阻塞端口","检测周期（秒）":"10","同时开启 BPDU 保护":"启用","边缘端口":"1/0/1-22"},"commands":{"h3c":"\n# ---- 全局开启环路检测 ----\n# 环路检测默认只记日志、不动端口，所以要显式配置处理动作。检测周期默认 30 秒，这里按填写值下发。\nsystem-view\nloopback-detection global enable vlan 10 20\nloopback-detection interval-time 10\nloopback-detection global action block\n\n# ---- 全局开启 BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口关闭。\nsystem-view\nstp bpdu-protection\n\n# ---- 边缘端口设为边缘口 ----\n# 只有边缘端口才受 BPDU 保护管辖；上行口不要配边缘端口。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n stp edged-port\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 被环路检测关掉的端口，可以在接口视图下 shutdown 再 undo shutdown 恢复。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","huawei":"\n# ---- 全局开启 Loop Detection ----\n# 必须先开全局开关，再开 VLAN 开关，两步都做了才生效。全局开启后每个接口默认都参与检测。\nsystem-view\nloop-detection enable\nloop-detection enable vlan 10 20\nloop-detection interval-time 10\n\n# ---- 全局开启 BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口关闭。\nsystem-view\nstp bpdu-protection\n\n# ---- 设置边缘端口 ----\n# 只有边缘端口才受 BPDU 保护管辖；上行口不要配。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n stp edged-port enable\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] Loop Detection 与 ERPS、RRPP、SEP、Smart Link、STP/RSTP/MSTP 冲突。跑了环网协议的接口，要先在接口下执行 loop-detection disable 把它关掉。\n# [风险] 部分 V200 版本的处理动作关键字是 loop-detection mode {block | nolearning | shutdown | quitvlan | trap}，本工具生成的是 port-shutdown 写法，下发前请用 loop-detection mode ? 确认。\n\n# --------------------------------------------------------------------\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","cisco":"\n# ---- 说明：思科没有环路检测（发探测帧）功能 ----\n# 这一段只是说明，不会下发到设备。\n! 思科没有与 H3C / 华为 / 锐捷「环路检测」对应的功能。\n! 接入层防环路的正解是：生成树 + PortFast 边缘端口 + BPDU 保护 + 风暴控制。\n! 下面按这套组合生成。\n\n# ---- 边缘端口 + BPDU 保护 ----\n# 全局一条让所有 PortFast 口都受 BPDU 保护；接口下再逐口确认一次。边缘口收到 BPDU 会直接 err-disable。\nconfigure terminal\nspanning-tree portfast bpduguard default\ninterface range GigabitEthernet1/0/1 - 22\n switchport mode access\n spanning-tree portfast\n spanning-tree bpduguard enable\n exit\nend\n\n# ---- 确认生成树模式 ----\n# 思科默认就是 rapid-pvst。全网生成树模式要统一。\nconfigure terminal\n! 思科没有「阻塞端口」这一档，只能关端口或放行\nspanning-tree mode rapid-pvst\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 接口下还可以用 spanning-tree guard loop 防单向链路导致的环路，适合配在上行 / 根端口上。\n# [提示] 查看被 err-disable 的端口：show interfaces status err-disabled。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。","ruijie":"\n# ---- 全局开启环路检测 ----\n# 锐捷的环路检测是全局开关，不能只对某几个端口开或关，开启后所有 up 的端口都会发检测报文。默认控制方式是「断开连接（shutdown）」，自动恢复时间默认 60 秒。\nconfigure terminal\nloopback-detection enable\nloopback-detection interval 10\nend\nwrite\n\n# ---- 边缘端口 + BPDU 保护 ----\n# 边缘端口一旦收到 BPDU，说明下面接的不是终端而是交换机，设备会直接把该端口 err-disable。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-22\n spanning-tree portfast\n spanning-tree bpduguard enable\n exit\nend\n\n# ---- BPDU 保护触发后的自动恢复 ----\n# err-disable 的端口默认不会自己恢复，配了这两条才会定时重试。部分版本没有 errdisable 命令，下发前用 ? 确认。\nconfigure terminal\nerrdisable recovery cause bpduguard\nerrdisable recovery interval 300\nend\n\n# ---- 核对结果 ----\n# 查看全局环路检测状态与检测到的环路端口。\nconfigure terminal\nshow loopback-detection\nend\n\n# --------------------------------------------------------------------\n# [风险] 锐捷没有与 H3C / 华为「阻塞端口」完全对应的档位，检测到环路后默认就是把端口断掉，如需其他动作请查本机手册。\n\n# --------------------------------------------------------------------\n# [提示] 环路检测和生成树不要同时乱开：跑了 STP 的二层网络里，环路应由 STP 处理，环路检测更适合兜底傻瓜交换机造成的环路。\n# [提示] BPDU 保护：边缘端口一旦收到 BPDU（说明下面接的不是终端而是交换机）立刻关闭端口。\n# [提示] 环路检测靠设备自己发探测报文，傻瓜交换机不发 BPDU，只能靠它兜底。\n# [提示] 锐捷的环路检测是全局开关，不能按端口单独开关。"}}]},{"key":"dhcp_snooping","name":"DHCP Snooping","group":"安全","summary":"让交换机能识别合法的 DHCP 服务器，挡掉私接路由器发地址。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["只开 Snooping 不指定信任口，等于把所有 DHCP 应答都丢掉，配置要一次到位。","DHCP Snooping 的绑定表是后续 IP Source Guard、动态 ARP 检测的基础。"],"params":[{"label":"生效 VLAN","help":"","example":"10,20","default":"10,20"},{"label":"信任端口","help":"接合法 DHCP 服务器或上行口。非信任口收到 DHCP 应答会被丢弃。","example":"1/0/24","default":"1/0/24"},{"label":"校验请求报文源 MAC","help":"把 DHCP 请求里的客户端 MAC 和报文源 MAC 比对，拦住伪造请求。","example":"","default":"1"}],"samples":[{"label":"默认参数","values":{"生效 VLAN":"10,20","信任端口":"1/0/24","校验请求报文源 MAC":"启用"},"commands":{"h3c":"\n# ---- 全局开启 DHCP Snooping ----\n# check mac-address 会把 DHCP 请求里的客户端 MAC 和报文源 MAC 比对，用于拦住伪造请求。\nsystem-view\ndhcp snooping enable\ndhcp snooping check mac-address\n\n# ---- 按 VLAN 开启 ----\n# 全局开关和 VLAN 开关都要打开，DHCP Snooping 才会在该 VLAN 生效。\nsystem-view\nvlan 10\n dhcp snooping enable\n quit\nvlan 20\n dhcp snooping enable\n quit\n\n# ---- 指定信任端口 ----\n# 只有信任端口上收到的 DHCP 应答才会被转发，其余一律丢弃。\nsystem-view\ninterface GigabitEthernet1/0/24\n dhcp snooping trust\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] DHCP Snooping 产生的绑定表是动态 ARP 检测和 IP 源防护的判断依据，建议一起配。\n# [提示] 只开 Snooping 不指定信任口，等于把所有 DHCP 应答都丢掉，配置要一次到位。\n# [提示] DHCP Snooping 的绑定表是后续 IP Source Guard、动态 ARP 检测的基础。","huawei":"\n# ---- 全局开启 DHCP 与 DHCP Snooping ----\n# dhcp enable 是总开关，漏了它 DHCP Snooping 不生效。\nsystem-view\ndhcp enable\ndhcp snooping enable\n\n# ---- 在 VLAN 内开启 ----\n# 华为的 DHCP Snooping 要在 VLAN 视图下逐个开启。\nsystem-view\nvlan 10\n dhcp snooping enable\n quit\nvlan 20\n dhcp snooping enable\n quit\n\n# ---- 指定信任接口 ----\n# 只有信任接口上收到的 DHCP 应答才会被转发，其余一律丢弃。\nsystem-view\ninterface GigabitEthernet1/0/24\n dhcp snooping trusted\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 华为的「MAC 校验」开关名称随版本不同（例如 dhcp snooping check mac-address enable），本工具没有生成，请用 dhcp snooping check ? 确认后再配。\n# [提示] DHCP Snooping 绑定表是动态 ARP 检测与 IP 源防护的判断依据，建议一起配。\n# [提示] 配完后终端要重新获取一次地址（禁用再启用网卡）才会生成绑定表。\n# [提示] 只开 Snooping 不指定信任口，等于把所有 DHCP 应答都丢掉，配置要一次到位。\n# [提示] DHCP Snooping 的绑定表是后续 IP Source Guard、动态 ARP 检测的基础。","cisco":"\n# ---- 开启 DHCP Snooping ----\n# no ip dhcp snooping information option 是常见必须项：交换机默认会往请求里插 option 82，上游服务器不认就会丢包。database 这一条让绑定表落盘，重启后不丢。\nconfigure terminal\nip dhcp snooping\nip dhcp snooping vlan 10,20\nno ip dhcp snooping information option\nip dhcp snooping database flash:dhcpsnooping.db\nend\n\n# ---- 指定信任端口 ----\n# 只有信任端口上收到的 DHCP 应答才会被转发，其余一律丢弃。\nconfigure terminal\ninterface GigabitEthernet1/0/24\n ip dhcp snooping trust\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 思科的 MAC 校验是 ip dhcp snooping verify mac-address（默认即开启），需要关闭时才用 no 形式，本工具按默认生成的，没有额外下发。\n# [提示] 查看绑定表：show ip dhcp snooping binding。\n# [提示] 只开 Snooping 不指定信任口，等于把所有 DHCP 应答都丢掉，配置要一次到位。\n# [提示] DHCP Snooping 的绑定表是后续 IP Source Guard、动态 ARP 检测的基础。","ruijie":"\n# ---- 开启 DHCP Snooping ----\n# ip dhcp snooping 是总开关，再按 VLAN 打开。默认会校验请求报文里的客户端 MAC 与源 MAC 是否一致，本工具按勾选情况生成。\nconfigure terminal\nip dhcp snooping\nip dhcp snooping vlan 10,20\nend\n\n# ---- 指定信任端口 ----\n# 只有信任端口上收到的 DHCP 应答才会被转发，其余一律丢弃。\nconfigure terminal\ninterface GigabitEthernet 1/0/24\n ip dhcp snooping trust\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 查看绑定表 ----\n# 绑定表是动态 ARP 检测和 IP 源防护的判断依据。\nconfigure terminal\nshow ip dhcp snooping binding\nend\n\n# --------------------------------------------------------------------\n# [提示] 锐捷与思科的 DHCP Snooping 命令基本一致，这也是 RGOS 与 IOS 同源的体现。\n# [提示] 只开 Snooping 不指定信任口，等于把所有 DHCP 应答都丢掉，配置要一次到位。\n# [提示] DHCP Snooping 的绑定表是后续 IP Source Guard、动态 ARP 检测的基础。"}}]},{"key":"arp_guard","name":"ARP 防护与 IP 源防护","group":"安全","summary":"拦伪造 ARP 报文和私改 IP 的终端，校园网里最常被要求配的一条。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["ARP 防护要配合 DHCP Snooping 用，绑定表是它的判断依据，建议先配那一条。","上行口一定要设为信任口，否则正常报文也会被拦。","静态 IP+MAC 绑定命令各家、各型号差异很大，本工具不生成，请对照本机手册单独配置。"],"params":[{"label":"生效 VLAN","help":"","example":"10,20","default":"10,20"},{"label":"信任端口","help":"上行口。只有信任口上来的 ARP 报文不做检查。","example":"1/0/24","default":"1/0/24"},{"label":"用户接入口","help":"接终端的口。IP 源防护要逐口开启，填错会导致终端上不了网。支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-22","default":"1/0/1-22"},{"label":"校验报文违规项","help":"校验目的 MAC、IP、源 MAC 是否与 ARP 报文内容一致。","example":"","default":"1"},{"label":"同时开启 IP 源防护","help":"按 DHCP Snooping 绑定表校验源 IP 与源 MAC，私改 IP 直接丢包。","example":"","default":"1"}],"samples":[{"label":"默认参数","values":{"生效 VLAN":"10,20","信任端口":"1/0/24","用户接入口":"1/0/1-22","校验报文违规项":"启用","同时开启 IP 源防护":"启用"},"commands":{"h3c":"\n# ---- 开启 ARP 检测 ----\n# arp detection validate 校验 ARP 报文的 MAC 与 IP 是否自相矛盾，能挡住大部分 ARP 欺骗。\nsystem-view\narp detection validate dst-mac ip src-mac\nvlan 10\n arp detection enable\n quit\nvlan 20\n arp detection enable\n quit\n\n# ---- 指定信任端口 ----\n# 上行口必须设为信任口，否则来自网关的正常 ARP 也会被丢弃。\nsystem-view\ninterface GigabitEthernet1/0/24\n arp detection trust\n quit\n\n# ---- 用户口开启 IP 源防护 ----\n# 按 DHCP Snooping 绑定表校验源 IP 与源 MAC，终端私自改 IP 后报文会被直接丢弃。需要先配好 DHCP Snooping。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n ip verify source ip-address mac-address\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] IP 源防护依赖 DHCP Snooping 绑定表；如果终端用静态 IP，需要在设备上补一条静态绑定（ip source binding），否则它会连不上网。\n\n# --------------------------------------------------------------------\n# [提示] ARP 防护要配合 DHCP Snooping 用，绑定表是它的判断依据，建议先配那一条。\n# [提示] 上行口一定要设为信任口，否则正常报文也会被拦。\n# [提示] 静态 IP+MAC 绑定命令各家、各型号差异很大，本工具不生成，请对照本机手册单独配置。","huawei":"\n# ---- 开启动态 ARP 检测（DAI） ----\n# DAI 靠 DHCP Snooping 绑定表判断报文是否合法，所以 dhcp enable、dhcp snooping enable 一个都不能少。\nsystem-view\ndhcp enable\ndhcp snooping enable\nvlan 10\n dhcp snooping enable\n arp anti-attack check user-bind enable\n quit\nvlan 20\n dhcp snooping enable\n arp anti-attack check user-bind enable\n quit\n\n# ---- 指定信任接口 ----\n# 上行口必须设为信任接口，否则来自网关的正常 ARP 也会被丢弃。\nsystem-view\ninterface GigabitEthernet1/0/24\n dhcp snooping trusted\n quit\n\n# ---- 用户口开启 IP 源防护 ----\n# 按绑定表校验源 IP 与源 MAC，终端私自改 IP 后报文会被直接丢弃。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n ip source check user-bind enable\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] IP 源防护依赖绑定表。终端若用静态 IP，必须先用 user-bind static 建表，否则它会连不上网。\n\n# --------------------------------------------------------------------\n# [提示] 查看丢弃统计：display arp anti-attack statistics check user-bind interface。\n# [提示] ARP 防护要配合 DHCP Snooping 用，绑定表是它的判断依据，建议先配那一条。\n# [提示] 上行口一定要设为信任口，否则正常报文也会被拦。\n# [提示] 静态 IP+MAC 绑定命令各家、各型号差异很大，本工具不生成，请对照本机手册单独配置。","cisco":"\n# ---- 开启动态 ARP 检测（DAI） ----\n# DAI 靠 DHCP Snooping 绑定表判断报文是否合法，所以要先开 DHCP Snooping 并指定信任端口。validate 三个关键字分别校验源 MAC、目的 MAC、IP 是否与 ARP 内容一致。\nconfigure terminal\nip dhcp snooping\nip dhcp snooping vlan 10,20\nno ip dhcp snooping information option\nip arp inspection vlan 10,20\nip arp inspection validate src-mac dst-mac ip\nend\n\n# ---- 指定 ARP 信任端口 ----\n# 上行口必须同时设为 DHCP Snooping 和 DAI 的信任口，否则来自网关的正常 ARP 会被丢弃。\nconfigure terminal\ninterface GigabitEthernet1/0/24\n ip dhcp snooping trust\n ip arp inspection trust\n exit\nend\n\n# ---- 用户口开启 IP 源防护 ----\n# 按绑定表校验源 IP（和源 MAC），终端私自改 IP 后报文会被直接丢弃。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 22\n ip verify source\n ip verify source port-security\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] IP 源防护依赖绑定表。终端若用静态 IP，必须先用 ip source binding 建表，否则它会连不上网。\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：show ip arp inspection；看丢弃统计：show ip arp inspection statistics。\n# [提示] ARP 防护要配合 DHCP Snooping 用，绑定表是它的判断依据，建议先配那一条。\n# [提示] 上行口一定要设为信任口，否则正常报文也会被拦。\n# [提示] 静态 IP+MAC 绑定命令各家、各型号差异很大，本工具不生成，请对照本机手册单独配置。","ruijie":"\n# ---- 开启动态 ARP 检测（DAI） ----\n# DAI 靠 DHCP Snooping 绑定表判断报文是否合法，所以要先开 DHCP Snooping 并指定信任端口。\nconfigure terminal\nip dhcp snooping\nip dhcp snooping vlan 10,20\nip arp inspection vlan 10,20\nip arp inspection validate src-mac dst-mac ip\nend\n\n# ---- 指定信任端口 ----\n# 上行口必须同时设为两者的信任口，否则来自网关的正常 ARP 会被丢弃。\nconfigure terminal\ninterface GigabitEthernet 1/0/24\n ip dhcp snooping trust\n ip arp inspection trust\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对结果 ----\n# 确认生效的 VLAN 列表与信任端口是否正确。\nconfigure terminal\nshow ip arp inspection\nend\n\n# --------------------------------------------------------------------\n# [风险] IP 源防护依赖绑定表。终端若用静态 IP，必须先建静态绑定，否则它会连不上网。\n\n# --------------------------------------------------------------------\n# [提示] IP 源防护的命令随 RGOS 版本差异较大（ip verify source / ip source-guard），本工具没有生成，请用 ? 确认后再配。\n# [提示] ARP 防护要配合 DHCP Snooping 用，绑定表是它的判断依据，建议先配那一条。\n# [提示] 上行口一定要设为信任口，否则正常报文也会被拦。\n# [提示] 静态 IP+MAC 绑定命令各家、各型号差异很大，本工具不生成，请对照本机手册单独配置。"}}]},{"key":"igmp_snooping","name":"组播 IGMP Snooping","group":"三层","summary":"让组播只在有接收者的端口上转发，IPTV、视频会议场景必备。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["同一 VLAN 里只能有一个查询器，多台设备都开容易互相干扰。","上行口建议手工指成路由器端口，避免组播流被误剪。"],"params":[{"label":"生效 VLAN","help":"","example":"10","default":"10"},{"label":"开启 IGMP Snooping","help":"","example":"","default":"1"},{"label":"开启查询器","help":"VLAN 里没有三层组播设备时，交换机自己充当查询器。","example":"","default":"1"},{"label":"查询器源地址","help":"查询器模式下的源地址，建议用该 VLAN 的网关地址。","example":"","default":"192.168.10.1"},{"label":"路由器 / 上行端口","help":"选填。组播流量从这些口进来，会被当作上游口。","example":"1/0/24","default":"1/0/24"},{"label":"快速离开","help":"收到离开报文立即停止转发，减少换台延迟，但可能误伤。","example":"","default":"0"}],"samples":[{"label":"默认参数","values":{"生效 VLAN":"10","开启 IGMP Snooping":"启用","开启查询器":"启用","查询器源地址":"192.168.10.1","路由器 / 上行端口":"1/0/24","快速离开":"不启用"},"commands":{"h3c":"\n# ---- 开启 IGMP Snooping ----\n# 全局打开 IGMP Snooping 后，还要在具体 VLAN 里再打开一次。\nsystem-view\nigmp-snooping\nvlan 10\n igmp-snooping enable\n quit\n\n# ---- 配置 IGMP 查询器 ----\n# VLAN 内没有三层组播设备时，由交换机自己发查询报文维持组播表项。\nsystem-view\nvlan 10\n igmp-snooping querier enable\n igmp-snooping querier source-address 192.168.10.1\n quit\n\n# ---- 静态指定路由器端口 ----\n# 组播流量从这些口进来。不指定的话设备靠动态学习识别，上行链路不稳定时表项容易丢。\nsystem-view\ninterface Vlan-interface 10\n igmp-snooping router-port interface GigabitEthernet1/0/24\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 同一个 VLAN 里只应存在一个 IGMP 查询器，多台设备都开容易互相干扰。\n\n# --------------------------------------------------------------------\n# [提示] 同一 VLAN 里只能有一个查询器，多台设备都开容易互相干扰。\n# [提示] 上行口建议手工指成路由器端口，避免组播流被误剪。","huawei":"\n# ---- 开启 IGMP Snooping ----\n# 先开全局，再逐 VLAN 开，两步都要做。\nsystem-view\nigmp-snooping enable\nvlan 10\n igmp-snooping enable\n quit\n\n# ---- 配置 IGMP 查询器 ----\n# VLAN 内没有三层组播设备时，由交换机自己发查询报文维持组播表项。\nsystem-view\nvlan 10\n igmp-snooping querier enable\n igmp-snooping querier source-address 192.168.10.1\n quit\n\n# ---- 静态指定路由器端口 ----\n# 华为的三层接口叫 Vlanif，注意与 H3C 的 Vlan-interface 区分。\nsystem-view\ninterface Vlanif 10\n igmp-snooping router-port interface GigabitEthernet1/0/24\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 同一个 VLAN 里只应存在一个 IGMP 查询器，多台设备都开容易互相干扰。\n\n# --------------------------------------------------------------------\n# [提示] 同一 VLAN 里只能有一个查询器，多台设备都开容易互相干扰。\n# [提示] 上行口建议手工指成路由器端口，避免组播流被误剪。","cisco":"\n# ---- 开启 IGMP Snooping ----\n# 全局一条打开，再逐 VLAN 打开。\nconfigure terminal\nip igmp snooping\nip igmp snooping vlan 10\nend\n\n# ---- 开启 IGMP 查询器 ----\n# 思科的查询器默认按最小 IP 选举，多台交换机都开也没关系。\nconfigure terminal\nip igmp snooping querier\nip igmp snooping vlan 10 querier\nend\n\n# ---- 静态指定路由器端口 ----\n# 组播流量从这些口进来。不指定的话靠动态学习，上行不稳时表项容易丢。\nconfigure terminal\nip igmp snooping vlan 10 mrouter interface GigabitEthernet1/0/24\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 要把查询器地址固定成 192.168.10.1，可在 VLAN 接口下配 ip igmp snooping querier address，该命令随平台版本差异较大，请用 ? 确认后再下发。\n# [提示] 查看运行情况：show ip igmp snooping；看组播组：show ip igmp snooping groups。\n# [提示] 同一 VLAN 里只能有一个查询器，多台设备都开容易互相干扰。\n# [提示] 上行口建议手工指成路由器端口，避免组播流被误剪。","ruijie":"\n# ---- 开启 IGMP Snooping ----\n# 全局一条打开，再逐 VLAN 打开。\nconfigure terminal\nip igmp snooping\nip igmp snooping vlan 10\nend\n\n# ---- 开启 IGMP 查询器 ----\n# VLAN 内没有三层组播设备时，由交换机自己发查询报文维持组播表项。\nconfigure terminal\nip igmp snooping querier\nip igmp snooping vlan 10 querier\nend\n\n# ---- 静态指定路由器端口 ----\n# 组播流量从这些口进来。不指定的话靠动态学习，上行不稳时表项容易丢。\nconfigure terminal\nip igmp snooping vlan 10 mrouter interface GigabitEthernet 1/0/24\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 同一个 VLAN 里只应存在一个 IGMP 查询器，多台设备都开容易互相干扰。\n\n# --------------------------------------------------------------------\n# [提示] 要把查询器地址固定成 192.168.10.1，可参考本机手册在 VLAN 接口下配置，该命令随版本差异较大，本工具没有生成。\n# [提示] 同一 VLAN 里只能有一个查询器，多台设备都开容易互相干扰。\n# [提示] 上行口建议手工指成路由器端口，避免组播流被误剪。"}}]},{"key":"ospf","name":"OSPF 基础","group":"三层","summary":"三层交换机之间跑动态路由最常用的协议，含被动接口与验证骨架。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。","宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。","Router ID 冲突会导致邻居反复震荡，务必手工指定。"],"params":[{"label":"进程号","help":"本机有效即可，两端进程号不要求一致。","example":"","default":"1"},{"label":"Router ID","help":"建议用手工指定的 Loopback 地址，别让它自动选举。","example":"","default":"1.1.1.1"},{"label":"宣告网段","help":"每行一条：网段/掩码长度 区域。区域 0 是骨干区域。","example":"192.168.10.0/24 area 0","default":"192.168.10.0/24 area 0\n192.168.20.0/24 area 0"},{"label":"接口设为被动","help":"选填。接终端的接口设为被动，不发 Hello 但照样宣告网段。","example":"","default":"Vlan-interface 10"},{"label":"区域验证","help":"","example":"","default":"off"},{"label":"验证密钥","help":"仅 MD5 验证时使用。","example":"","default":"Ospf@2026"}],"samples":[{"label":"默认参数","values":{"进程号":"1","Router ID":"1.1.1.1","宣告网段":"192.168.10.0/24 area 0\n192.168.20.0/24 area 0","接口设为被动":"Vlan-interface 10","区域验证":"不启用","验证密钥":"Ospf@2026"},"commands":{"h3c":"\n# ---- 启用 OSPF 并指定 Router ID ----\n# Router ID 建议手工指定成 Loopback 地址，不要依赖设备自动选举。\nsystem-view\nospf 1 router-id 1.1.1.1\n quit\n\n# ---- 宣告网段 ----\n# Comware 的 area 视图下 network 用反掩码（通配符掩码）。\nsystem-view\nospf 1\n area 0\n  network 192.168.10.0 0.0.0.255\n  quit\n area 0\n  network 192.168.20.0 0.0.0.255\n  quit\n quit\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello 报文，但网段照样宣告出去，适合接终端的接口。\nsystem-view\nospf 1\n silent-interface Vlan-interface 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对邻居与路由 ----\n# 两步确认：先看邻居是不是 Full，再看路由有没有进表。\nsystem-view\ndisplay ospf peer\ndisplay ospf routing\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","huawei":"\n# ---- 启用 OSPF 并指定 Router ID ----\n# Router ID 建议手工指定成 Loopback 地址，不要依赖设备自动选举。\nsystem-view\nospf 1 router-id 1.1.1.1\n quit\n\n# ---- 宣告网段 ----\n# VRP 的 area 视图下 network 用反掩码（通配符掩码）。\nsystem-view\nospf 1\n area 0\n  network 192.168.10.0 0.0.0.255\n  quit\n area 0\n  network 192.168.20.0 0.0.0.255\n  quit\n quit\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nsystem-view\nospf 1\n silent-interface Vlan-interface 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 Full，再看路由有没有进表。\nsystem-view\ndisplay ospf peer\ndisplay ospf routing\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","cisco":"\n# ---- 启用 OSPF 并宣告网段 ----\n# 思科的 network 一条就带上区域号，用反掩码（通配符掩码）。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.10.0 0.0.0.255 area 0\n network 192.168.20.0 0.0.0.255 area 0\n end\nwrite memory\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nconfigure terminal\nrouter ospf 1\n passive-interface Vlan-interface 10\nend\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 FULL，再看 OSPF 路由有没有进表。\nconfigure terminal\nshow ip ospf neighbor\nshow ip route ospf\nend\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","ruijie":"\n# ---- 启用 OSPF 并宣告网段 ----\n# 锐捷的 OSPF 语法与思科基本一致，network 一条带上区域号，用反掩码。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.10.0 0.0.0.255 area 0\n network 192.168.20.0 0.0.0.255 area 0\n end\nwrite\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nconfigure terminal\nrouter ospf 1\n passive-interface Vlan-interface 10\nend\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 FULL，再看 OSPF 路由有没有进表。\nconfigure terminal\nshow ip ospf neighbor\nshow ip route ospf\nend\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。"}},{"label":"MD5 简易验证","values":{"进程号":"1","Router ID":"1.1.1.1","宣告网段":"192.168.10.0/24 area 0\n192.168.20.0/24 area 0","接口设为被动":"Vlan-interface 10","区域验证":"MD5 简易验证","验证密钥":"Ospf@2026"},"commands":{"h3c":"\n# ---- 启用 OSPF 并指定 Router ID ----\n# Router ID 建议手工指定成 Loopback 地址，不要依赖设备自动选举。\nsystem-view\nospf 1 router-id 1.1.1.1\n quit\n\n# ---- 宣告网段 ----\n# Comware 的 area 视图下 network 用反掩码（通配符掩码）。\nsystem-view\nospf 1\n area 0\n  network 192.168.10.0 0.0.0.255\n  quit\n area 0\n  network 192.168.20.0 0.0.0.255\n  quit\n quit\n\n# ---- 开启区域验证 ----\n# 区域验证要在同一区域的所有设备上保持一致，否则邻居建不起来。\nsystem-view\nospf 1\n area 0\n  authentication-mode md5\n  quit\n quit\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello 报文，但网段照样宣告出去，适合接终端的接口。\nsystem-view\nospf 1\n silent-interface Vlan-interface 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对邻居与路由 ----\n# 两步确认：先看邻居是不是 Full，再看路由有没有进表。\nsystem-view\ndisplay ospf peer\ndisplay ospf routing\n\n# --------------------------------------------------------------------\n# [风险] MD5 验证密钥 Ospf@2026 是明文写在脚本里的，下发后请及时在设备上改成密文保存。\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","huawei":"\n# ---- 启用 OSPF 并指定 Router ID ----\n# Router ID 建议手工指定成 Loopback 地址，不要依赖设备自动选举。\nsystem-view\nospf 1 router-id 1.1.1.1\n quit\n\n# ---- 宣告网段 ----\n# VRP 的 area 视图下 network 用反掩码（通配符掩码）。\nsystem-view\nospf 1\n area 0\n  network 192.168.10.0 0.0.0.255\n  quit\n area 0\n  network 192.168.20.0 0.0.0.255\n  quit\n quit\n\n# ---- 开启区域验证 ----\n# 区域验证要在同一区域的所有设备上保持一致，否则邻居建不起来。\nsystem-view\nospf 1\n area 0\n  authentication-mode md5\n  quit\n quit\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nsystem-view\nospf 1\n silent-interface Vlan-interface 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 Full，再看路由有没有进表。\nsystem-view\ndisplay ospf peer\ndisplay ospf routing\n\n# --------------------------------------------------------------------\n# [风险] MD5 验证密钥 Ospf@2026 是明文写在脚本里的，下发后请及时改成密文保存。\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","cisco":"\n# ---- 启用 OSPF 并宣告网段 ----\n# 思科的 network 一条就带上区域号，用反掩码（通配符掩码）。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.10.0 0.0.0.255 area 0\n network 192.168.20.0 0.0.0.255 area 0\n area 0 authentication message-digest\n end\nwrite memory\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nconfigure terminal\nrouter ospf 1\n passive-interface Vlan-interface 10\nend\n\n# ---- 接口上配置 MD5 密钥 ----\n# 这一段是注释，不会下发；请按实际三层接口补配。\n! 区域开了 MD5 验证后，还要在每个跑 OSPF 的接口上配置密钥，\n! 命令形如（在 VLAN 接口视图下）：\n!   ip ospf message-digest-key 1 md5 Ospf@2026\n! 密钥必须两端一致。本工具不知道你的三层接口清单，所以只给这一行模板。\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 FULL，再看 OSPF 路由有没有进表。\nconfigure terminal\nshow ip ospf neighbor\nshow ip route ospf\nend\n\n# --------------------------------------------------------------------\n# [风险] MD5 密钥 Ospf@2026 是明文，下发前请确认终端没被别人看到。\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。","ruijie":"\n# ---- 启用 OSPF 并宣告网段 ----\n# 锐捷的 OSPF 语法与思科基本一致，network 一条带上区域号，用反掩码。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter ospf 1\n router-id 1.1.1.1\n network 192.168.10.0 0.0.0.255 area 0\n network 192.168.20.0 0.0.0.255 area 0\n area 0 authentication message-digest\n end\nwrite\n\n# ---- 设置被动接口 ----\n# 被动接口不发 Hello，但网段照样宣告出去，适合接终端的接口。\nconfigure terminal\nrouter ospf 1\n passive-interface Vlan-interface 10\nend\n\n# ---- 接口上配置 MD5 密钥 ----\n# 这一段是注释，不会下发；请按实际三层接口补配。\n! 区域开了 MD5 验证后，还要在每个跑 OSPF 的接口上配密钥，\n! 命令形如（在 VLAN 接口视图下）：\n!   ip ospf authentication message-digest\n!   ip ospf message-digest-key 1 md5 Ospf@2026\n! 密钥必须两端一致。本工具不知道你的三层接口清单，所以只给模板。\n\n# ---- 核对邻居与路由 ----\n# 先看邻居是不是 FULL，再看 OSPF 路由有没有进表。\nconfigure terminal\nshow ip ospf neighbor\nshow ip route ospf\nend\n\n# --------------------------------------------------------------------\n# [风险] MD5 密钥 Ospf@2026 是明文，下发前请确认终端没被别人看到。\n\n# --------------------------------------------------------------------\n# [提示] 两端设备的区域号、验证方式、Hello / Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 两端设备的区域号、验证方式、Hello/Dead 定时器必须一致，否则建立不了邻居。\n# [提示] 宣称网段时用的是反掩码（思科 / 锐捷）或掩码长度（H3C / 华为），工具会按厂商转换。\n# [提示] Router ID 冲突会导致邻居反复震荡，务必手工指定。"}}]},{"key":"qos_rate","name":"端口限速（QoS）","group":"运维","summary":"按端口限制上下行速率，宿舍、访客网络、专线接入口常用。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。","入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。","思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。"],"params":[{"label":"限速端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":"1/0/1-8"},{"label":"方向","help":"","example":"","default":"inbound"},{"label":"承诺速率 CIR","help":"单位 kbps。10000 就是 10 Mbps。H3C 要求是 64 的整数倍。","example":"10000","default":"10000"},{"label":"突发尺寸 CBS","help":"选填，单位字节。一般取 CIR × 突发容忍时间，经验值见说明。","example":"200000","default":""}],"samples":[{"label":"默认参数","values":{"限速端口":"1/0/1-8","方向":"入方向（限制用户上行）","承诺速率 CIR":"10000","突发尺寸 CBS":""},"commands":{"h3c":"\n# ---- 端口限速 ----\n# qos lr 是接口级物理限速，直接按令牌桶对进出端口的流量整形。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n qos lr inbound cir 10000\n quit\n\n# ---- 核对限速结果 ----\n# 确认 CIR 已经按要求生效。\nsystem-view\ndisplay qos lr interface\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] CIR 10000 不是 64 的整数倍，H3C 要求取 64 的倍数，建议改成 9984 或 10048。\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是入方向（用户上行）。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","huawei":"\n# ---- 端口限速 ----\n# qos lr 是接口级物理限速。cbs 不给就用设备默认值。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n qos lr inbound cir 10000\n quit\n\n# ---- 核对限速结果 ----\n# 确认 CIR 已经按要求生效。\nsystem-view\ndisplay qos lr interface\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是入方向（用户上行）。\n# [提示] 精细化限速可以用 qos car inbound cir <kbps> cbs <bytes>，按 ACL 匹配特定流量。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","cisco":"\n# ---- 定义限速策略 ----\n# 思科的 police 单位是 bps，所以 10000 kbps 换算成 10000000 bps。exceed-action drop 表示超速直接丢弃；想改成降级转发可以用 exceed-action policed-dscp-transmit。\nconfigure terminal\npolicy-map SCG-RATE-10000K\n class class-default\n  police 10000000 conform-action transmit exceed-action drop\n  exit\n exit\nend\n\n# ---- 在端口上应用策略 ----\n# 入方向限的是用户上传，出方向限的是用户下载。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n service-policy inbound SCG-RATE-10000K\n exit\nend\nwrite memory\n\n# ---- 核对限速结果 ----\n# 看有没有命中计数，计数为 0 说明策略没生效。\nconfigure terminal\nshow policy-map interface | include SCG-RATE-10000K\nend\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是入方向（用户上行）。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","ruijie":"\n# ---- 定义限速策略 ----\n# police cir 单位是 bps，所以 10000 kbps 换算成 10000000 bps。没填 CBS 时，工具按「CIR × 200ms」估算了一个经验值，请按现场情况调整。\nconfigure terminal\npolicy-map SCG-RATE-10000K\n class class-default\n  police cir 10000000 cbs 250000\n  exit\n exit\nend\n\n# ---- 在端口上应用策略 ----\n# 入方向限的是用户上传，出方向限的是用户下载。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n service-policy inbound SCG-RATE-10000K\n exit\nend\nwrite\n\n# ---- 核对限速结果 ----\n# 看有没有命中计数，计数为 0 说明策略没生效。\nconfigure terminal\nshow policy-map interface | include SCG-RATE-10000K\nend\n\n# --------------------------------------------------------------------\n# [提示] 锐捷也可以用 rate-limit input <bps> <突发> 直接在接口下限速，不同版本参数个数不一样，本工具没生成，需要时请用 ? 确认。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。"}},{"label":"出方向（限制用户下行）","values":{"限速端口":"1/0/1-8","方向":"出方向（限制用户下行）","承诺速率 CIR":"10000","突发尺寸 CBS":""},"commands":{"h3c":"\n# ---- 端口限速 ----\n# qos lr 是接口级物理限速，直接按令牌桶对进出端口的流量整形。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n qos lr outbound cir 10000\n quit\n\n# ---- 核对限速结果 ----\n# 确认 CIR 已经按要求生效。\nsystem-view\ndisplay qos lr interface\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] CIR 10000 不是 64 的整数倍，H3C 要求取 64 的倍数，建议改成 9984 或 10048。\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是出方向（用户下行）。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","huawei":"\n# ---- 端口限速 ----\n# qos lr 是接口级物理限速。cbs 不给就用设备默认值。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n qos lr outbound cir 10000\n quit\n\n# ---- 核对限速结果 ----\n# 确认 CIR 已经按要求生效。\nsystem-view\ndisplay qos lr interface\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是出方向（用户下行）。\n# [提示] 精细化限速可以用 qos car inbound cir <kbps> cbs <bytes>，按 ACL 匹配特定流量。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","cisco":"\n# ---- 定义限速策略 ----\n# 思科的 police 单位是 bps，所以 10000 kbps 换算成 10000000 bps。exceed-action drop 表示超速直接丢弃；想改成降级转发可以用 exceed-action policed-dscp-transmit。\nconfigure terminal\npolicy-map SCG-RATE-10000K\n class class-default\n  police 10000000 conform-action transmit exceed-action drop\n  exit\n exit\nend\n\n# ---- 在端口上应用策略 ----\n# 入方向限的是用户上传，出方向限的是用户下载。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n service-policy outbound SCG-RATE-10000K\n exit\nend\nwrite memory\n\n# ---- 核对限速结果 ----\n# 看有没有命中计数，计数为 0 说明策略没生效。\nconfigure terminal\nshow policy-map interface | include SCG-RATE-10000K\nend\n\n# --------------------------------------------------------------------\n# [提示] 当前限制的是出方向（用户下行）。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。","ruijie":"\n# ---- 定义限速策略 ----\n# police cir 单位是 bps，所以 10000 kbps 换算成 10000000 bps。没填 CBS 时，工具按「CIR × 200ms」估算了一个经验值，请按现场情况调整。\nconfigure terminal\npolicy-map SCG-RATE-10000K\n class class-default\n  police cir 10000000 cbs 250000\n  exit\n exit\nend\n\n# ---- 在端口上应用策略 ----\n# 入方向限的是用户上传，出方向限的是用户下载。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n service-policy outbound SCG-RATE-10000K\n exit\nend\nwrite\n\n# ---- 核对限速结果 ----\n# 看有没有命中计数，计数为 0 说明策略没生效。\nconfigure terminal\nshow policy-map interface | include SCG-RATE-10000K\nend\n\n# --------------------------------------------------------------------\n# [提示] 锐捷也可以用 rate-limit input <bps> <突发> 直接在接口下限速，不同版本参数个数不一样，本工具没生成，需要时请用 ? 确认。\n# [提示] CBS 太小会让 TCP 吞吐骤降，太大会失去限速意义；10 Mbps 限速可取 200000 字节。\n# [提示] 入方向限的是用户上传，出方向限的是用户下载，按需求选对方向。\n# [提示] 思科 / 锐捷的限速走 QoS 策略，需要先建 class-map，工具已一并生成。"}}]},{"key":"inspect","name":"巡检与排障命令","group":"运维","summary":"开局前后、报障时最常用的一批查询命令，四厂商各一套。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["巡检建议在业务低谷期做，部分 display 命令会占用较多 CPU。","报障时先在故障时刻留存一遍，再和正常时刻的输出对比，差异就是线索。","生成的是一整批查询命令，逐段复制到设备上执行即可，不会改动任何配置。"],"params":[{"label":"设备信息与资源","help":"版本、序列号、CPU、内存、启动时间。","example":"","default":"1"},{"label":"接口与流量","help":"接口状态、收发计数、错包统计。","example":"","default":"1"},{"label":"二层转发表","help":"MAC 表、VLAN、聚合、生成树。","example":"","default":"1"},{"label":"三层与地址","help":"路由表、ARP、DHCP、VRRP。","example":"","default":"1"},{"label":"安全与接入","help":"DHCP Snooping、ARP 检测、端口安全的运行情况。","example":"","default":"1"},{"label":"硬件与光模块","help":"光模块收发功率、电源、风扇、PoE。","example":"","default":"1"},{"label":"日志与告警","help":"日志缓冲区、告警、异常重启记录。","example":"","default":"1"},{"label":"附带一键收集诊断信息","help":"生成诊断文件，用于提交给厂商技术支持。这个动作比较重。","example":"","default":"0"}],"samples":[{"label":"默认参数","values":{"设备信息与资源":"启用","接口与流量":"启用","二层转发表":"启用","三层与地址":"启用","安全与接入":"启用","硬件与光模块":"启用","日志与告警":"启用","附带一键收集诊断信息":"不启用"},"commands":{"h3c":"\n# ---- 设备信息与资源 ----\n# 开局先留一份基线，出问题时拿它来对比。\ndisplay version\ndisplay device\ndisplay device manuinfo\ndisplay clock\ndisplay cpu-usage\ndisplay memory\ndisplay boot-loader\ndisplay startup\ndisplay fan\ndisplay power\ndisplay temperature\n\n# ---- 接口与流量 ----\n# 看错包、丢包和速率，是判断链路质量最快的一组命令。\ndisplay interface brief\ndisplay interface\ndisplay counters inbound interface\ndisplay counters outbound interface\ndisplay counters rate inbound interface\ndisplay counters rate outbound interface\ndisplay packet-drop interface\ndisplay link-delay\n\n# ---- 二层转发表 ----\n# mac-move 能直接看出 MAC 漂移，是定位环路最直接的线索。\ndisplay vlan brief\ndisplay interface brief | include UP\ndisplay mac-address\ndisplay mac-address mac-move\ndisplay link-aggregation summary\ndisplay link-aggregation verbose\ndisplay stp brief\ndisplay stp root\ndisplay stp region-configuration\ndisplay lldp neighbor-information\n\n# ---- 三层与地址 ----\n# 先看路由表里有没有你要的那条，再看 ARP 学没学到对端。\ndisplay ip routing-table\ndisplay ip routing-table statistics\ndisplay arp all\ndisplay arp count\ndisplay ip interface brief\ndisplay dhcp server ip-in-use\ndisplay dhcp relay statistics\ndisplay vrrp brief\ndisplay ospf peer\ndisplay ospf routing\n\n# ---- 安全与接入 ----\n# 命中计数长期为 0 的规则，往往说明它根本没生效。\ndisplay dhcp snooping binding\ndisplay dhcp snooping statistics\ndisplay arp detection statistics\ndisplay port-security\ndisplay port-security intrusion\ndisplay ip verify source\ndisplay dot1x\ndisplay mac-address security\ndisplay acl all\ndisplay packet-filter statistics\n\n# ---- 硬件与光模块 ----\n# 光模块收发功率是排查「链路 up 但丢包」的关键数据。\ndisplay transceiver interface\ndisplay transceiver diagnosis interface\ndisplay transceiver manuinfo interface\ndisplay poe interface\ndisplay poe interface power\ndisplay power-supply\n\n# ---- 日志与告警 ----\n# 异常重启记录和日志缓冲是定位设备自身问题的入口。\ndisplay logbuffer summary\ndisplay logbuffer\ndisplay trapbuffer\ndisplay exception\ndisplay reboot-info\ndisplay diag\n\n# ---- 保存当前配置（便于与巡检输出对照） ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] display diagnostic-information 与部分统计清零类命令会占用较多 CPU，请在业务低谷期执行。\n\n# --------------------------------------------------------------------\n# [提示] 以上全部是查询命令，不会改动设备配置，可以放心执行。\n# [提示] 巡检建议在业务低谷期做，部分 display 命令会占用较多 CPU。\n# [提示] 报障时先在故障时刻留存一遍，再和正常时刻的输出对比，差异就是线索。\n# [提示] 生成的是一整批查询命令，逐段复制到设备上执行即可，不会改动任何配置。","huawei":"\n# ---- 设备信息与资源 ----\n# 开局先留一份基线，出问题时拿它对比。\ndisplay version\ndisplay device\ndisplay device manufacture-info\ndisplay clock\ndisplay cpu-usage\ndisplay memory-usage\ndisplay boot-loader\ndisplay startup\ndisplay fan\ndisplay power\ndisplay temperature all\n\n# ---- 接口与流量 ----\n# 看错包、丢包和速率，是判断链路质量最快的一组命令。\ndisplay interface brief\ndisplay interface\ndisplay counters inbound interface\ndisplay counters outbound interface\ndisplay counters rate inbound interface\ndisplay counters rate outbound interface\ndisplay interface | include error\ndisplay interface transceiver verbose\n\n# ---- 二层转发表 ----\n# mac-address flapping record 直接列出 MAC 漂移记录，是定位环路最直接的线索。\ndisplay vlan\ndisplay vlan summary\ndisplay mac-address\ndisplay mac-address flapping record\ndisplay eth-trunk\ndisplay stp brief\ndisplay stp root\ndisplay lldp neighbor brief\n\n# ---- 三层与地址 ----\n# 先看路由表里有没有你要的那条，再看 ARP 学没学到对端。\ndisplay ip routing-table\ndisplay ip routing-table statistics\ndisplay arp all\ndisplay ip interface brief\ndisplay dhcp server ip-in-use\ndisplay dhcp relay statistics\ndisplay vrrp brief\ndisplay ospf peer\ndisplay ospf routing\n\n# ---- 安全与接入 ----\n# 命中计数长期为 0 的规则，往往说明它根本没生效。\ndisplay dhcp snooping binding\ndisplay dhcp snooping statistics\ndisplay arp anti-attack statistics check user-bind interface\ndisplay port-security\ndisplay port-security intrusion\ndisplay ip source check user-bind\ndisplay dot1x\ndisplay acl all\ndisplay traffic-filter applied-record\n\n# ---- 硬件与光模块 ----\n# 光模块收发功率是排查「链路 up 但丢包」的关键数据。\ndisplay transceiver interface\ndisplay transceiver verbose\ndisplay poe interface\ndisplay poe power-state\ndisplay power-supply\ndisplay elabel\n\n# ---- 日志与告警 ----\n# 异常重启原因和日志缓冲是定位设备自身问题的入口。\ndisplay logbuffer\ndisplay logbuffer summary\ndisplay trapbuffer\ndisplay alarm active\ndisplay reset-reason\ndisplay cpu-usage history\n\n# ---- 保存当前配置（便于与巡检输出对照） ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] display diagnostic-information 与部分统计清零类命令会占用较多 CPU，请在业务低谷期执行。\n\n# --------------------------------------------------------------------\n# [提示] 以上全部是查询命令，不会改动设备配置，可以放心执行。\n# [提示] 巡检建议在业务低谷期做，部分 display 命令会占用较多 CPU。\n# [提示] 报障时先在故障时刻留存一遍，再和正常时刻的输出对比，差异就是线索。\n# [提示] 生成的是一整批查询命令，逐段复制到设备上执行即可，不会改动任何配置。","cisco":"\n# ---- 设备信息与资源 ----\n# 开局先留一份基线，出问题时拿它对比。\nshow version\nshow inventory\nshow clock\nshow processes cpu sorted\nshow processes memory sorted\nshow boot\nshow environment all\nshow module\n\n# ---- 接口与流量 ----\n# 看错包、丢包和速率，是判断链路质量最快的一组命令。\nshow interfaces status\nshow interfaces\nshow interfaces counters errors\nshow interfaces counters\nshow interfaces | include error|drops\nshow interfaces link\nshow controllers ethernet-controller phy\n\n# ---- 二层转发表 ----\n# MAC 表在两三个口之间来回跳，基本就是环路或 MAC 漂移。\nshow vlan brief\nshow vlan\nshow mac address-table\nshow mac address-table count\nshow etherchannel summary\nshow spanning-tree\nshow spanning-tree summary\nshow cdp neighbors detail\nshow lldp neighbors\n\n# ---- 三层与地址 ----\n# 先看路由表里有没有你要的那条，再看 ARP 学没学到对端。\nshow ip route\nshow ip route summary\nshow arp\nshow ip interface brief\nshow ip dhcp binding\nshow standby brief\nshow ip ospf neighbor\nshow ip ospf route\n\n# ---- 安全与接入 ----\n# 命中计数长期为 0 的规则，往往说明它根本没生效。\nshow ip dhcp snooping\nshow ip dhcp snooping binding\nshow ip arp inspection\nshow ip arp inspection statistics\nshow port-security\nshow port-security address\nshow ip verify source\nshow authentication sessions\nshow access-lists\nshow policy-map interface\n\n# ---- 硬件与光模块 ----\n# 光模块收发功率是排查「链路 up 但丢包」的关键数据。\nshow interfaces transceiver\nshow interfaces transceiver detail\nshow power inline\nshow env all\nshow env power\n\n# ---- 日志与告警 ----\n# err-disabled 列表能一眼看出哪些口被保护机制关掉了。\nshow logging\nshow logging | include %\nshow archive log config all\nshow version | include uptime\nshow reload\nshow errdisable recovery\nshow interfaces status err-disabled\n\n# ---- 保存当前配置（便于与巡检输出对照） ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] show tech-support 会占用较多 CPU 且输出很长，请在业务低谷期执行，并把终端日志功能打开，否则刷屏的内容会丢。\n\n# --------------------------------------------------------------------\n# [提示] 以上全部是查询命令，不会改动设备配置，可以放心执行。\n# [提示] 巡检建议在业务低谷期做，部分 display 命令会占用较多 CPU。\n# [提示] 报障时先在故障时刻留存一遍，再和正常时刻的输出对比，差异就是线索。\n# [提示] 生成的是一整批查询命令，逐段复制到设备上执行即可，不会改动任何配置。","ruijie":"\n# ---- 设备信息与资源 ----\n# 开局先留一份基线，出问题时拿它对比。\nshow version\nshow version slots\nshow clock\nshow cpu\nshow memory\nshow boot\nshow environment\nshow fan\nshow power\n\n# ---- 接口与流量 ----\n# 看错包、丢包和速率，是判断链路质量最快的一组命令。\nshow interfaces status\nshow interfaces\nshow interfaces counters errors\nshow interfaces counters summary\nshow interfaces counters rate\nshow interfaces transceiver\n\n# ---- 二层转发表 ----\n# MAC 表在两三个口之间来回跳，基本就是环路或 MAC 漂移。\nshow vlan\nshow vlan brief\nshow mac-address-table\nshow mac-address-table count\nshow interfaces aggregateport\nshow spanning-tree\nshow spanning-tree summary\nshow lldp neighbors\nshow lldp neighbors detail\n\n# ---- 三层与地址 ----\n# 先看路由表里有没有你要的那条，再看 ARP 学没学到对端。\nshow ip route\nshow ip route summary\nshow arp\nshow ip interface brief\nshow ip dhcp binding\nshow vrrp brief\nshow ip ospf neighbor\nshow ip ospf route\n\n# ---- 安全与接入 ----\n# 命中计数长期为 0 的规则，往往说明它根本没生效。\nshow ip dhcp snooping\nshow ip dhcp snooping binding\nshow ip arp inspection\nshow ip arp inspection statistics\nshow port-security\nshow port-security address\nshow dot1x\nshow acl\nshow storm-control\n\n# ---- 硬件与光模块 ----\n# 光模块收发功率是排查「链路 up 但丢包」的关键数据。\nshow interfaces transceiver\nshow interfaces transceiver diagnosis\nshow poe interfaces\nshow poe power\nshow power-supply\n\n# ---- 日志与告警 ----\n# 日志缓冲多少能看出设备最近有没有被反复重启。\nshow logging\nshow logging buffer\nshow logging server\nshow alarm\nshow version | include uptime\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 个别 show 命令随 RGOS 版本不同（例如聚合口状态、光模块信息），下发前请用 ? 确认本机写法。\n\n# --------------------------------------------------------------------\n# [提示] 以上全部是查询命令，不会改动设备配置，可以放心执行。\n# [提示] 巡检建议在业务低谷期做，部分 display 命令会占用较多 CPU。\n# [提示] 报障时先在故障时刻留存一遍，再和正常时刻的输出对比，差异就是线索。\n# [提示] 生成的是一整批查询命令，逐段复制到设备上执行即可，不会改动任何配置。"}}]},{"key":"backup","name":"配置备份与恢复","group":"运维","summary":"把配置存到 TFTP / FTP 服务器，出问题时能一键回滚。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。","恢复配置需要重启设备才完全生效，务必在维护窗口内操作。","脚本里如果写了密码，是明文的，用完请立刻更换。"],"params":[{"label":"要做什么","help":"","example":"","default":"backup"},{"label":"传输方式","help":"","example":"","default":"tftp"},{"label":"服务器地址","help":"","example":"10.0.0.100","default":"10.0.0.100"},{"label":"文件名","help":"备份时用这个名字存到服务器；恢复时按这个名字去取。","example":"SW-CORE-01.cfg","default":"SW-CORE-01.cfg"},{"label":"FTP 用户名","help":"仅 FTP 时使用。","example":"","default":"netbackup"},{"label":"FTP 密码","help":"仅 FTP 时使用。脚本里是明文，用完请改。","example":"","default":"Bak@2026"},{"label":"备份前先保存当前配置","help":"强烈建议勾上，否则备份到的可能是很久以前的启动配置。","example":"","default":"1"}],"samples":[{"label":"默认参数","values":{"要做什么":"备份当前配置到服务器","传输方式":"TFTP（简单，无认证）","服务器地址":"10.0.0.100","文件名":"SW-CORE-01.cfg","FTP 用户名":"netbackup","FTP 密码":"Bak@2026","备份前先保存当前配置":"启用"},"commands":{"h3c":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置，而不是你现在跑着的运行配置。\nsystem-view\nsave force\n\n# ---- 备份配置到服务器 ----\n# 把设备上的启动配置文件上传到服务器。部分型号的实际文件名是 flash:/config.cfg 或 flash:/vrpcfg.zip，请先用 dir flash:/ 确认。\nsystem-view\ntftp 10.0.0.100 put flash:/startup.cfg SW-CORE-01.cfg\n\n# ---- 确认配置已保存 ----\n# 确认当前运行配置与已保存配置一致，避免备份到过期的版本。\nsystem-view\ndisplay saved-configuration\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","huawei":"\n# ---- 先保存当前配置 ----\n# save 会交互式询问是否确认，按 Y 即可。不先保存的话，备份走的是上一次保存过的配置。\nsystem-view\nsave\n\n# ---- 备份配置到服务器 ----\n# 华为的启动配置文件通常是 flash:/vrpcfg.zip，部分型号为 flash:/vrpcfg.cfg，请先用 dir flash:/ 确认。\nsystem-view\ntftp 10.0.0.100 put flash:/vrpcfg.zip SW-CORE-01.cfg\n\n# ---- 确认配置已保存 ----\n# 确认当前运行配置与已保存配置一致，避免备份到过期版本。\nsystem-view\ndisplay saved-configuration\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","cisco":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置。\nconfigure terminal\nwrite memory\nend\n\n# ---- 备份配置到服务器 ----\n# copy 会先问一句确认，回车即可。\nconfigure terminal\ncopy running-config tftp://10.0.0.100/SW-CORE-01.cfg\nend\n! 上面一条把当前运行配置传到服务器；\n! 想备份启动配置就换成：copy startup-config tftp://10.0.0.100/SW-CORE-01.cfg\n\n# ---- 确认已保存 ----\n# 对比一下启动配置和你以为的一致。\nconfigure terminal\nshow startup-config\nend\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","ruijie":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置。\nconfigure terminal\nwrite memory\nend\n\n# ---- 备份配置到服务器 ----\n# copy 会先问一句确认，回车即可。\nconfigure terminal\ncopy running-config tftp://10.0.0.100/SW-CORE-01.cfg\nend\n! 上面一条把当前运行配置传到服务器；\n! 想备份启动配置就换成：copy startup-config tftp://10.0.0.100/SW-CORE-01.cfg\n\n# ---- 核对结果 ----\n# 对比一下启动配置和你以为的一致。\nconfigure terminal\nshow startup-config\nend\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。"}},{"label":"从服务器恢复配置到设备","values":{"要做什么":"从服务器恢复配置到设备","传输方式":"TFTP（简单，无认证）","服务器地址":"10.0.0.100","文件名":"SW-CORE-01.cfg","FTP 用户名":"netbackup","FTP 密码":"Bak@2026","备份前先保存当前配置":"启用"},"commands":{"h3c":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置，而不是你现在跑着的运行配置。\nsystem-view\nsave force\n\n# ---- 从服务器恢复配置 ----\n# 把备份文件下载回设备。下载回来的文件会覆盖启动配置。\nsystem-view\ntftp 10.0.0.100 get SW-CORE-01.cfg flash:/startup.cfg\n\n# --------------------------------------------------------------------\n# [风险] 恢复配置需要重启设备才会完全生效，且会覆盖现有配置，请在维护窗口内操作，并提前做好当前配置的二次备份。\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","huawei":"\n# ---- 先保存当前配置 ----\n# save 会交互式询问是否确认，按 Y 即可。不先保存的话，备份走的是上一次保存过的配置。\nsystem-view\nsave\n\n# ---- 从服务器恢复配置 ----\n# 华为的启动配置文件通常是 flash:/vrpcfg.zip，部分型号为 flash:/vrpcfg.cfg，请先用 dir flash:/ 确认。\nsystem-view\ntftp 10.0.0.100 get SW-CORE-01.cfg flash:/vrpcfg.zip\n\n# --------------------------------------------------------------------\n# [风险] 恢复配置需要重启设备才完全生效，且会覆盖现有配置，请在维护窗口内操作，并提前做好当前配置的二次备份。\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","cisco":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置。\nconfigure terminal\nwrite memory\nend\n\n# ---- 从服务器恢复配置 ----\n# 导入后建议先 write memory 保存，再找维护窗口重启验证。\nconfigure terminal\ncopy tftp://10.0.0.100/SW-CORE-01.cfg running-config\n! 上面这条是「合并」进当前运行配置，不会删除已有配置；\n! 要整体替换启动配置则用：copy tftp://10.0.0.100/SW-CORE-01.cfg startup-config\nend\n\n# --------------------------------------------------------------------\n# [风险] 从服务器恢复配置：把文件直接覆盖 startup-config 后重启会替换全部配置，把文件导入 running-config 则是合并、不会删掉已有配置——两种效果差别很大，务必想清楚再执行。\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。","ruijie":"\n# ---- 先保存当前配置 ----\n# 不先保存的话，备份走的是上一次保存过的启动配置。\nconfigure terminal\nwrite memory\nend\n\n# ---- 从服务器恢复配置 ----\n# 导入后建议先 write memory 保存，再找维护窗口重启验证。\nconfigure terminal\ncopy tftp://10.0.0.100/SW-CORE-01.cfg running-config\n! 上面这条是「合并」进当前运行配置，不会删除已有配置；\n! 要整体替换启动配置则用：copy tftp://10.0.0.100/SW-CORE-01.cfg startup-config\nend\n\n# --------------------------------------------------------------------\n# [风险] 把文件覆盖 startup-config 后重启会替换全部配置，导入 running-config 则是合并、不会删掉已有配置——两种效果差别很大。\n\n# --------------------------------------------------------------------\n# [提示] 服务器地址 10.0.0.100，文件名 SW-CORE-01.cfg，传输方式 TFTP。\n# [提示] 备份前先 save，否则存走的是上次保存的启动配置，不是当前运行配置。\n# [提示] 恢复配置需要重启设备才完全生效，务必在维护窗口内操作。\n# [提示] 脚本里如果写了密码，是明文的，用完请立刻更换。"}}]},{"key":"syslog","name":"日志与时钟","group":"运维","summary":"把日志送到日志服务器，并让设备时间保持准确。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["先把时钟对准，日志才有价值；建议同时配 NTP。","日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。"],"params":[{"label":"日志服务器地址","help":"选填。留空则只配本地日志。","example":"10.0.0.7","default":"10.0.0.7"},{"label":"上报级别","help":"","example":"","default":"informational"},{"label":"日志带时间戳","help":"没有时间戳的日志在排障时几乎没用。","example":"","default":"1"},{"label":"NTP 服务器","help":"选填。和日志服务器一样，都是为了把时间对齐。","example":"10.0.0.5","default":"10.0.0.5"},{"label":"时区","help":"","example":"UTC+08:00","default":"UTC+08:00"},{"label":"本地日志缓冲条数","help":"设备本地能保存多少条日志。","example":"","default":"512"},{"label":"同步输出到控制台","help":"勾上会把日志实时打到 console 口，调试时方便，平时建议关掉。","example":"","default":"0"}],"samples":[{"label":"默认参数","values":{"日志服务器地址":"10.0.0.7","上报级别":"informational（常规信息，推荐）","日志带时间戳":"启用","NTP 服务器":"10.0.0.5","时区":"UTC+08:00","本地日志缓冲条数":"512","同步输出到控制台":"不启用"},"commands":{"h3c":"\n# ---- 开启信息中心 ----\n# info-center enable 是日志功能的总开关，logbuffer size 决定本地能存多少条日志。\nsystem-view\ninfo-center enable\ninfo-center logbuffer size 512\nclock timezone UTC add 08:00:00\n\n# ---- 日志加时间戳 ----\n# 没有时间戳的日志在排障时几乎用不上，这一条建议保持开启。\nsystem-view\ninfo-center timestamp loghost date\ninfo-center timestamp log date\ninfo-center format unicom\n\n# ---- 配置日志服务器 ----\n# 只把 informational 及以上级别的日志送到服务器，避免刷屏。\nsystem-view\ninfo-center loghost 10.0.0.7\ninfo-center source default loghost level informational\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信了，NTP 和日志要一起配。\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nsystem-view\ndisplay info-center\ndisplay logbuffer summary\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","huawei":"\n# ---- 开启信息中心 ----\n# info-center enable 是日志功能的总开关，logbuffer size 决定本地能存多少条日志。\nsystem-view\ninfo-center enable\ninfo-center logbuffer size 512\nclock timezone UTC add 08:00:00\n\n# ---- 日志加时间戳 ----\n# 没有时间戳的日志在排障时几乎用不上，这一条建议保持开启。\nsystem-view\ninfo-center timestamp loghost date\ninfo-center timestamp log date\n\n# ---- 配置日志服务器 ----\n# 华为的日志级别在 info-center source 命令里按模块单独设置，默认送出的级别已经覆盖 informational，如需收窄请用 info-center source default channel loghost log level informational。\nsystem-view\ninfo-center loghost 10.0.0.7\n\n# ---- NTP 时间同步 ----\n# 华为从 V200R003 起 NTP 默认就是开启的，只配服务器地址即可。时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nsystem-view\nntp-service unicast-server 10.0.0.5\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nsystem-view\ndisplay info-center\ndisplay logbuffer summary\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","cisco":"\n# ---- 配置本地日志 ----\n# service timestamps ... localtime 让日志带本地时间，没有时间戳的日志在排障时几乎用不上。思科默认不往 console 打日志，要开就加 logging console。\nconfigure terminal\nlogging buffered 512\nservice timestamps log datetime msec localtime show-timezone\nclock timezone UTC 8\nend\n\n# ---- 配置日志服务器 ----\n# 只把 informational 及以上级别的日志送到服务器，避免刷屏。logging source-interface 请改成实际的管理口。\nconfigure terminal\nlogging host 10.0.0.7\nlogging trap informational\nlogging source-interface Vlan1\nend\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nconfigure terminal\nntp server 10.0.0.5\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nconfigure terminal\nshow logging\nshow clock\nend\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","ruijie":"\n# ---- 配置本地日志 ----\n# service timestamps ... localtime 让日志带本地时间，没有时间戳的日志在排障时几乎用不上。锐捷默认不往 console 打日志，要开就加 logging console。\nconfigure terminal\nlogging on\nlogging buffered 512\nservice timestamps log datetime msec localtime show-timezone\nclock timezone UTC 8\nend\n\n# ---- 配置日志服务器 ----\n# 只把 informational 及以上级别的日志送到服务器，避免刷屏。部分 RGOS 版本的写法是 logging host，下发前用 ? 确认。\nconfigure terminal\nlogging server 10.0.0.7\nlogging trap informational\nend\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nconfigure terminal\nntp server 10.0.0.5\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nconfigure terminal\nshow logging\nshow clock\nend\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。"}},{"label":"warning（只报警告及以上）","values":{"日志服务器地址":"10.0.0.7","上报级别":"warning（只报警告及以上）","日志带时间戳":"启用","NTP 服务器":"10.0.0.5","时区":"UTC+08:00","本地日志缓冲条数":"512","同步输出到控制台":"不启用"},"commands":{"h3c":"\n# ---- 开启信息中心 ----\n# info-center enable 是日志功能的总开关，logbuffer size 决定本地能存多少条日志。\nsystem-view\ninfo-center enable\ninfo-center logbuffer size 512\nclock timezone UTC add 08:00:00\n\n# ---- 日志加时间戳 ----\n# 没有时间戳的日志在排障时几乎用不上，这一条建议保持开启。\nsystem-view\ninfo-center timestamp loghost date\ninfo-center timestamp log date\ninfo-center format unicom\n\n# ---- 配置日志服务器 ----\n# 只把 warning 及以上级别的日志送到服务器，避免刷屏。\nsystem-view\ninfo-center loghost 10.0.0.7\ninfo-center source default loghost level warning\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信了，NTP 和日志要一起配。\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nsystem-view\ndisplay info-center\ndisplay logbuffer summary\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","huawei":"\n# ---- 开启信息中心 ----\n# info-center enable 是日志功能的总开关，logbuffer size 决定本地能存多少条日志。\nsystem-view\ninfo-center enable\ninfo-center logbuffer size 512\nclock timezone UTC add 08:00:00\n\n# ---- 日志加时间戳 ----\n# 没有时间戳的日志在排障时几乎用不上，这一条建议保持开启。\nsystem-view\ninfo-center timestamp loghost date\ninfo-center timestamp log date\n\n# ---- 配置日志服务器 ----\n# 华为的日志级别在 info-center source 命令里按模块单独设置，默认送出的级别已经覆盖 warning，如需收窄请用 info-center source default channel loghost log level warning。\nsystem-view\ninfo-center loghost 10.0.0.7\n\n# ---- NTP 时间同步 ----\n# 华为从 V200R003 起 NTP 默认就是开启的，只配服务器地址即可。时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nsystem-view\nntp-service unicast-server 10.0.0.5\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nsystem-view\ndisplay info-center\ndisplay logbuffer summary\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","cisco":"\n# ---- 配置本地日志 ----\n# service timestamps ... localtime 让日志带本地时间，没有时间戳的日志在排障时几乎用不上。思科默认不往 console 打日志，要开就加 logging console。\nconfigure terminal\nlogging buffered 512\nservice timestamps log datetime msec localtime show-timezone\nclock timezone UTC 8\nend\n\n# ---- 配置日志服务器 ----\n# 只把 warning 及以上级别的日志送到服务器，避免刷屏。logging source-interface 请改成实际的管理口。\nconfigure terminal\nlogging host 10.0.0.7\nlogging trap warning\nlogging source-interface Vlan1\nend\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nconfigure terminal\nntp server 10.0.0.5\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nconfigure terminal\nshow logging\nshow clock\nend\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。","ruijie":"\n# ---- 配置本地日志 ----\n# service timestamps ... localtime 让日志带本地时间，没有时间戳的日志在排障时几乎用不上。锐捷默认不往 console 打日志，要开就加 logging console。\nconfigure terminal\nlogging on\nlogging buffered 512\nservice timestamps log datetime msec localtime show-timezone\nclock timezone UTC 8\nend\n\n# ---- 配置日志服务器 ----\n# 只把 warning 及以上级别的日志送到服务器，避免刷屏。部分 RGOS 版本的写法是 logging host，下发前用 ? 确认。\nconfigure terminal\nlogging server 10.0.0.7\nlogging trap warning\nend\n\n# ---- NTP 时间同步 ----\n# 时钟不准，日志的先后顺序就不可信，NTP 要和日志一起配。\nconfigure terminal\nntp server 10.0.0.5\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 验证日志是否送达 ----\n# 配完在设备上制造一条日志（比如插拔一个端口），去服务器上确认收到了。\nconfigure terminal\nshow logging\nshow clock\nend\n\n# --------------------------------------------------------------------\n# [提示] 先把时钟对准，日志才有价值；建议同时配 NTP。\n# [提示] 日志服务器地址和数据网段要能通，配完记得验证一条日志是否送达。"}}]},{"key":"isis","name":"IS-IS 基础","group":"三层","summary":"运营商和大型园区骨干常用 IGP，比 OSPF 少一层 IP 依赖，扩展性好。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。","成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。","配完记得确认 Link State PDU 里的邻接层级与预期一致。"],"params":[{"label":"进程号","help":"本机有效即可，两端进程号不要求一致。","example":"","default":"1"},{"label":"NET 地址","help":"区域号 + 6 字节 System ID + 2 字节 NSEL（固定 00）。System ID 通常把 Loopback 的 IP 补全成 12 位，便于排障。","example":"49.0001.0000.0000.0001.00","default":"49.0001.0000.0000.0001.00"},{"label":"设备层级","help":"","example":"","default":"level-2"},{"label":"度量风格","help":"","example":"","default":"wide"},{"label":"三层接口 VLAN","help":"在这些 VLAN 的三层接口上启用 IS-IS，多个用逗号分隔。","example":"10,20","default":"10,20"},{"label":"三层物理口","help":"选填。填端口简写，如 1/0/1-2。思科 / 锐捷需要先 no switchport。","example":"1/0/1-2","default":""},{"label":"接口邻接层级","help":"","example":"","default":"follow"},{"label":"引入直连路由","help":"把直连网段发布进 IS-IS，一般都要开。","example":"","default":"1"},{"label":"接口验证","help":"对 Hello 报文做 MD5 验证，防止误接入。","example":"","default":"0"},{"label":"验证密钥","help":"仅开启验证时使用。","example":"","default":"Isis@2026"}],"samples":[{"label":"默认参数","values":{"进程号":"1","NET 地址":"49.0001.0000.0000.0001.00","设备层级":"Level-2（骨干，推荐）","度量风格":"wide（32 位，推荐）","三层接口 VLAN":"10,20","三层物理口":"","接口邻接层级":"跟随设备层级","引入直连路由":"启用","接口验证":"不启用","验证密钥":"Isis@2026"},"commands":{"h3c":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 官方建议 cost-style、is-level、network-entity 三条一起改时把 network-entity 放最后，避免配置顺序不对导致 IS-IS 进程重启。\nsystem-view\nisis 1\n is-level level-2\n cost-style wide\n network-entity 49.0001.0000.0000.0001.00\n quit\n\n# ---- 接口使能 IS-IS ----\n# 只能建单层邻接时用 isis circuit-level 限制，能少收一半的 PDU。\nsystem-view\ninterface Vlan-interface 10\n isis enable 1\n quit\ninterface Vlan-interface 20\n isis enable 1\n quit\n\n# ---- 引入直连路由 ----\n# import-route 必须敲在 address-family ipv4 视图里，在 isis 主视图敲会报 Unrecognized command。\nsystem-view\nisis 1\n address-family ipv4\n  import-route direct\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nsystem-view\ndisplay isis peer\ndisplay isis route\ndisplay isis lsdb\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","huawei":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 官方建议 cost-style、is-level、network-entity 三条一起改时把 network-entity 放最后，避免配置顺序不对导致 IS-IS 进程重启。\nsystem-view\nisis 1\n is-level level-2\n cost-style wide\n network-entity 49.0001.0000.0000.0001.00\n quit\n\n# ---- 接口使能 IS-IS ----\n# 只能建单层邻接时用 isis circuit-level 限制。华为还支持 hmac-sha256，写法是 isis authentication-mode hmac-sha256 key-id 1 cipher <密钥>。\nsystem-view\ninterface Vlanif10\n isis enable 1\n quit\ninterface Vlanif20\n isis enable 1\n quit\n\n# ---- 引入直连路由 ----\n# import-route 放在 address-family ipv4 视图里。\nsystem-view\nisis 1\n address-family ipv4\n  import-route direct\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nsystem-view\ndisplay isis peer\ndisplay isis route\ndisplay isis lsdb\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","cisco":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 思科 / 锐捷的层级关键字是 level-2-only（多一个 only），度量风格命令是 metric-style，都跟 H3C / 华为不一样。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter isis\n net 49.0001.0000.0000.0001.00\n is-type level-2-only\n metric-style wide\n exit\nend\n\n# ---- 三层接口配置 ----\n# 接口下用 ip router isis 使能，只能建单层邻接时用 isis circuit-type 限制。\nconfigure terminal\ninterface Vlan10\n ip router isis\n exit\ninterface Vlan20\n ip router isis\n exit\nend\n\n# ---- 引入直连路由 ----\n# 把直连网段发布进 IS-IS，一般都要开。\nconfigure terminal\nrouter isis\n redistribute connected\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nconfigure terminal\nshow isis neighbors\nshow ip route isis\nend\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","ruijie":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 锐捷与思科同源，层级关键字是 level-2-only，度量风格是 metric-style。部分 RGOS 版本的 metric-style 命令名不同，下发前用 ? 确认。\nconfigure terminal\nip routing\nrouter isis\n net 49.0001.0000.0000.0001.00\n is-type level-2-only\n metric-style wide\n exit\nend\n\n# ---- 三层接口配置 ----\n# 接口下用 ip router isis 使能。\nconfigure terminal\ninterface Vlan 10\n ip router isis\n exit\ninterface Vlan 20\n ip router isis\n exit\nend\n\n# ---- 引入直连路由 ----\n# 把直连网段发布进 IS-IS，一般都要开。\nconfigure terminal\nrouter isis\n redistribute connected\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nconfigure terminal\nshow isis neighbors\nshow ip route isis\nend\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。"}},{"label":"Level-1（区域内）","values":{"进程号":"1","NET 地址":"49.0001.0000.0000.0001.00","设备层级":"Level-1（区域内）","度量风格":"wide（32 位，推荐）","三层接口 VLAN":"10,20","三层物理口":"","接口邻接层级":"跟随设备层级","引入直连路由":"启用","接口验证":"不启用","验证密钥":"Isis@2026"},"commands":{"h3c":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 官方建议 cost-style、is-level、network-entity 三条一起改时把 network-entity 放最后，避免配置顺序不对导致 IS-IS 进程重启。\nsystem-view\nisis 1\n is-level level-1\n cost-style wide\n network-entity 49.0001.0000.0000.0001.00\n quit\n\n# ---- 接口使能 IS-IS ----\n# 只能建单层邻接时用 isis circuit-level 限制，能少收一半的 PDU。\nsystem-view\ninterface Vlan-interface 10\n isis enable 1\n quit\ninterface Vlan-interface 20\n isis enable 1\n quit\n\n# ---- 引入直连路由 ----\n# import-route 必须敲在 address-family ipv4 视图里，在 isis 主视图敲会报 Unrecognized command。\nsystem-view\nisis 1\n address-family ipv4\n  import-route direct\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nsystem-view\ndisplay isis peer\ndisplay isis route\ndisplay isis lsdb\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","huawei":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 官方建议 cost-style、is-level、network-entity 三条一起改时把 network-entity 放最后，避免配置顺序不对导致 IS-IS 进程重启。\nsystem-view\nisis 1\n is-level level-1\n cost-style wide\n network-entity 49.0001.0000.0000.0001.00\n quit\n\n# ---- 接口使能 IS-IS ----\n# 只能建单层邻接时用 isis circuit-level 限制。华为还支持 hmac-sha256，写法是 isis authentication-mode hmac-sha256 key-id 1 cipher <密钥>。\nsystem-view\ninterface Vlanif10\n isis enable 1\n quit\ninterface Vlanif20\n isis enable 1\n quit\n\n# ---- 引入直连路由 ----\n# import-route 放在 address-family ipv4 视图里。\nsystem-view\nisis 1\n address-family ipv4\n  import-route direct\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nsystem-view\ndisplay isis peer\ndisplay isis route\ndisplay isis lsdb\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","cisco":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 思科 / 锐捷的层级关键字是 level-2-only（多一个 only），度量风格命令是 metric-style，都跟 H3C / 华为不一样。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter isis\n net 49.0001.0000.0000.0001.00\n is-type level-1\n metric-style wide\n exit\nend\n\n# ---- 三层接口配置 ----\n# 接口下用 ip router isis 使能，只能建单层邻接时用 isis circuit-type 限制。\nconfigure terminal\ninterface Vlan10\n ip router isis\n exit\ninterface Vlan20\n ip router isis\n exit\nend\n\n# ---- 引入直连路由 ----\n# 把直连网段发布进 IS-IS，一般都要开。\nconfigure terminal\nrouter isis\n redistribute connected\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nconfigure terminal\nshow isis neighbors\nshow ip route isis\nend\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。","ruijie":"\n# ---- 启用 IS-IS 并配置 NET ----\n# 锐捷与思科同源，层级关键字是 level-2-only，度量风格是 metric-style。部分 RGOS 版本的 metric-style 命令名不同，下发前用 ? 确认。\nconfigure terminal\nip routing\nrouter isis\n net 49.0001.0000.0000.0001.00\n is-type level-1\n metric-style wide\n exit\nend\n\n# ---- 三层接口配置 ----\n# 接口下用 ip router isis 使能。\nconfigure terminal\ninterface Vlan 10\n ip router isis\n exit\ninterface Vlan 20\n ip router isis\n exit\nend\n\n# ---- 引入直连路由 ----\n# 把直连网段发布进 IS-IS，一般都要开。\nconfigure terminal\nrouter isis\n redistribute connected\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对邻居与路由 ----\n# 先看邻接是不是 Up，再看路由表里有没有学到对端网段。\nconfigure terminal\nshow isis neighbors\nshow ip route isis\nend\n\n# --------------------------------------------------------------------\n# [提示] 同一台设备只能有一个 IS-IS 实例运行在 Level-2（含 Level-1-2）。\n# [提示] 同一台设备只能有一个 IS-IS 实例跑在 Level-2（含 Level-1-2）。\n# [提示] 成本风格（narrow / wide）全网必须一致，否则算出来的路径可能不对。\n# [提示] 配完记得确认 Link State PDU 里的邻接层级与预期一致。"}}]},{"key":"bgp","name":"BGP 基础（EBGP / IBGP）","group":"三层","summary":"互联网出口和跨域互联的标配，含邻居、宣告网段、MD5 验证。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["H3C / 华为必须进地址族视图再用 peer enable 激活邻居，光创建邻居不激活，邻居是连不上的。","IBGP 邻居建议用 Loopback 建，并配 connect-interface / update-source。","宣告的网段要在本机路由表里存在，且掩码要写对。"],"params":[{"label":"本机 AS 号","help":"","example":"","default":"65001"},{"label":"Router ID","help":"建议手工指定成 Loopback 地址，别让它自动选举。","example":"","default":"1.1.1.1"},{"label":"邻居列表","help":"每行一条：邻居 IP 对端 AS [描述]。IBGP 的对端 AS 填本机 AS 即可。","example":"10.0.0.2 65002","default":"10.0.0.2 65002\n10.0.0.3 65003"},{"label":"宣告网段","help":"每行一条，写 网段/掩码长度。网段必须在本机路由表里存在，否则宣告不出去。","example":"192.168.10.0/24","default":"192.168.10.0/24"},{"label":"同时引入直连路由","help":"偷懒的写法，会把所有直连网段都发出去，注意别把不该发的也发了。","example":"","default":"0"},{"label":"开启 TCP MD5 验证","help":"两端必须配同一个密钥，不一致会一直连不上。","example":"","default":"0"},{"label":"MD5 密钥","help":"仅开启验证时使用。","example":"","default":"Bgp@2026"},{"label":"Keepalive / Hold","help":"选填。留空用设备默认（一般 60 秒 / 180 秒）。","example":"30 90","default":""}],"samples":[{"label":"默认参数","values":{"本机 AS 号":"65001","Router ID":"1.1.1.1","邻居列表":"10.0.0.2 65002\n10.0.0.3 65003","宣告网段":"192.168.10.0/24","同时引入直连路由":"不启用","开启 TCP MD5 验证":"不启用","MD5 密钥":"Bgp@2026","Keepalive / Hold":""},"commands":{"h3c":"\n# ---- 配置 BGP 与邻居 ----\n# Comware V7 必须在 address-family ipv4 unicast 里再 peer enable 一次，只创建邻居不激活，会话建不起来。\nsystem-view\nbgp 65001\n router-id 1.1.1.1\n peer 10.0.0.2 as-number 65002\n peer 10.0.0.3 as-number 65003\n address-family ipv4 unicast\n  peer 10.0.0.2 enable\n  peer 10.0.0.3 enable\n  network 192.168.10.0 255.255.255.0\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对邻居与路由 ----\n# State 要是 Established，路由表里要有你要的网段。\nsystem-view\ndisplay bgp peer ipv4\ndisplay bgp routing-table ipv4\n\n# --------------------------------------------------------------------\n# [提示] IBGP 邻居建议用 Loopback 建，并配 peer <地址> connect-interface Loopback0。\n# [提示] H3C / 华为必须进地址族视图再用 peer enable 激活邻居，光创建邻居不激活，邻居是连不上的。\n# [提示] IBGP 邻居建议用 Loopback 建，并配 connect-interface / update-source。\n# [提示] 宣告的网段要在本机路由表里存在，且掩码要写对。","huawei":"\n# ---- 配置 BGP 与邻居 ----\n# 华为的地址族关键字是 ipv4-family（不是 address-family），而且必须进 ipv4-family unicast 再 peer enable 一次。\nsystem-view\nbgp 65001\n router-id 1.1.1.1\n peer 10.0.0.2 as-number 65002\n peer 10.0.0.3 as-number 65003\n ipv4-family unicast\n  peer 10.0.0.2 enable\n  peer 10.0.0.3 enable\n  network 192.168.10.0 255.255.255.0\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对邻居与路由 ----\n# State 要是 Established，路由表里要有你要的网段。\nsystem-view\ndisplay bgp peer\ndisplay bgp routing-table\n\n# --------------------------------------------------------------------\n# [提示] IBGP 建议用 Loopback 建邻居，并配 peer <地址> connect-interface LoopBack0。\n# [提示] H3C / 华为必须进地址族视图再用 peer enable 激活邻居，光创建邻居不激活，邻居是连不上的。\n# [提示] IBGP 邻居建议用 Loopback 建，并配 connect-interface / update-source。\n# [提示] 宣告的网段要在本机路由表里存在，且掩码要写对。","cisco":"\n# ---- 配置 BGP 与邻居 ----\n# 思科 / 锐捷的邻居命令是 neighbor（H3C / 华为是 peer），Router ID 写成 bgp router-id，并默认激活，不需要额外地址族激活。\nconfigure terminal\nip routing\nrouter bgp 65001\n bgp router-id 1.1.1.1\n bgp log-neighbor-changes\n neighbor 10.0.0.2 remote-as 65002\n neighbor 10.0.0.3 remote-as 65003\n network 192.168.10.0 mask 255.255.255.0\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对邻居与路由 ----\n# State/PfxRcd 那一列出现数字就是 Established。\nconfigure terminal\nshow ip bgp summary\nshow ip bgp\nend\n\n# --------------------------------------------------------------------\n# [提示] IBGP 建议用 Loopback 建邻居，并配 neighbor <地址> update-source Loopback0。\n# [提示] H3C / 华为必须进地址族视图再用 peer enable 激活邻居，光创建邻居不激活，邻居是连不上的。\n# [提示] IBGP 邻居建议用 Loopback 建，并配 connect-interface / update-source。\n# [提示] 宣告的网段要在本机路由表里存在，且掩码要写对。","ruijie":"\n# ---- 配置 BGP 与邻居 ----\n# 锐捷的 BGP 语法与思科基本一致，邻居命令是 neighbor。三层交换机别忘了 ip routing。\nconfigure terminal\nip routing\nrouter bgp 65001\n bgp router-id 1.1.1.1\n bgp log-neighbor-changes\n neighbor 10.0.0.2 remote-as 65002\n neighbor 10.0.0.3 remote-as 65003\n network 192.168.10.0 mask 255.255.255.0\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对邻居与路由 ----\n# State/PfxRcd 那一列出现数字就是 Established。\nconfigure terminal\nshow bgp summary\nshow bgp ipv4 unicast\nend\n\n# -------------
