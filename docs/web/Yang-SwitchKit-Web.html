-------------------------------------------------------\n# [提示] IBGP 建议用 Loopback 建邻居，并配 neighbor <地址> update-source Loopback 0。\n# [提示] H3C / 华为必须进地址族视图再用 peer enable 激活邻居，光创建邻居不激活，邻居是连不上的。\n# [提示] IBGP 邻居建议用 Loopback 建，并配 connect-interface / update-source。\n# [提示] 宣告的网段要在本机路由表里存在，且掩码要写对。"}}]},{"key":"mplsvpn","name":"MPLS L3VPN（PE 侧）","group":"三层","summary":"运营商 MPLS 专网的核心：LDP 建隧道，VPN 实例隔离用户，MP-BGP 传 VPN 路由。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["生成的是 PE 侧配置。P 设备只需要中间的 MPLS + LDP 部分，不需要 VPN 实例。","公网侧必须先跑通 IGP（OSPF 或 IS-IS），且 Loopback 要宣告进去，LDP 邻居才建得起来。建议先配那两条场景。","RD 用来区分不同 VPN 的同网段路由；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值，配反了就是不通。","两台 PE 上的 VPN 实例名可以不同，但 RD、RT、VPN 路由的下一跳必须理清。"],"params":[{"label":"LSR ID","help":"MPLS 域内的唯一标识，通常就是本机 Loopback 地址。","example":"","default":"1.1.1.1"},{"label":"本域 AS 号","help":"PE 之间跑 MP-BGP 用的 AS 号。","example":"","default":"100"},{"label":"对端 PE 的 Loopback","help":"MP-BGP 邻居地址，两端要能互相 ping 通（靠 IGP 打通）。","example":"","default":"2.2.2.2"},{"label":"公网侧 VLAN","help":"PE / P 之间互联的 VLAN，会用它的三层接口跑 MPLS。","example":"","default":"100"},{"label":"公网侧本机地址","help":"","example":"","default":"10.0.0.1"},{"label":"公网侧掩码长度","help":"点对点互联一般用 30。","example":"","default":"30"},{"label":"VPN 实例名","help":"本机有效即可，两台 PE 上名字不要求一致。","example":"","default":"VPNA"},{"label":"RD（路由标识）","help":"同一条 RD 不要在两台 PE 上重复，否则会冲突。","example":"100:1","default":"100:1"},{"label":"RT 导入值","help":"本机导入值 = 对端 PE 的导出值。","example":"100:1","default":"100:1"},{"label":"RT 导出值","help":"本机导出值 = 对端 PE 的导入值。","example":"100:1","default":"100:1"},{"label":"接 CE 的 VLAN","help":"","example":"","default":"10"},{"label":"CE 侧本机地址","help":"","example":"","default":"10.1.1.2"},{"label":"CE 侧掩码长度","help":"","example":"","default":"24"},{"label":"CE 的 AS 号","help":"PE 与 CE 之间跑 EBGP 时用。","example":"","default":"65410"},{"label":"CE 的接口地址","help":"PE 的 EBGP 邻居地址。","example":"","default":"10.1.1.1"}],"samples":[{"label":"默认参数","values":{"LSR ID":"1.1.1.1","本域 AS 号":"100","对端 PE 的 Loopback":"2.2.2.2","公网侧 VLAN":"100","公网侧本机地址":"10.0.0.1","公网侧掩码长度":"30","VPN 实例名":"VPNA","RD（路由标识）":"100:1","RT 导入值":"100:1","RT 导出值":"100:1","接 CE 的 VLAN":"10","CE 侧本机地址":"10.1.1.2","CE 侧掩码长度":"24","CE 的 AS 号":"65410","CE 的接口地址":"10.1.1.1"},"commands":{"h3c":"\n# ---- 先建好 Loopback ----\n# LSR ID 用 Loopback 地址最稳，只要它不 down，LDP 会话就不会断。\nsystem-view\ninterface Loopback0\n ip address 1.1.1.1 32\n quit\n\n# ---- 开启 MPLS 与 LDP ----\n# 公网侧接口要同时开 mpls enable 和 mpls ldp enable，少一条标签就发不出去。接 CE 的接口不要开 MPLS。\nsystem-view\nmpls lsr-id 1.1.1.1\nmpls ldp\ninterface Vlan-interface 100\n ip address 10.0.0.1 30\n mpls enable\n mpls ldp enable\n quit\n\n# ---- 创建 VPN 实例 ----\n# RD 保证不同 VPN 的同网段路由不冲突；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值。\nsystem-view\nip vpn-instance VPNA\n route-distinguisher 100:1\n vpn-target 100:1 import-extcommunity\n vpn-target 100:1 export-extcommunity\n quit\n\n# ---- 把 CE 接口绑定到 VPN 实例 ----\n# 注意顺序：ip binding 会清掉接口上原有的 IP 配置，所以必须先绑实例再配地址，反了地址就没了。\nsystem-view\ninterface Vlan-interface 10\n ip binding vpn-instance VPNA\n ip address 10.1.1.2 24\n quit\n\n# ---- MP-BGP 传递 VPN 路由 ----\n# vpnv4 地址族负责 PE 之间传 VPN 路由；ip vpn-instance 下面是 PE 与 CE 之间的私网邻居。next-hop-local 让 PE 把下一跳改成本机，避免对端迭代不出隧道。\nsystem-view\nbgp 100\n peer 2.2.2.2 as-number 100\n peer 2.2.2.2 connect-interface Loopback0\n address-family vpnv4\n  peer 2.2.2.2 enable\n  peer 2.2.2.2 next-hop-local\n  quit\n ip vpn-instance VPNA\n  peer 10.1.1.1 as-number 65410\n  address-family ipv4 unicast\n   peer 10.1.1.1 enable\n   import-route direct\n   quit\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 分段核对 ----\n# 按顺序查：LDP 邻居通了没、标签有没有下发、VPN 实例建了没、MP-BGP 邻居起来没、VPN 路由收没收到。\nsystem-view\ndisplay mpls ldp peer\ndisplay mpls ldp lsp\ndisplay ip vpn-instance\ndisplay bgp peer vpnv4\ndisplay bgp vpnv4 vpn-instance VPNA\n\n# --------------------------------------------------------------------\n# [风险] MPLS 的前提是公网侧 IGP 已经跑通，而且两端的 Loopback 都要被宣告进 IGP，否则 LDP 会话建不起来。建议先配 OSPF 或 IS-IS 那两条场景。\n# [风险] PE 与 CE 之间的接口不要再开 MPLS，也不要绑两个 VPN 实例。\n\n# --------------------------------------------------------------------\n# [提示] 生成的是 PE 侧配置。P 设备只需要中间的 MPLS + LDP 部分，不需要 VPN 实例。\n# [提示] 公网侧必须先跑通 IGP（OSPF 或 IS-IS），且 Loopback 要宣告进去，LDP 邻居才建得起来。建议先配那两条场景。\n# [提示] RD 用来区分不同 VPN 的同网段路由；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值，配反了就是不通。\n# [提示] 两台 PE 上的 VPN 实例名可以不同，但 RD、RT、VPN 路由的下一跳必须理清。","huawei":"\n# ---- 先建好 LoopBack ----\n# LSR ID 用 Loopback 地址最稳，只要它不 down，LDP 会话就不会断。华为的环回口写法是 LoopBack0（大写 B）。\nsystem-view\ninterface LoopBack0\n ip address 1.1.1.1 32\n quit\n\n# ---- 开启 MPLS 与 LDP ----\n# 华为全局要打 mpls 和 mpls ldp 两条；接口下是 mpls 和 mpls ldp，注意不是 H3C 的 mpls enable。接 CE 的接口不要开 MPLS。\nsystem-view\nmpls lsr-id 1.1.1.1\nmpls\nmpls ldp\ninterface Vlanif100\n ip address 10.0.0.1 30\n mpls\n mpls ldp\n quit\n\n# ---- 创建 VPN 实例 ----\n# 华为的 RD / RT 要配在 ip vpn-instance 的 ipv4-family 子视图里，直接配在实例视图下会报错。\nsystem-view\nip vpn-instance VPNA\n ipv4-family\n  route-distinguisher 100:1\n  vpn-target 100:1 export-extcommunity\n  vpn-target 100:1 import-extcommunity\n  quit\n quit\n\n# ---- 把 CE 接口绑定到 VPN 实例 ----\n# 注意顺序：ip binding 会清掉接口上原有的 IP 配置，所以必须先绑实例再配地址，反了地址就没了。\nsystem-view\ninterface Vlanif10\n ip binding vpn-instance VPNA\n ip address 10.1.1.2 24\n quit\n\n# ---- MP-BGP 传递 VPN 路由 ----\n# ipv4-family vpnv4 管 PE 之间传 VPN 路由；ipv4-family vpn-instance 管 PE 与 CE 之间的私网邻居。policy vpn-target 是默认行为，显式写出来便于理解。\nsystem-view\nbgp 100\n peer 2.2.2.2 as-number 100\n peer 2.2.2.2 connect-interface LoopBack0\n ipv4-family vpnv4\n  policy vpn-target\n  peer 2.2.2.2 enable\n  quit\n ipv4-family vpn-instance VPNA\n  peer 10.1.1.1 as-number 65410\n  import-route direct\n  quit\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 分段核对 ----\n# 按顺序查：LDP 邻居通了没、标签有没有下发、VPN 实例建了没、MP-BGP 邻居起来没、VPN 路由收没收到。\nsystem-view\ndisplay mpls ldp peer\ndisplay mpls lsp\ndisplay ip vpn-instance\ndisplay bgp vpnv4 all peer\ndisplay bgp vpnv4 vpn-instance VPNA routing-table\n\n# --------------------------------------------------------------------\n# [风险] MPLS 的前提是公网侧 IGP 已经跑通，而且两端的 Loopback 都要被宣告进 IGP，否则 LDP 会话建不起来。建议先配 OSPF 或 IS-IS 那两条场景。\n# [风险] PE 与 CE 之间的接口不要再开 MPLS，也不要绑两个 VPN 实例。\n\n# --------------------------------------------------------------------\n# [提示] 生成的是 PE 侧配置。P 设备只需要中间的 MPLS + LDP 部分，不需要 VPN 实例。\n# [提示] 公网侧必须先跑通 IGP（OSPF 或 IS-IS），且 Loopback 要宣告进去，LDP 邻居才建得起来。建议先配那两条场景。\n# [提示] RD 用来区分不同 VPN 的同网段路由；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值，配反了就是不通。\n# [提示] 两台 PE 上的 VPN 实例名可以不同，但 RD、RT、VPN 路由的下一跳必须理清。","cisco":"\n# ---- 先建好 Loopback 并打开 CEF ----\n# 思科跑 MPLS 必须先开 CEF（ip cef），这是前置条件。\nconfigure terminal\nip cef\ninterface Loopback0\n ip address 1.1.1.1 255.255.255.255\n exit\nend\n\n# ---- 开启 MPLS 与 LDP ----\n# mpls ip 开在 P / PE 之间的公网接口上；接 CE 的接口不要开 MPLS。\nconfigure terminal\nmpls label protocol ldp\nmpls ldp router-id Loopback0 force\ninterface Vlan100\n ip address 10.0.0.1 255.255.255.252\n mpls ip\n exit\nend\n\n# ---- 创建 VRF ----\n# 思科 / 锐捷用 ip vrf（老写法）；较新的 IOS-XE 也可以写 vrf definition，两者不能混用。\nconfigure terminal\nip vrf VPNA\n rd 100:1\n route-target export 100:1\n route-target import 100:1\n exit\nend\n\n# ---- 把 CE 接口划入 VRF ----\n# 注意顺序：ip vrf forwarding 会清掉接口上原有的 IP 配置，所以必须先划 VRF 再配地址，反了地址就没了。\nconfigure terminal\ninterface Vlan10\n ip vrf forwarding VPNA\n ip address 10.1.1.2 255.255.255.0\n exit\nend\n\n# ---- MP-BGP 传递 VPN 路由 ----\n# no bgp default ipv4-unicast 是 PE 上的常用开关，避免公网 IPv4 路由被无谓地发出去。send-community extended 必须配，VPNv4 靠扩展团体传 RT。\nconfigure terminal\nrouter bgp 100\n no bgp default ipv4-unicast\n neighbor 2.2.2.2 remote-as 100\n neighbor 2.2.2.2 update-source Loopback0\n address-family vpnv4\n  neighbor 2.2.2.2 activate\n  neighbor 2.2.2.2 send-community extended\n  exit-address-family\n address-family ipv4 vrf VPNA\n  neighbor 10.1.1.1 remote-as 65410\n  neighbor 10.1.1.1 activate\n  redistribute connected\n  exit-address-family\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 分段核对 ----\n# 按顺序查：LDP 邻居通了没、标签有没有下发、VRF 建了没、MP-BGP 邻居起来没、VPN 路由收没收到。\nconfigure terminal\nshow mpls ldp neighbor\nshow mpls ldp bindings\nshow ip vrf\nshow ip bgp vpnv4 all summary\nshow ip route vrf VPNA\nend\n\n# --------------------------------------------------------------------\n# [风险] MPLS 的前提是公网侧 IGP 已经跑通，而且两端的 Loopback 都要被宣告进 IGP，否则 LDP 会话建不起来。建议先配 OSPF 或 IS-IS 那两条场景。\n# [风险] MPLS L3VPN 是路由器级特性。思科这边要 IOS / IOS-XE 带 MPLS 特性的版本，Catalyst 9000 系列以上才支持，接入层交换机不具备这个能力。\n\n# --------------------------------------------------------------------\n# [提示] 生成的是 PE 侧配置。P 设备只需要中间的 MPLS + LDP 部分，不需要 VPN 实例。\n# [提示] 公网侧必须先跑通 IGP（OSPF 或 IS-IS），且 Loopback 要宣告进去，LDP 邻居才建得起来。建议先配那两条场景。\n# [提示] RD 用来区分不同 VPN 的同网段路由；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值，配反了就是不通。\n# [提示] 两台 PE 上的 VPN 实例名可以不同，但 RD、RT、VPN 路由的下一跳必须理清。","ruijie":"\n# ---- 先建好 Loopback ----\n# LSR ID 用 Loopback 地址最稳。锐捷的环回口写法是 Loopback 0，接口名和编号之间有空格。\nconfigure terminal\ninterface Loopback 0\n ip address 1.1.1.1 255.255.255.255\n exit\nend\n\n# ---- 开启 MPLS 与 LDP ----\n# 锐捷的写法和其他三家都不一样：全局是 mpls ip 开转发，mpls router ldp 进 LDP 视图再用 ldp router-id 指定 Router ID，没有 mpls lsr-id 这条命令。接口下要 mpls ip 加 label-switch 两条。\nconfigure terminal\nmpls ip\nmpls router ldp\n ldp router-id interface Loopback 0 force\n exit\ninterface Vlan 100\n ip address 10.0.0.1 255.255.255.252\n mpls ip\n label-switch\n exit\nend\n\n# ---- 创建 VRF ----\n# 锐捷用 ip vrf（与思科一致）。\nconfigure terminal\nip vrf VPNA\n rd 100:1\n route-target export 100:1\n route-target import 100:1\n exit\nend\n\n# ---- 把 CE 接口划入 VRF ----\n# 注意顺序：ip vrf forwarding 会清掉接口上原有的 IP 配置，所以必须先划 VRF 再配地址，反了地址就没了。\nconfigure terminal\ninterface Vlan 10\n ip vrf forwarding VPNA\n ip address 10.1.1.2 255.255.255.0\n exit\nend\n\n# ---- MP-BGP 传递 VPN 路由 ----\n# 锐捷的 VPNv4 地址族写成 address-family vpnv4 unicast，比思科多一个 unicast。\nconfigure terminal\nrouter bgp 100\n no bgp default ipv4-unicast\n neighbor 2.2.2.2 remote-as 100\n neighbor 2.2.2.2 update-source Loopback 0\n address-family vpnv4 unicast\n  neighbor 2.2.2.2 activate\n  neighbor 2.2.2.2 send-community extended\n  exit-address-family\n address-family ipv4 vrf VPNA\n  neighbor 10.1.1.1 remote-as 65410\n  neighbor 10.1.1.1 activate\n  redistribute connected\n  exit-address-family\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 分段核对 ----\n# 按顺序查：LDP 邻居通了没、标签有没有下发、VRF 建了没、MP-BGP 邻居起来没、VPN 路由收没收到。\nconfigure terminal\nshow mpls ldp neighbor\nshow mpls ldp binding\nshow ip vrf\nshow bgp vpnv4 unicast summary\nshow ip route vrf VPNA\nend\n\n# --------------------------------------------------------------------\n# [风险] 锐捷部分版本的接口命令写作 label-switching（带 ing），本工具生成的是官方文档里的 label-switch，下发前请用 ? 确认。\n# [风险] MPLS 的前提是公网侧 IGP 已经跑通，而且两端的 Loopback 都要被宣告进 IGP，否则 LDP 会话建不起来。建议先配 OSPF 或 IS-IS 那两条场景。\n# [风险] MPLS L3VPN 是路由器级特性。锐捷这边只有 N18K、S65 以上等高端型号支持，普通接入交换机不具备这个能力，配置前先确认型号与 license。\n\n# --------------------------------------------------------------------\n# [提示] 生成的是 PE 侧配置。P 设备只需要中间的 MPLS + LDP 部分，不需要 VPN 实例。\n# [提示] 公网侧必须先跑通 IGP（OSPF 或 IS-IS），且 Loopback 要宣告进去，LDP 邻居才建得起来。建议先配那两条场景。\n# [提示] RD 用来区分不同 VPN 的同网段路由；RT 决定路由在哪些 VPN 之间互通，本机导入值要对上对端的导出值，配反了就是不通。\n# [提示] 两台 PE 上的 VPN 实例名可以不同，但 RD、RT、VPN 路由的下一跳必须理清。"}}]},{"key":"dot1x","name":"802.1X 认证","group":"安全","summary":"给端口上一把锁：终端不先通过 RADIUS 认证，交换机就不放行数据流量。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。","端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。","802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。"],"params":[{"label":"RADIUS 服务器地址","help":"","example":"192.168.1.30","default":"192.168.1.30"},{"label":"RADIUS 共享密钥","help":"交换机与服务器两边必须完全一致，不一致认证永远失败。","example":"","default":"Radius@123"},{"label":"认证域名称","help":"H3C / 华为用它把接入用户引到指定的 RADIUS 方案；思科 / 锐捷不需要，会自动忽略。","example":"scg.local","default":"scg.local"},{"label":"受控端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":"1/0/1-8"},{"label":"接入控制方式","help":"","example":"","default":"macbased"},{"label":"端口授权状态","help":"","example":"","default":"auto"},{"label":"Guest VLAN","help":"选填。未认证终端被放进这个 VLAN，可以只让它访问认证页面。","example":"100","default":""},{"label":"单端口最大用户数","help":"选填。填了就限制一个端口下能同时认证多少用户。","example":"5","default":""},{"label":"开启 MAC 旁路认证","help":"不支持 802.1X 的哑终端（打印机、摄像头）靠 MAC 地址放行。","example":"","default":"0"}],"samples":[{"label":"默认参数","values":{"RADIUS 服务器地址":"192.168.1.30","RADIUS 共享密钥":"Radius@123","认证域名称":"scg.local","受控端口":"1/0/1-8","接入控制方式":"基于 MAC（推荐，一个端口可接多台）","端口授权状态":"auto（认证通过才放行）","Guest VLAN":"","单端口最大用户数":"","开启 MAC 旁路认证":"不启用"},"commands":{"h3c":"\n# ---- 配置 RADIUS 方案 ----\n# user-name-format without-domain 表示用户名不带 @域名 后缀发给服务器，多数 RADIUS 服务器都按这种格式建账号。\nsystem-view\nradius scheme SCG-RADIUS\n primary authentication 192.168.1.30\n key authentication simple Radius@123\n user-name-format without-domain\n quit\n\n# ---- 把认证域指向 RADIUS 方案 ----\n# 认证域负责把接入用户引到指定的 RADIUS 方案上。\nsystem-view\ndomain scg.local\n authentication lan-access radius-scheme SCG-RADIUS\n authorization lan-access radius-scheme SCG-RADIUS\n quit\n\n# ---- 全局与端口开启 802.1X ----\n# H3C 要开两处：全局一条 dot1x，接口下再来一条 dot1x，少任何一处端口都不会触发认证。\nsystem-view\ndot1x\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n dot1x\n dot1x port-method macbased\n dot1x port-control auto\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对认证状态 ----\n# 先看端口是不是在跑 802.1X，再看有没有在线用户。\nsystem-view\ndisplay dot1x\ndisplay dot1x connection\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改成 cipher 形式保存，或下发后立即更换。\n# [风险] 802.1X 不能与端口安全同时配置，H3C 上开端口安全会重置 802.1X 相关配置。\n\n# --------------------------------------------------------------------\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。","huawei":"\n# ---- 配置 RADIUS 服务器模板 ----\n# 华为要先建 RADIUS 服务器模板，再让认证域去引用它。\nsystem-view\nradius-server template SCG-RADIUS\n radius-server authentication 192.168.1.30 1812\n radius-server accounting 192.168.1.30 1813\n radius-server shared-key cipher Radius@123\n quit\n\n# ---- 配置认证方案与认证域 ----\n# 认证方案决定用哪种方式认证，认证域把方案和 RADIUS 模板绑在一起。终端上填的账号要带上 @域名 后缀，或者把该域设为默认域。\nsystem-view\naaa\n authentication-scheme SCG-AUTH\n  authentication-mode radius\n  quit\n domain scg.local\n  authentication-scheme SCG-AUTH\n  radius-server SCG-RADIUS\n  quit\n quit\n\n# ---- 端口开启 802.1X ----\n# 华为是接口下 dot1x enable，没有全局开关。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n dot1x enable\n dot1x port-method macbased\n dot1x port-control auto\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对认证状态 ----\n# 先看端口有没有在跑 802.1X，再看在线用户列表。\nsystem-view\ndisplay dot1x\ndisplay access-user\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改成密文保存或立即更换。\n# [风险] 华为从 V600 版本起改用 NAC 认证模板模型（authentication-profile），接口下不再写 dot1x enable，而是绑认证模板。本工具生成的是 V200 的写法，下发前请先用 ? 确认本机属于哪套模型。\n\n# --------------------------------------------------------------------\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。","cisco":"\n# ---- 配置 RADIUS 服务器 ----\n# 思科要先 aaa new-model 打开 AAA，再定义 radius server，最后用 dot1x system-auth-control 全局开启 802.1X。老版本 IOS 用的是 radius-server host ... key ... 那套命令。\nconfigure terminal\naaa new-model\nradius server SCG-RADIUS\n address ipv4 192.168.1.30 auth-port 1812 acct-port 1813\n key Radius@123\n exit\naaa authentication dot1x default group radius\naaa authorization network default group radius\ndot1x system-auth-control\nend\n\n# ---- 端口开启 802.1X ----\n# dot1x pae authenticator 表示这个端口扮演认证方角色，思科的 802.1X 必须配它。port-control auto 才是「认证通过才放行」。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n switchport mode access\n authentication port-control auto\n dot1x pae authenticator\n dot1x host-mode multi-host\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对认证状态 ----\n# 看端口状态是 AUTHORIZED 还是 UNAUTHORIZED。\nconfigure terminal\nshow dot1x all summary\nshow authentication sessions\nend\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改用其他方式保存或立即更换。\n# [风险] 802.1X 与端口安全、IP 源防护等接入控制功能同时配置时，报文要同时满足所有检查规则才能通过，排障时注意。\n\n# --------------------------------------------------------------------\n# [提示] 思科默认用 EAP 中继，具体认证方法由 RADIUS 服务器协商，不需要在交换机上指定 chap / pap。\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。","ruijie":"\n# ---- 配置 RADIUS 与 AAA ----\n# 锐捷的 RADIUS 配置比思科简单：一条 radius-server host 就把地址和密钥都写了。dot1x authentication default group radius 指定默认走 RADIUS 认证。\nconfigure terminal\naaa new-model\nradius-server host 192.168.1.30 key Radius@123\naaa authentication dot1x default group radius\naaa authorization network default group radius\ndot1x authentication default group radius\nend\n\n# ---- 端口开启 802.1X ----\n# 锐捷缺省的接入控制方式就是基于 MAC，选 portbased 时才需要显式配 dot1x port-method portbased。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n dot1x\n dot1x port-control auto\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对认证状态 ----\n# 看端口在不在跑 802.1X、有没有在线用户。\nconfigure terminal\nshow dot1x\nshow dot1x summary\nend\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改用其他方式保存或立即更换。\n\n# --------------------------------------------------------------------\n# [提示] 部分 RGOS 版本的 dot1x authentication default 命令不存在，只靠 aaa authentication dot1x default group radius 也够用，下发前用 ? 确认。\n# [提示] 锐捷、思科都默认走 EAP 中继，认证方法由 RADIUS 服务器协商。\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。"}},{"label":"基于端口（首个用户认证通过后整口放行）","values":{"RADIUS 服务器地址":"192.168.1.30","RADIUS 共享密钥":"Radius@123","认证域名称":"scg.local","受控端口":"1/0/1-8","接入控制方式":"基于端口（首个用户认证通过后整口放行）","端口授权状态":"auto（认证通过才 /0/1 to GigabitEthernet1/0/8\n dot1x enable\n dot1x port-method portbased\n dot1x port-control auto\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对认证状态 ----\n# 先看端口有没有在跑 802.1X，再看在线用户列表。\nsystem-view\ndisplay dot1x\ndisplay access-user\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改成密文保存或立即更换。\n# [风险] 华为从 V600 版本起改用 NAC 认证模板模型（authentication-profile），接口下不再写 dot1x enable，而是绑认证模板。本工具生成的是 V200 的写法，下发前请先用 ? 确认本机属于哪套模型。\n\n# --------------------------------------------------------------------\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。","cisco":"\n# ---- 配置 RADIUS 服务器 ----\n# 思科要先 aaa new-model 打开 AAA，再定义 radius server，最后用 dot1x system-auth-control 全局开启 802.1X。老版本 IOS 用的是 radius-server host ... key ... 那套命令。\nconfigure terminal\naaa new-model\nradius server SCG-RADIUS\n address ipv4 192.168.1.30 auth-port 1812 acct-port 1813\n key Radius@123\n exit\naaa authentication dot1x default group radius\naaa authorization network default group radius\ndot1x system-auth-control\nend\n\n# ---- 端口开启 802.1X ----\n# dot1x pae authenticator 表示这个端口扮演认证方角色，思科的 802.1X 必须配它。port-control auto 才是「认证通过才放行」。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n switchport mode access\n authentication port-control auto\n dot1x pae authenticator\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对认证状态 ----\n# 看端口状态是 AUTHORIZED 还是 UNAUTHORIZED。\nconfigure terminal\nshow dot1x all summary\nshow authentication sessions\nend\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改用其他方式保存或立即更换。\n# [风险] 802.1X 与端口安全、IP 源防护等接入控制功能同时配置时，报文要同时满足所有检查规则才能通过，排障时注意。\n\n# --------------------------------------------------------------------\n# [提示] 思科默认用 EAP 中继，具体认证方法由 RADIUS 服务器协商，不需要在交换机上指定 chap / pap。\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。","ruijie":"\n# ---- 配置 RADIUS 与 AAA ----\n# 锐捷的 RADIUS 配置比思科简单：一条 radius-server host 就把地址和密钥都写了。dot1x authentication default group radius 指定默认走 RADIUS 认证。\nconfigure terminal\naaa new-model\nradius-server host 192.168.1.30 key Radius@123\naaa authentication dot1x default group radius\naaa authorization network default group radius\ndot1x authentication default group radius\nend\n\n# ---- 端口开启 802.1X ----\n# 锐捷缺省的接入控制方式就是基于 MAC，选 portbased 时才需要显式配 dot1x port-method portbased。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n dot1x\n dot1x port-method portbased\n dot1x port-control auto\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对认证状态 ----\n# 看端口在不在跑 802.1X、有没有在线用户。\nconfigure terminal\nshow dot1x\nshow dot1x summary\nend\n\n# --------------------------------------------------------------------\n# [风险] 共享密钥在脚本里是明文，交付后请改用其他方式保存或立即更换。\n\n# --------------------------------------------------------------------\n# [提示] 部分 RGOS 版本的 dot1x authentication default 命令不存在，只靠 aaa authentication dot1x default group radius 也够用，下发前用 ? 确认。\n# [提示] 锐捷、思科都默认走 EAP 中继，认证方法由 RADIUS 服务器协商。\n# [提示] 选基于 MAC 还是基于端口，取决于一个端口下接几台设备：接一台用 portbased，接 HUB 或多台用 macbased。\n# [提示] 端口先要能被 RADIUS 服务器访问到，认证报文走的是交换机的管理地址。\n# [提示] 802.1X 和端口安全不能同时开，H3C 上开端口安全会重置 802.1X 配置。"}}]},{"key":"poe","name":"PoE 供电","group":"运维","summary":"给 AP、摄像头、IP 电话这些设备远程供电，顺带控制优先级和单口功率上限。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。","端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。","万兆口、光口一般不支持 PoE，配之前先确认端口类型。"],"params":[{"label":"供电端口","help":"只有支持 PoE 的端口才能配。支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":"1/0/1-8"},{"label":"操作","help":"","example":"","default":"enable"},{"label":"供电优先级","help":"","example":"","default":"high"},{"label":"单口最大功率","help":"选填，单位毫瓦。留空用设备默认值。","example":"30000","default":""}],"samples":[{"label":"默认参数","values":{"供电端口":"1/0/1-8","操作":"开启供电","供电优先级":"high（推荐）","单口最大功率":""},"commands":{"h3c":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时先牺牲哪些端口：critical 最后断电，low 最先断电。部分低端型号不支持 priority，下发前用 ? 确认。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n poe enable\n poe priority high\n quit\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少，以及有没有超预算。\nsystem-view\ndisplay poe interface\ndisplay poe interface power\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","huawei":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时的取舍顺序：critical 最后断电，low 最先断电。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n poe enable\n poe priority high\n quit\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少、有没有超预算。\nsystem-view\ndisplay poe power\ndisplay poe interface\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","cisco":"\n# ---- 配置 PoE 供电 ----\n# 思科只有 auto / never / static 三个档：auto 让设备自己协商，never 完全不供电，static 按配置功率预留。max 后面的单位是毫瓦。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n power inline auto\n exit\nend\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、实际功率是多少、预算还剩多少。\nconfigure terminal\nshow power inline\nshow power inline module 1\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 思科没有跟 H3C / 华为对应的端口供电优先级命令，供电不足时的取舍由平台自己决定，这里没有生成。\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","ruijie":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时的取舍顺序：critical 最后断电，low 最先断电。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n poe enable\n poe priority high\n exit\nend\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少、有没有超预算。\nconfigure terminal\nshow poe interfaces\nshow poe power\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。"}},{"label":"关闭供电","values":{"供电端口":"1/0/1-8","操作":"关闭供电","供电优先级":"high（推荐）","单口最大功率":""},"commands":{"h3c":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时先牺牲哪些端口：critical 最后断电，low 最先断电。部分低端型号不支持 priority，下发前用 ? 确认。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n undo poe enable\n quit\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少，以及有没有超预算。\nsystem-view\ndisplay poe interface\ndisplay poe interface power\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 关闭 PoE 会让 AP、摄像头这类设备直接断电，确认不是生产设备再执行。\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","huawei":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时的取舍顺序：critical 最后断电，low 最先断电。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n undo poe enable\n quit\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少、有没有超预算。\nsystem-view\ndisplay poe power\ndisplay poe interface\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 关闭 PoE 会让 AP、摄像头这类设备直接断电，确认不是生产设备再执行。\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","cisco":"\n# ---- 配置 PoE 供电 ----\n# 思科只有 auto / never / static 三个档：auto 让设备自己协商，never 完全不供电，static 按配置功率预留。max 后面的单位是毫瓦。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n power inline never\n exit\nend\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、实际功率是多少、预算还剩多少。\nconfigure terminal\nshow power inline\nshow power inline module 1\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] power inline never 会让 AP、摄像头这类设备直接断电，确认不是生产设备再执行。\n\n# --------------------------------------------------------------------\n# [提示] 思科没有跟 H3C / 华为对应的端口供电优先级命令，供电不足时的取舍由平台自己决定，这里没有生成。\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。","ruijie":"\n# ---- 配置 PoE 供电 ----\n# poe priority 决定整机供电不足时的取舍顺序：critical 最后断电，low 最先断电。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n no poe enable\n exit\nend\n\n# ---- 核对供电状态 ----\n# 确认端口在供电、功率是多少、有没有超预算。\nconfigure terminal\nshow poe interfaces\nshow poe power\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 关闭 PoE 会让 AP、摄像头这类设备直接断电，确认不是生产设备再执行。\n\n# --------------------------------------------------------------------\n# [提示] 整机 PoE 功率是有限的，优先级决定供电不足时先牺牲哪些端口。关键设备（AP、摄像头）给 high 或 critical。\n# [提示] 端口被 shutdown 时 PoE 也会断电，排查供电问题先看端口状态。\n# [提示] 万兆口、光口一般不支持 PoE，配之前先确认端口类型。"}}]},{"key":"qos_priority","name":"QoS 优先级信任与重标记","group":"运维","summary":"告诉交换机该相信报文里的哪个优先级字段，必要时按 ACL 重新标记 DSCP。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。","默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。","语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。"],"params":[{"label":"生效端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-24","default":"1/0/1-24"},{"label":"信任模式","help":"接 AP、服务器、上行口建议信任 DSCP；接哑终端的老设备可以信 802.1p。","example":"","default":"dscp"},{"label":"重标记匹配的 ACL","help":"选填。填了才生成 DSCP 重标记策略，ACL 需要你先建好。","example":"3000","default":""},{"label":"重标记成 DSCP","help":"仅填了 ACL 时生效。可写名称如 ef / af11，也可写数字 0-63。","example":"af11","default":"af11"},{"label":"应用方向","help":"","example":"","default":"inbound"}],"samples":[{"label":"默认参数","values":{"生效端口":"1/0/1-24","信任模式":"信任 DSCP（三层标记）","重标记匹配的 ACL":"","重标记成 DSCP":"af11","应用方向":"入方向"},"commands":{"h3c":"\n# ---- 配置优先级信任模式 ----\n# dot1p 是二层 802.1p，报文必须带 VLAN Tag 才有；dscp 是三层 IP 报文里的标记。Comware V5 的命令写作 priority-trust cos / dscp，与 V7 不同。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/24\n qos trust dscp\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nsystem-view\ndisplay qos trust interface\ndisplay qos policy interface\n\n# --------------------------------------------------------------------\n# [提示] 不做标记的网络里，所有报文的优先级其实都一样，所以语音、视频这类业务要在接入层就打上 DSCP。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","huawei":"\n# ---- 配置优先级信任模式 ----\n# 华为的命令就是 trust，没有 qos 前缀，这点与 H3C / 思科都不同。8021p 还分 inner / outer，一般信外层，缺省就是 8021p outer。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/24\n trust dscp\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nsystem-view\ndisplay trust\ndisplay traffic policy statistics interface\n\n# --------------------------------------------------------------------\n# [提示] 不做标记的网络里，所有报文的优先级其实都一样。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","cisco":"\n# ---- 开启 QoS 并配置信任模式 ----\n# mls qos 是总开关，没开的话后面的信任和标记都不生效。思科里 802.1p 对应的关键字是 cos（不是 dot1p）。\nconfigure terminal\nmls qos\ninterface range GigabitEthernet1/0/1 - 24\n mls qos trust dscp\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nconfigure terminal\nshow mls qos interface\nshow policy-map interface\nend\n\n# --------------------------------------------------------------------\n# [提示] 有些 Catalyst 平台的命令写作 qos trust 而不是 mls qos trust，下发前用 ? 确认本机写法。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","ruijie":"\n# ---- 开启 QoS 并配置信任模式 ----\n# 锐捷与思科同源，先 mls qos 开总开关，再配信任模式。802.1p 对应的关键字是 cos。\nconfigure terminal\nmls qos\ninterface range GigabitEthernet 1/0/1-24\n mls qos trust dscp\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nconfigure terminal\nshow mls qos interface\nshow policy-map interface\nend\n\n# --------------------------------------------------------------------\n# [提示] 部分 RGOS 版本的信任命令写作 qos trust，下发前用 ? 确认。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。"}},{"label":"信任 802.1p（二层标记，带 VLAN Tag）","values":{"生效端口":"1/0/1-24","信任模式":"信任 802.1p（二层标记，带 VLAN Tag）","重标记匹配的 ACL":"","重标记成 DSCP":"af11","应用方向":"入方向"},"commands":{"h3c":"\n# ---- 配置优先级信任模式 ----\n# dot1p 是二层 802.1p，报文必须带 VLAN Tag 才有；dscp 是三层 IP 报文里的标记。Comware V5 的命令写作 priority-trust cos / dscp，与 V7 不同。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/24\n qos trust dot1p\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nsystem-view\ndisplay qos trust interface\ndisplay qos policy interface\n\n# --------------------------------------------------------------------\n# [提示] 不做标记的网络里，所有报文的优先级其实都一样，所以语音、视频这类业务要在接入层就打上 DSCP。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","huawei":"\n# ---- 配置优先级信任模式 ----\n# 华为的命令就是 trust，没有 qos 前缀，这点与 H3C / 思科都不同。8021p 还分 inner / outer，一般信外层，缺省就是 8021p outer。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/24\n trust 8021p outer\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nsystem-view\ndisplay trust\ndisplay traffic policy statistics interface\n\n# --------------------------------------------------------------------\n# [提示] 不做标记的网络里，所有报文的优先级其实都一样。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","cisco":"\n# ---- 开启 QoS 并配置信任模式 ----\n# mls qos 是总开关，没开的话后面的信任和标记都不生效。思科里 802.1p 对应的关键字是 cos（不是 dot1p）。\nconfigure terminal\nmls qos\ninterface range GigabitEthernet1/0/1 - 24\n mls qos trust cos\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nconfigure terminal\nshow mls qos interface\nshow policy-map interface\nend\n\n# --------------------------------------------------------------------\n# [提示] 有些 Catalyst 平台的命令写作 qos trust 而不是 mls qos trust，下发前用 ? 确认本机写法。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。","ruijie":"\n# ---- 开启 QoS 并配置信任模式 ----\n# 锐捷与思科同源，先 mls qos 开总开关，再配信任模式。802.1p 对应的关键字是 cos。\nconfigure terminal\nmls qos\ninterface range GigabitEthernet 1/0/1-24\n mls qos trust cos\n exit\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对结果 ----\n# 确认信任模式生效、策略有命中计数。\nconfigure terminal\nshow mls qos interface\nshow policy-map interface\nend\n\n# --------------------------------------------------------------------\n# [提示] 部分 RGOS 版本的信任命令写作 qos trust，下发前用 ? 确认。\n# [提示] 优先级信任要配在接入侧的端口上，且要在策略应用之前配好，否则后面的分类拿不到有效输入。\n# [提示] 默认设备是不信任报文优先级的，会用端口优先级给所有流量兜底，所以不做标记的网络里大家的优先级其实都一样。\n# [提示] 语音、视频这类业务建议在接入层就打 DSCP 标记，后面全程信任，比在核心层再分类省事得多。"}}]},{"key":"ipv6","name":"IPv6 基础","group":"三层","summary":"给三层接口配上 IPv6 地址、打开路由转发，并配静态路由。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["IPv6 接口会自动生成一个链路本地地址（fe80:: 开头），这是邻居发现协议用的，不要禁用。","思科 / 锐捷必须先在全局打开 ipv6 unicast-routing，否则接口配了地址也转发不了。","IPv6 没有广播，都靠组播；ARP 的活由邻居发现（ND）接管。"],"params":[{"label":"三层接口 VLAN","help":"","example":"","default":"10"},{"label":"IPv6 地址","help":"不要写 //64 之外的掩码长度，统一用 /64。","example":"2001:db8:10::1","default":"2001:db8:10::1"},{"label":"前缀长度","help":"","example":"","default":"64"},{"label":"发送 RA 通告","help":"终端靠路由通告（RA）自动生成地址，接终端的接口要开。","example":"","default":"1"},{"label":"静态路由","help":"选填。每行一条：目标前缀/长度 下一跳。","example":"2001:db8:20::/64 2001:db8:10::2","default":""}],"samples":[{"label":"默认参数","values":{"三层接口 VLAN":"10","IPv6 地址":"2001:db8:10::1","前缀长度":"64","发送 RA 通告":"启用","静态路由":""},"commands":{"h3c":"\n# ---- 配置 IPv6 接口地址 ----\n# Comware 默认抑制路由通告（RA），接终端的接口要 undo ipv6 nd ra halt 才能让终端自动生成地址。\nsystem-view\ninterface Vlan-interface 10\n ipv6 address 2001:db8:10::1 64\n undo ipv6 nd ra halt\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# ---- 核对结果 ----\n# 看接口地址、路由表和邻居表三项。\nsystem-view\ndisplay ipv6 interface brief\ndisplay ipv6 routing-table\ndisplay ipv6 neighbors\n\n# --------------------------------------------------------------------\n# [提示] IPv6 接口会自动生成 fe80:: 开头的链路本地地址，邻居发现协议靠它工作，不要禁用。\n# [提示] Comware V5 需要先在系统视图执行 ipv6 才能配 IPv6，V7 不需要。\n# [提示] IPv6 接口会自动生成一个链路本地地址（fe80:: 开头），这是邻居发现协议用的，不要禁用。\n# [提示] 思科 / 锐捷必须先在全局打开 ipv6 unicast-routing，否则接口配了地址也转发不了。\n# [提示] IPv6 没有广播，都靠组播；ARP 的活由邻居发现（ND）接管。","huawei":"\n# ---- 配置 IPv6 接口地址 ----\n# 华为要先 ipv6 enable 打开接口的 IPv6 能力，再配地址。接终端的接口要 undo ipv6 nd ra halt 才会发路由通告。\nsystem-view\ninterface Vlanif10\n ipv6 enable\n ipv6 address 2001:db8:10::1 64\n undo ipv6 nd ra halt\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# ---- 核对结果 ----\n# 看接口地址、路由表和邻居表三项。\nsystem-view\ndisplay ipv6 interface brief\ndisplay ipv6 routing-table\ndisplay ipv6 neighbors\n\n# --------------------------------------------------------------------\n# [提示] IPv6 接口会自动生成 fe80:: 开头的链路本地地址，不要禁用。\n# [提示] IPv6 接口会自动生成一个链路本地地址（fe80:: 开头），这是邻居发现协议用的，不要禁用。\n# [提示] 思科 / 锐捷必须先在全局打开 ipv6 unicast-routing，否则接口配了地址也转发不了。\n# [提示] IPv6 没有广播，都靠组播；ARP 的活由邻居发现（ND）接管。","cisco":"\n# ---- 开启 IPv6 并配置接口地址 ----\n# 思科必须先 ipv6 unicast-routing，否则接口配了地址也不转发 IPv6 报文，这是最容易漏的一步。思科默认就发路由通告，不要发才用 ipv6 nd ra suppress。\nconfigure terminal\nipv6 unicast-routing\nipv6 cef\ninterface Vlan10\n ipv6 enable\n ipv6 address 2001:db8:10::1/64\n end\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# ---- 核对结果 ----\n# 看接口地址、路由表和邻居表三项。\nconfigure terminal\nshow ipv6 interface brief\nshow ipv6 route\nshow ipv6 neighbors\nend\n\n# --------------------------------------------------------------------\n# [提示] 接口会自动生成 fe80:: 开头的链路本地地址，不要禁用。\n# [提示] IPv6 接口会自动生成一个链路本地地址（fe80:: 开头），这是邻居发现协议用的，不要禁用。\n# [提示] 思科 / 锐捷必须先在全局打开 ipv6 unicast-routing，否则接口配了地址也转发不了。\n# [提示] IPv6 没有广播，都靠组播；ARP 的活由邻居发现（ND）接管。","ruijie":"\n# ---- 开启 IPv6 并配置接口地址 ----\n# 锐捷和思科一样，必须先 ipv6 unicast-routing 才能转发 IPv6 报文。默认发路由通告，不要发才用 ipv6 nd ra suppress。\nconfigure terminal\nipv6 unicast-routing\nipv6 cef\ninterface Vlan 10\n ipv6 enable\n ipv6 address 2001:db8:10::1/64\nend\n\n# ---- 保存配置 ----\nend\nwrite\n\n# ---- 核对结果 ----\n# 看接口地址、路由表和邻居表三项。\nconfigure terminal\nshow ipv6 interface brief\nshow ipv6 route\nshow ipv6 neighbors\nend\n\n# --------------------------------------------------------------------\n# [提示] 接口会自动生成 fe80:: 开头的链路本地地址，不要禁用。\n# [提示] IPv6 接口会自动生成一个链路本地地址（fe80:: 开头），这是邻居发现协议用的，不要禁用。\n# [提示] 思科 / 锐捷必须先在全局打开 ipv6 unicast-routing，否则接口配了地址也转发不了。\n# [提示] IPv6 没有广播，都靠组播；ARP 的活由邻居发现（ND）接管。"}}]}],"manuals":{"h3c":["━━ H3C 命令手册（共 149 条概念）━━","","▌入口与保存","  · 进入系统视图","        system-view","  · 退回用户视图","        return","  · 退出当前视图","        quit","  · 保存配置","        save force","  · 修改设备名","        sysname <设备名>","","▌二层","  · 创建 VLAN","        vlan <vlan-id>","  · 名称 / 描述字段","        name <文本>","  · 进入接口","        interface <接口名>","  · 批量进入接口","        interface range <起始口> to <结束口 从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"],"cisco":["1. 确认 DHCP 服务本身是开的","   命令：","     show ip dhcp binding","     show running-config | include dhcp","   判读：命令能正常返回说明服务在跑。报「DHCP","   未使能」就是没开。","   往哪走：没开 -> dhcp enable / service dhcp。","","2. 确认地址池还有空闲地址","   命令：","     show ip dhcp pool","     show ip dhcp binding","   判读：看已用数量和池子总大小。用满了就是拿不到，和网络无关","   。","   往哪走：池子耗尽 -> 扩网段，或者查是不是有终端在刷地址。","","3. 确认请求真的到了服务器（中继场景）","   命令：","     show ip dhcp snooping","     show ip helper-address","   判读：中继场景下要确认 relay 的 server-address 配对，以及","   VLAN 接口上配了 dhcp select relay。","   往哪走：请求数为 0 -> 二层就没把 DHCP 报文送上来，回到","   VLAN 排查。","","4. 确认不是被 Snooping 或端口安全拦了","   命令：","     show ip dhcp snooping","     show port-security","   判读：开了 Snooping 但上行口没设 trust，DHCP","   回复会被直接丢弃 —— 这个现象和「服务器没响应」完全一样，但","   原因在交换机。","   往哪走：上行口 trusted 没配 -> 补上。","","━━ 容易踩的坑 ━━","","  · Windows 的「169.254」是自动私有地址，说明一个 DHCP Offer","  都没收到。","  · 地址池网段和 VLAN 接口网段不一致，服务器会静默不回。","","━━ 说明 ━━","","· 命令按当前选中的厂商给出。H3C 与华为都是 display，思科与锐捷都是 show。","· 排查顺序是按「从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"]}},{"key":"ospf_peer","name":"OSPF 邻居起不来","symptom":"两台上联设备之间 OSPF 邻居一直卡在 Init / ExStart / Down。","steps":{"h3c":["1. 看邻居状态和邻居表","   命令：","     display ospf peer","   判读：Full 才是正常。Down 是根本没收到 hello；Init","   是收到了但对面没收到我的；ExStart / Exchange 卡住通常是","   MTU 不一致。","   往哪走：按状态往下走，别一概而论。","","2. 确认两边接口都宣告进了同一个 area","   命令：","     display ospf interface","   判读：接口要出现在 OSPF 接口列表里，Area 要一致。","   往哪走：接口没进 OSPF -> 补 network 宣告。Area 不一致 ->","   邻居起不来是必然的。","","3. 确认 hello / dead 定时器一致","   命令：","     display ospf interface","   判读：两端 Hello 和 Dead 必须完全一样（默认 10 / 40","   秒）。一端改过就会永远停在 Down。","   往哪走：不一致 -> 统一回默认值。","","4. 确认 MTU 一致（ExStart 卡住的典型原因）","   命令：","     display interface <接口>","   判读：MTU 不一样时邻居能到 ExStart，但 DD","   报文交换不下去。这个状态很迷惑人，因为 ping 是通的。","   往哪走：MTU 不一致 -> 两边改成一样，或临时 ip ospf","   mtu-ignore。","","5. 确认认证配置一致","   命令：","     display ospf interface","   判读：一端开了 MD5 认证另一端没开，邻居会停在","   Down，日志里通常只说「认证失败」。","   往哪走：认证不一致 -> 统一认证方式和密钥。","","━━ 容易踩的坑 ━━","","  · 二层不通但 ping 得通的情况不存在 —— OSPF 起不来先确认直连能","  ping。","  · 同一网段起了两个 OSPF 进程，容易互相干扰。","","━━ 说明 ━━","","· 命令按当前选中的厂商给出。H3C 与华为都是 display，思科与锐捷都是 show。","· 排查顺序是按「从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"],"cisco":["1. 看邻居状态和邻居表","   命令：","     show ip ospf neighbor","   判读：Full 才是正常。Down 是根本没收到 hello；Init","   是收到了但对面没收到我的；ExStart / Exchange 卡住通常是","   MTU 不一致。","   往哪走：按状态往下走，别一概而论。","","2. 确认两边接口都宣告进了同一个 area","   命令：","     show ip ospf interface brief","   判读：接口要出现在 OSPF 接口列表里，Area 要一致。","   往哪走：接口没进 OSPF -> 补 network 宣告。Area 不一致 ->","   邻居起不来是必然的。","","3. 确认 hello / dead 定时器一致","   命令：","     show ip ospf interface","   判读：两端 Hello 和 Dead 必须完全一样（默认 10 / 40","   秒）。一端改过就会永远停在 Down。","   往哪走：不一致 -> 统一回默认值。","","4. 确认 MTU 一致（ExStart 卡住的典型原因）","   命令：","     show interfaces <接口>","   判读：MTU 不一样时邻居能到 ExStart，但 DD","   报文交换不下去。这个状态很迷惑人，因为 ping 是通的。","   往哪走：MTU 不一致 -> 两边改成一样，或临时 ip ospf","   mtu-ignore。","","5. 确认认证配置一致","   命令：","     show ip ospf interface","   判读：一端开了 MD5 认证另一端没开，邻居会停在","   Down，日志里通常只说「认证失败」。","   往哪走：认证不一致 -> 统一认证方式和密钥。","","━━ 容易踩的坑 ━━","","  · 二层不通但 ping 得通的情况不存在 —— OSPF 起不来先确认直连能","  ping。","  · 同一网段起了两个 OSPF 进程，容易互相干扰。","","━━ 说明 ━━","","· 命令按当前选中的厂商给出。H3C 与华为都是 display，思科与锐捷都是 show。","· 排查顺序是按「从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"]}},{"key":"port_up_no_traffic","name":"端口 UP 但业务不通","symptom":"接口指示灯亮、状态是 UP，但终端上不了网，也 ping 不通网关。","steps":{"h3c":["1. 确认端口有没有学到 MAC","   命令：","     display mac-address interface <接口>","   判读：有 MAC 说明二层通了，问题在三层或策略。没有 MAC","   说明报文根本没上来。","   往哪走：没 MAC -> 查网线、光模块、终端网卡。","","2. 确认端口没有被端口安全 / 802.1X 限制","   命令：","     display port-security","     display dot1x connection","   判读：端口安全触发后端口会进入 restrict / shutdown","   状态，但接口本身可能还显示 UP。","   往哪走：被限制 -> 清掉 sticky MAC 或调整 max-mac-count。","","3. 确认端口 VLAN 和终端预期一致","   命令：","     display vlan brief","     display current-configuration interface <接口>","   判读：接了终端却是 trunk 模式，或者划进了错误的","   VLAN，现象都是「灯亮但不通」。","   往哪走：VLAN 不对 -> 改 port access vlan。","","4. 看接口计数有没有错包","   命令：","     display interface <接口>","   判读：重点看 input errors、CRC、runts。CRC","   在涨基本是光模块或网线问题。","   往哪走：错包在涨 -> 换线换模块，别在配置上纠缠。","","━━ 容易踩的坑 ━━","","  · err-disable 的端口在有些型号上仍显示 UP，要专门看","  errdisable 状态。","  · 双工不匹配时 ping 大包丢、小包通，很容易被当成「网络时好时坏","  」。","","━━ 说明 ━━","","· 命令按当前选中的厂商给出。H3C 与华为都是 display，思科与锐捷都是 show。","· 排查顺序是按「从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"],"cisco":["1. 确认端口有没有学到 MAC","   命令：","     show mac address-table interface <接口>","   判读：有 MAC 说明二层通了，问题在三层或策略。没有 MAC","   说明报文根本没上来。","   往哪走：没 MAC -> 查网线、光模块、终端网卡。","","2. 确认端口没有被端口安全 / 802.1X 限制","   命令：","     show port-security","     show authentication sessions","   判读：端口安全触发后端口会进入 restrict / shutdown","   状态，但接口本身可能还显示 UP。","   往哪走：被限制 -> 清掉 sticky MAC 或调整 max-mac-count。","","3. 确认端口 VLAN 和终端预期一致","   命令：","     show vlan brief","     show running-config interface <接口>","   判读：接了终端却是 trunk 模式，或者划进了错误的","   VLAN，现象都是「灯亮但不通」。","   往哪走：VLAN 不对 -> 改 port access vlan。","","4. 看接口计数有没有错包","   命令：","     show interfaces <接口>","   判读：重点看 input errors、CRC、runts。CRC","   在涨基本是光模块或网线问题。","   往哪走：错包在涨 -> 换线换模块，别在配置上纠缠。","","━━ 容易踩的坑 ━━","","  · err-disable 的端口在有些型号上仍显示 UP，要专门看","  errdisable 状态。","  · 双工不匹配时 ping 大包丢、小包通，很容易被当成「网络时好时坏","  」。","","━━ 说明 ━━","","· 命令按当前选中的厂商给出。H3C 与华为都是 display，思科与锐捷都是 show。","· 排查顺序是按「从下往上、从简单到复杂」排的，不建议跳步。","· 每一步的判读写的是「看到什么该往哪走」，不是「检查是否正确」——","  后者等于没说。"]}}]};</script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var VENDOR_FAMILY = {h3c:"h3c", huawei:"h3c", cisco:"cisco", ruijie:"cisco"};

  $("ver").textContent = DATA.version;

  /* ---------------- 通用 ---------------- */
  function copyText(text, btn){
    var done = function(){
      var old = btn.textContent; btn.textContent = "已复制";
      setTimeout(function(){ btn.textContent = old; }, 1400);
    };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){ alert("复制失败，请手动选择文本"); }
      document.body.removeChild(ta);
    }
  }

  // 注释行单独上色：H3C/华为用 #，思科/锐捷用 !
  function paint(text){
    return text.split("\n").map(function(line){
      var t = line.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      var s = line.replace(/^\s+/,"");
      if (s.charAt(0) === "#" || s.charAt(0) === "!"){
        var cls = /\[(风险|未生成|近似|人工确认)\]|说明：/.test(line) ? "w" : "c";
        return '<span class="' + cls + '">' + t + "</span>";
      }
      return t;
    }).join("\n");
  }

  function stripComments(text, vendor){
    var ch = (vendor === "cisco" || vendor === "ruijie") ? "!" : "#";
    return text.split("\n").filter(function(line){
      var s = line.replace(/^\s+/,"");
      return s && s.charAt(0) !== ch;
    }).join("\n");
  }

  /* ---------------- 标签页 ---------------- */
  var views = ["gen","doc","cmp","diag"];

  function switchView(name){
    if (views.indexOf(name) < 0) name = "gen";
    views.forEach(function(v){ $("view-" + v).hidden = (v !== name); });
    document.querySelectorAll("#tabs button").forEach(function(b){
      b.classList.toggle("on", b.dataset.view === name);
    });
    try {
      if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
    } catch (e) { /* file:// 下个别浏览器会拒绝，忽略即可 */ }
  }

  document.querySelectorAll("#tabs button").forEach(function(btn){
    btn.addEventListener("click", function(){
      switchView(btn.dataset.view);
      window.scrollTo(0, 0);
    });
  });

  window.addEventListener("hashchange", function(){
    switchView(location.hash.replace("#", ""));
  });

  /* ---------------- 生成命令 ---------------- */
  var state = { scene: DATA.scenarios[0].key, sample: 0, vendor: DATA.vendors[0].key };

  function buildSceneList(){
    var box = $("scene-list");
    var groups = {};
    DATA.scenarios.forEach(function(s){
      (groups[s.group] = groups[s.group] || []).push(s);
    });
    Object.keys(groups).forEach(function(g){
      var head = document.createElement("div");
      head.className = "group"; head.textContent = g;
      box.appendChild(head);
      groups[g].forEach(function(s){
        var b = document.createElement("button");
        b.textContent = s.name; b.dataset.key = s.key;
        if (s.key === state.scene) b.classList.add("on");
        b.addEventListener("click", function(){
          state.scene = s.key; state.sample = 0;
          box.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
          b.classList.add("on");
          renderScene();
        });
        box.appendChild(b);
      });
    });
  }

  function currentScene(){
    return DATA.scenarios.filter(function(s){ return s.key === state.scene; })[0];
  }

  function renderScene(){
    var s = currentScene();
    if (!s) return;
    if (state.sample >= s.samples.length) state.sample = 0;
    var sample = s.samples[state.sample];
    var vendor = DATA.vendors.filter(function(v){ return v.key === state.vendor; })[0] || DATA.vendors[0];

    var html = '<div class="card">';
    html += '<h2>' + s.name + "</h2>";
    html += '<div class="meta">' + s.group + "　|　" + s.versions + "</div>";
    html += '<div class="sum">' + s.summary + "</div>";

    if (s.notes.length){
      html += '<ul class="notes">';
      s.notes.forEach(function(n){ html += "<li>" + n + "</li>"; });
      html += "</ul>";
    }

    html += '<div class="params">';
    s.params.forEach(function(p){
      var val = sample.values[p.label] !== undefined ? sample.values[p.label] : "";
      html += '<div class="param"><div class="k">' + p.label + '</div><div class="v">' +
              (val || p.example || "—") + "</div></div>";
    });
    html += "</div>";

    if (s.samples.length > 1){
      html += '<div class="seg" id="sample-seg">';
      s.samples.forEach(function(sm, i){
        html += '<button data-i="' + i + '" class="' + (i === state.sample ? "on" : "") + '">' +
                sm.label + "</button>";
      });
      html += "</div>";
    }

    html += '<div class="seg" id="vendor-seg">';
    DATA.vendors.forEach(function(v){
      html += '<button data-v="' + v.key + '" class="' + (v.key === vendor.key ? "on" : "") + '">' +
              v.name + "</button>";
    });
    html += "</div>";

    html += '<div class="row"><span class="hint">' + vendor.platform +
            "　接口写法：" + vendor.port_hint + "</span></div>";
    html += '<pre id="cmd-body">' + paint(sample.commands[vendor.key] || "") + "</pre>";
    html += '<div class="row" style="margin-top:10px">';
    html += '<button class="btn primary" id="copy-all">复制（含注释）</button>';
    html += '<button class="btn" id="copy-plain">复制纯命令</button>';
    html += '<span class="hint">纯命令可直接粘到设备</span></div>';
    html += "</div>";

    $("scene-detail").innerHTML = html;

    var sseg = $("sample-seg");
    if (sseg){
      sseg.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){
          state.sample = +b.dataset.i; renderScene();
        });
      });
    }
    $("vendor-seg").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        state.vendor = b.dataset.v; renderScene();
      });
    });
    $("copy-all").addEventListener("click", function(){
      copyText(sample.commands[vendor.key] || "", this);
    });
    $("copy-plain").addEventListener("click", function(){
      copyText(stripComments(sample.commands[vendor.key] || "", vendor.key), this);
    });
  }

  /* ---------------- 命令详解 ---------------- */
  var docVendor = DATA.vendors[0].key;
  function buildDocVendors(){
    var box = $("doc-vendors");
    DATA.vendors.forEach(function(v){
      var b = document.createElement("button");
      b.textContent = v.name; b.dataset.v = v.key;
      if (v.key === docVendor) b.classList.add("on");
      b.addEventListener("click", function(){
        docVendor = v.key;
        box.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        renderDoc();
      });
      box.appendChild(b);
    });
  }
  function renderDoc(){
    $("doc-body").innerHTML = paint((DATA.manuals[docVendor] || []).join("\n"));
  }

  /* ---------------- 对照 ---------------- */
  function renderCompare(){
    $("cmp-body").innerHTML = paint(DATA.compare.join("\n"));
  }

  /* ---------------- 故障排查 ---------------- */
  var caseKey = DATA.diagnose[0] ? DATA.diagnose[0].key : "";
  function buildCaseList(){
    var box = $("case-list");
    DATA.diagnose.forEach(function(c){
      var b = document.createElement("button");
      b.textContent = c.name; b.dataset.k = c.key;
      if (c.key === caseKey) b.classList.add("on");
      b.addEventListener("click", function(){
        caseKey = c.key;
        box.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        renderCase();
      });
      box.appendChild(b);
    });
  }
  function renderCase(){
    var c = DATA.diagnose.filter(function(x){ return x.key === caseKey; })[0];
    if (!c) return;
    var family = VENDOR_FAMILY[state.vendor] || "h3c";
    var lines = c.steps[family] || c.steps.h3c || [];
    var html = '<div class="card">';
    html += "<h2>" + c.name + "</h2>";
    html += '<div class="sum">现象：' + c.symptom + "</div>";
    html += '<div class="seg" id="diag-vendor">';
    html += '<button data-f="h3c" class="' + (family === "h3c" ? "on" : "") + '">H3C / 华为</button>';
    html += '<button data-f="cisco" class="' + (family === "cisco" ? "on" : "") + '">思科 / 锐捷</button>';
    html += "</div>";
    html += '<pre id="case-body">' + paint(lines.join("\n")) + "</pre>";
    html += '<div class="row" style="margin-top:10px"><button class="btn" id="case-copy">复制步骤</button></div>';
    html += "</div>";
    $("case-detail").innerHTML = html;

    $("diag-vendor").querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        var f = b.dataset.f;
        $("diag-vendor").querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        $("case-body").innerHTML = paint((c.steps[f] || []).join("\n"));
      });
    });
    $("case-copy").addEventListener("click", function(){
      copyText(lines.join("\n"), this);
    });
  }

  $("doc-copy").addEventListener("click", function(){
    copyText((DATA.manuals[docVendor] || []).join("\n"), this);
  });
  $("cmp-copy").addEventListener("click", function(){
    copyText(DATA.compare.join("\n"), this);
  });

  switchView(location.hash.replace("#", "") || "gen");

  buildSceneList();
  renderScene();
  buildDocVendors();
  renderDoc();
  renderCompare();
  buildCaseList();
  renderCase();
})();
</script>
</body>
</html>
