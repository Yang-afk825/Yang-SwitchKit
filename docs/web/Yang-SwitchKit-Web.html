<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yang-SwitchKit · 交换机配置速查</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --border:#e2e5ea; --border-soft:#eceef2;
  --fg:#1e2228; --dim:#59616e; --faint:#8b93a1;
  --accent:#2f6fd8; --on-accent:#fff; --sel:#eaf1fd;
  --syntax:#1a4f9c; --cmt:#5f7d5f; --warn:#a8422f;
  --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181c; --panel:#1d2026; --border:#2b3038; --border-soft:#242830;
    --fg:#e5e7eb; --dim:#9aa2af; --faint:#6e7683;
    --accent:#5b9bf8; --on-accent:#0f1216; --sel:#243043;
    --syntax:#7fa9f0; --cmt:#7ea87e; --warn:#e0a35c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;
  -webkit-text-size-adjust:100%;
}
header{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:12px 16px; display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:10;
}
header .bar{width:4px;height:30px;background:var(--accent);border-radius:2px;flex:none}
header>div{min-width:0}
header p{overflow-wrap:anywhere}
header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:12px;color:var(--faint)}
nav{
  display:flex; gap:6px; padding:10px 16px; background:var(--panel);
  border-bottom:1px solid var(--border); overflow-x:auto; position:sticky; top:55px; z-index:9;
}
nav button{
  flex:none; border:1px solid transparent; background:transparent; color:var(--dim);
  padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  font-family:inherit; white-space:nowrap;
}
nav button:hover{background:var(--border-soft);color:var(--fg)}
nav button.on{background:var(--accent);color:var(--on-accent);font-weight:500}
main{padding:14px 16px 40px;max-width:1180px;margin:0 auto}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;align-items:start}
.layout>*{min-width:0}
aside{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:8px; max-height:calc(100vh - 170px); overflow:auto;
}
aside .group{
  font-size:11px;color:var(--faint);padding:10px 10px 4px;letter-spacing:.5px;
}
aside button{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  color:var(--dim); padding:8px 10px; border-radius:8px; font-size:13px;
  cursor:pointer; font-family:inherit; line-height:1.4;
}
aside button:hover{background:var(--border-soft);color:var(--fg)}
aside button.on{background:var(--sel);color:var(--accent);font-weight:500}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:12px; min-width:0;
}
.card h2{margin:0 0 4px;font-size:15px;font-weight:600}
.card .meta{font-size:12px;color:var(--faint);margin-bottom:10px}
.card .sum{color:var(--dim);font-size:13px;margin:6px 0 12px}
.notes{margin:0 0 12px;padding-left:18px;color:var(--dim);font-size:12.5px}
.notes li{margin:3px 0}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.param{border:1px solid var(--border-soft);border-radius:8px;padding:7px 9px;background:var(--bg)}
.param .k{font-size:11px;color:var(--faint)}
.param .v{font-family:var(--mono);font-size:12.5px;color:var(--syntax);word-break:break-all}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{
  border:1px solid var(--border);background:var(--bg);color:var(--dim);
  padding:5px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.seg button.on{background:var(--sel);border-color:var(--accent);color:var(--accent);font-weight:500}
pre{
  margin:0; padding:12px 14px; background:var(--bg); border:1px solid var(--border-soft);
  border-radius:8px; font-family:var(--mono); font-size:12.5px; line-height:1.55;
  overflow:auto; white-space:pre; tab-size:4; min-width:0; max-width:100%;
}
pre .c{color:var(--cmt)}
pre .w{color:var(--warn)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;min-width:0}
.row .sp{flex:1}
.btn{
  border:1px solid var(--border);background:var(--panel);color:var(--dim);
  padding:6px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;
}
.btn:hover{color:var(--fg);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.hint{color:var(--faint);font-size:12px;overflow-wrap:anywhere}
footer{
  color:var(--faint);font-size:12px;text-align:center;padding:20px 16px 30px;
  line-height:1.8;
}
footer code{font-family:var(--mono);color:var(--dim)}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{max-height:none;display:flex;overflow-x:auto;gap:4px;padding:8px}
  aside .group{display:none}
  aside button{width:auto;white-space:nowrap;flex:none}
  main{padding:10px 10px 30px}
  .params{grid-template-columns:minmax(0,1fr)}
  .card{padding:13px}
  nav{top:52px}
}
</style>
</head>
<body>
<header>
  <div class="bar"></div>
  <div>
    <h1>Yang-SwitchKit</h1>
    <p>交换机配置速查 · 思科 / 华为 / H3C / 锐捷 · <span id="ver"></span></p>
  </div>
</header>

<nav id="tabs">
  <button data-view="gen" class="on">生成命令</button>
  <button data-view="doc">命令详解</button>
  <button data-view="cmp">四厂商对照</button>
  <button data-view="diag">故障排查</button>
</nav>

<main>
  <section id="view-gen">
    <div class="layout">
      <aside id="scene-list"></aside>
      <div id="scene-detail"></div>
    </div>
  </section>

  <section id="view-doc" hidden>
    <div class="card">
      <div class="row">
        <div class="seg" id="doc-vendors"></div>
        <div class="sp"></div>
        <button class="btn" id="doc-copy">复制</button>
      </div>
      <pre id="doc-body"></pre>
    </div>
  </section>

  <section id="view-cmp" hidden>
    <div class="card">
      <div class="row">
        <span class="hint">同一件事在四家分别怎么写，横向记比竖着背有效。</span>
        <div class="sp"></div>
        <button class="btn" id="cmp-copy">复制</button>
      </div>
      <pre id="cmp-body"></pre>
    </div>
  </section>

  <section id="view-diag" hidden>
    <div class="layout">
      <aside id="case-list"></aside>
      <div id="case-detail"></div>
    </div>
  </section>
</main>

<footer>
  命令与桌面版 Yang-SwitchKit 同源导出，逐字一致。<br>

</footer>

<script>const DATA={"name":"Yang-SwitchKit","version":"V3.0.0","vendors":[{"key":"h3c","name":"H3C 新华三","platform":"Comware V5 / V7","port_hint":"接口编号形如 GigabitEthernet1/0/1；万兆为 Ten-GigabitEthernet1/0/49；三层接口为 Vlan-interface 10。"},{"key":"huawei","name":"华为 Huawei","platform":"VRP V5 / V8","port_hint":"接口编号通常形如 GigabitEthernet0/0/1（从 0 开始，与 H3C 不同）；万兆为 XGigabitEthernet0/0/49；三层接口为 Vlanif 10。"},{"key":"cisco","name":"思科 Cisco","platform":"IOS 12.x / 15.x","port_hint":"接口编号形如 GigabitEthernet1/0/1（堆叠/模块化机型）或 GigabitEthernet0/1（2960 等固定机型）；三层接口为 Vlan10。"},{"key":"ruijie","name":"锐捷 Ruijie","platform":"RGOS 10.x / 11.x","port_hint":"接口编号形如 GigabitEthernet 0/1，名称与编号之间有空格；万兆为 TenGigabitEthernet 0/49；三层接口为 Vlan 10。"}],"scenarios":[{"key":"vlan_port","name":"VLAN 创建与端口划分","group":"二层","summary":"批量创建 VLAN，并把端口批量配成 Access 或 Trunk。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。","Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。"],"params":[{"label":"VLAN 列表","help":"逗号分隔，支持区间写法如 10-14,20。","example":"","default":"10,20,30"},{"label":"VLAN 描述","help":"选填。如 10:Sales,20:IT。H3C/思科/锐捷用 name，华为用 description。","example":"10:Sales,20:IT","default":""},{"label":"端口模式","help":"","example":"","default":"access"},{"label":"端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":"1/0/1-8"},{"label":"Trunk 放通 VLAN","help":"仅 Trunk 模式生效。填 all 表示全部放通。","example":"10,20,30","default":"all"},{"label":"Trunk 缺省 VLAN","help":"仅 Trunk 模式生效。互联口建议改成专用 VLAN，别用 VLAN 1。","example":"1","default":"1"}],"samples":[{"label":"默认参数","values":{"VLAN 列表":"10,20,30","VLAN 描述":"","端口模式":"Access（接终端）","端口":"1/0/1-8","Trunk 放通 VLAN":"all","Trunk 缺省 VLAN":"1"},"commands":{"h3c":"\n# ---- 创建 VLAN ----\nsystem-view\nvlan 10\n quit\nvlan 20\n quit\nvlan 30\n quit\n\n# ---- Access 端口划入 VLAN 10 ----\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port link-type access\n port access vlan 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] VLAN 有 3 个、端口有 8 个，无法一一对应，已统一划入 VLAN 10，请确认是否符合预期。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","huawei":"\n# ---- 创建 VLAN ----\n# 华为的 VLAN 描述字段是 description，H3C 与思科用 name，注意区别。\nsystem-view\nvlan 10\n quit\nvlan 20\n quit\nvlan 30\n quit\n\n# ---- Access 端口划入 VLAN 10 ----\n# 华为的 Access 端口用 port default vlan，H3C 是 port access vlan。\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port link-type access\n port default vlan 10\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] VLAN 有 3 个、端口有 8 个，无法一一对应，已统一划入 VLAN 10。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","cisco":"\n# ---- 创建 VLAN ----\n# 思科的 VLAN 描述用 name，华为用 description。\nconfigure terminal\nvlan 10\nexit\nvlan 20\nexit\nvlan 30\nexit\n\n# ---- Access 端口划入 VLAN 10 ----\ninterface range GigabitEthernet1/0/1 - 8\n switchport mode access\n switchport access vlan 10\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] VLAN 有 3 个、端口有 8 个，无法一一对应，已统一划入 VLAN 10。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","ruijie":"\n# ---- 创建 VLAN ----\nconfigure terminal\nvlan 10\nexit\nvlan 20\nexit\nvlan 30\nexit\n\n# ---- Access 端口划入 VLAN 10 ----\ninterface range GigabitEthernet 1/0/1-8\n switchport mode access\n switchport access vlan 10\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] VLAN 有 3 个、端口有 8 个，无法一一对应，已统一划入 VLAN 10。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。"}},{"label":"Trunk（设备互联）","values":{"VLAN 列表":"10,20,30","VLAN 描述":"","端口模式":"Trunk（设备互联）","端口":"1/0/1-8","Trunk 放通 VLAN":"all","Trunk 缺省 VLAN":"1"},"commands":{"h3c":"\n# ---- 创建 VLAN ----\nsystem-view\nvlan 10\n quit\nvlan 20\n quit\nvlan 30\n quit\n\n# ---- 配置 Trunk 端口 ----\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port link-type trunk\n port trunk permit vlan all\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] Trunk 放通全部 VLAN 会把广播域铺满，若不必要请改成明确的 VLAN 列表。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","huawei":"\n# ---- 创建 VLAN ----\n# 华为的 VLAN 描述字段是 description，H3C 与思科用 name，注意区别。\nsystem-view\nvlan 10\n quit\nvlan 20\n quit\nvlan 30\n quit\n\n# ---- 配置 Trunk 端口 ----\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port link-type trunk\n port trunk allow-pass vlan all\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] Trunk 放通全部 VLAN 会扩大广播域，建议改成明确的 VLAN 列表。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","cisco":"\n# ---- 创建 VLAN ----\n# 思科的 VLAN 描述用 name，华为用 description。\nconfigure terminal\nvlan 10\nexit\nvlan 20\nexit\nvlan 30\nexit\n\n# ---- 配置 Trunk 端口 ----\n# switchport trunk encapsulation dot1q 仅部分平台需要，2960 等只支持 802.1Q 的机型若报错可删除此行。\ninterface range GigabitEthernet1/0/1 - 8\n switchport trunk encapsulation dot1q\n switchport mode trunk\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] Trunk 放通全部 VLAN 会扩大广播域，建议改为明确的 VLAN 列表。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。","ruijie":"\n# ---- 创建 VLAN ----\nconfigure terminal\nvlan 10\nexit\nvlan 20\nexit\nvlan 30\nexit\n\n# ---- 配置 Trunk 端口 ----\n# 锐捷追加放通 VLAN 必须带 add，否则会覆盖已有列表。\ninterface range GigabitEthernet 1/0/1-8\n switchport mode trunk\n switchport trunk allowed vlan all\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] Trunk 放通全部 VLAN 会扩大广播域，建议改为明确的 VLAN 列表。\n\n# --------------------------------------------------------------------\n# [提示] 互联链路的缺省 VLAN 建议改为专用 VLAN，避免 VLAN 1 被利用。\n# [提示] Access 口上允许的业务 VLAN 由端口模式决定，不需要额外放通。"}}]},{"key":"lag","name":"链路聚合（LACP）","group":"二层","summary":"把多条物理链路捆成一条逻辑链路，提升带宽并做链路级冗余。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。","跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。"],"params":[{"label":"聚合组号","help":"","example":"1","default":"1"},{"label":"聚合模式","help":"","example":"","default":"lacp"},{"label":"成员端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-2","default":"1/0/1-2"},{"label":"聚合口类型","help":"","example":"","default":"trunk"},{"label":"放通 VLAN","help":"仅 Trunk 生效。","example":"10,20","default":"10,20"},{"label":"缺省 VLAN","help":"仅 Trunk 生效。","example":"","default":"1"}],"samples":[{"label":"默认参数","values":{"聚合组号":"1","聚合模式":"动态 LACP","成员端口":"1/0/1-2","聚合口类型":"Trunk","放通 VLAN":"10,20","缺省 VLAN":"1"},"commands":{"h3c":"\n# ---- 创建聚合接口 ----\n# 三层聚合用 Route-Aggregation，二层聚合用 Bridge-Aggregation，注意区分。\nsystem-view\ninterface Bridge-Aggregation 1\n port link-type trunk\n port trunk permit vlan 10 20\n link-aggregation mode dynamic\n quit\n\n# ---- 成员端口加入聚合组 ----\nsystem-view\ninterface GigabitEthernet1/0/1\n port link-aggregation group 1\n quit\ninterface GigabitEthernet1/0/2\n port link-aggregation group 1\n quit\n\n# ---- 确认聚合口放通 VLAN ----\n# 确认成员口 VLAN 配置与聚合口一致，不一致会加入失败。\nsystem-view\ninterface Bridge-Aggregation 1\n display this\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","huawei":"\n# ---- 创建聚合接口 ----\n# 华为动态聚合为 mode lacp-static，静态聚合为 mode manual load-balance。\nsystem-view\ninterface Eth-Trunk 1\n port link-type trunk\n port trunk allow-pass vlan 10 20\n mode lacp-static\n quit\n\n# ---- 成员端口加入聚合组 ----\nsystem-view\ninterface GigabitEthernet1/0/1\n eth-trunk 1\n quit\ninterface GigabitEthernet1/0/2\n eth-trunk 1\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","cisco":"\n# ---- 成员端口加入通道组 ----\n# LACP 用 mode active，静态聚合用 mode on；两端模式必须匹配。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 2\n channel-group 1 mode active\n exit\n\n# ---- 配置 Port-channel 接口 ----\n# 通道口的 VLAN 配置要与成员口一致。\nconfigure terminal\ninterface Port-channel1\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","ruijie":"\n# ---- 成员端口加入聚合组 ----\n# 锐捷的聚合口叫 AggregatePort（AP），成员口用 port-group 加入。LACP 用 mode active，静态聚合用 mode on。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-2\n port-group 1 mode active\n exit\n\n# ---- 配置聚合口 ----\n# 聚合口的 VLAN 配置必须与成员口一致，否则无法正常转发。\nconfigure terminal\ninterface AggregatePort 1\n switchport mode trunk\n switchport trunk allowed vlan add 10,20\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 若设备不支持 port-group mode 参数，请去掉 mode 部分直接写 port-group 组号。\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。"}},{"label":"静态（手工）聚合","values":{"聚合组号":"1","聚合模式":"静态（手工）聚合","成员端口":"1/0/1-2","聚合口类型":"Trunk","放通 VLAN":"10,20","缺省 VLAN":"1"},"commands":{"h3c":"\n# ---- 创建聚合接口 ----\n# 三层聚合用 Route-Aggregation，二层聚合用 Bridge-Aggregation，注意区分。\nsystem-view\ninterface Bridge-Aggregation 1\n port link-type trunk\n port trunk permit vlan 10 20\n quit\n\n# ---- 成员端口加入聚合组 ----\nsystem-view\ninterface GigabitEthernet1/0/1\n port link-aggregation group 1\n quit\ninterface GigabitEthernet1/0/2\n port link-aggregation group 1\n quit\n\n# ---- 确认聚合口放通 VLAN ----\n# 确认成员口 VLAN 配置与聚合口一致，不一致会加入失败。\nsystem-view\ninterface Bridge-Aggregation 1\n display this\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","huawei":"\n# ---- 创建聚合接口 ----\n# 华为动态聚合为 mode lacp-static，静态聚合为 mode manual load-balance。\nsystem-view\ninterface Eth-Trunk 1\n port link-type trunk\n port trunk allow-pass vlan 10 20\n mode manual load-balance\n quit\n\n# ---- 成员端口加入聚合组 ----\nsystem-view\ninterface GigabitEthernet1/0/1\n eth-trunk 1\n quit\ninterface GigabitEthernet1/0/2\n eth-trunk 1\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","cisco":"\n# ---- 成员端口加入通道组 ----\n# LACP 用 mode active，静态聚合用 mode on；两端模式必须匹配。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 2\n channel-group 1 mode on\n exit\n\n# ---- 配置 Port-channel 接口 ----\n# 通道口的 VLAN 配置要与成员口一致。\nconfigure terminal\ninterface Port-channel1\n switchport mode trunk\n switchport trunk allowed vlan 10,20\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。","ruijie":"\n# ---- 成员端口加入聚合组 ----\n# 锐捷的聚合口叫 AggregatePort（AP），成员口用 port-group 加入。LACP 用 mode active，静态聚合用 mode on。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-2\n port-group 1 mode on\n exit\n\n# ---- 配置聚合口 ----\n# 聚合口的 VLAN 配置必须与成员口一致，否则无法正常转发。\nconfigure terminal\ninterface AggregatePort 1\n switchport mode trunk\n switchport trunk allowed vlan add 10,20\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 若设备不支持 port-group mode 参数，请去掉 mode 部分直接写 port-group 组号。\n\n# --------------------------------------------------------------------\n# [提示] 成员口的速率、双工、VLAN 配置必须完全一致，否则无法加入聚合组。\n# [提示] 跨设备聚合需要堆叠或 M-LAG / VSU 支持，单机聚合不跨设备。"}}]},{"key":"stacking","name":"堆叠 / IRF / VSU（设备虚拟化）","group":"高可用","summary":"把两台设备虚拟成一台，简化管理并提供设备级冗余。","versions":"H3C IRF（V7）· 华为 iStack（V5R5+）· 思科 StackWise / VPC · 锐捷 VSU","notes":["改成员号和激活堆叠口会重启设备并中断业务，务必在维护窗口内操作。","两台设备的命令必须分别生成、分别执行，先配从设备再配主设备。","堆叠线缆要按官方推荐的拓扑连接，避免单点故障。"],"params":[{"label":"本机成员号","help":"生成的是「本机」命令，两台设备分别填 1 和 2 各生成一次。","example":"","default":"1"},{"label":"优先级","help":"数值越大越优先成为主机。H3C/华为/锐捷常见 32 与 16，思科 StackWise 为 1-15。","example":"","default":"32"},{"label":"堆叠口 1","help":"填物理口全名或简写如 XGE1/0/49。","example":"XGE1/0/49","default":"Ten-GigabitEthernet1/0/49"},{"label":"堆叠口 2","help":"选填。双链路堆叠更可靠，建议成对使用。","example":"XGE1/0/50","default":"Ten-GigabitEthernet1/0/50"},{"label":"虚拟域号","help":"IRF 域号 / VSU 域号。思科与华为的部分型号忽略此项。","example":"","default":"1"}],"samples":[{"label":"默认参数","values":{"本机成员号":"1","优先级":"32","堆叠口 1":"Ten-GigabitEthernet1/0/49","堆叠口 2":"Ten-GigabitEthernet1/0/50","虚拟域号":"1"},"commands":{"h3c":"\n# ---- 设置成员优先级与域 ----\n# 优先级数值越大越优先成为主机；域号可避免不同 IRF 误合并。\nsystem-view\nirf member 1 priority 32\nirf domain 1\n\n# ---- 堆叠口置为关闭（配置前必须） ----\nsystem-view\ninterface Ten-GigabitEthernet1/0/49\n shutdown\n quit\ninterface Ten-GigabitEthernet1/0/50\n shutdown\n quit\n\n# ---- 绑定 IRF 物理端口 ----\n# 同一成员的两个 IRF 端口不能绑定同一物理口。\nsystem-view\nirf-port 1/1\n port group interface Ten-GigabitEthernet1/0/49\n quit\nirf-port 1/2\n port group interface Ten-GigabitEthernet1/0/50\n quit\n\n# ---- 恢复堆叠口 ----\nsystem-view\ninterface Ten-GigabitEthernet1/0/49\n undo shutdown\n quit\ninterface Ten-GigabitEthernet1/0/50\n undo shutdown\n quit\n\n# ---- 保存并激活 IRF ----\n# 激活瞬间主备会重新选举，业务会有秒级抖动。\nsystem-view\nsave force\nirf-port-configuration active\n\n# --------------------------------------------------------------------\n# [提示] 改成员号和激活堆叠口会重启设备并中断业务，务必在维护窗口内操作。\n# [提示] 两台设备的命令必须分别生成、分别执行，先配从设备再配主设备。\n# [提示] 堆叠线缆要按官方推荐的拓扑连接，避免单点故障。","huawei":"\n# ---- 设置堆叠优先级 ----\n# slot 0 为本机槽位号；华为 iStack 的槽位号需先用 display stack 确认。\nsystem-view\nstack slot 0 priority 32\n\n# ---- 绑定堆叠物理端口 ----\n# 华为堆叠端口编号与物理端口需一一对应，请按机型手册核对。\nsystem-view\ninterface stack-port 0/1\n port interface XGigabitEthernet1/0/49 enable\n quit\ninterface stack-port 0/2\n port interface XGigabitEthernet1/0/50 enable\n quit\n\n# ---- 保存并重启 ----\n# 保存后执行 reboot 使堆叠配置生效。\nsystem-view\nsave\n\n# --------------------------------------------------------------------\n# [风险] 华为 iStack 的具体命令随型号（S5700 / S6720 / S12700）差异较大，下发前请核对手册。\n# [风险] 成员号变更与堆叠激活都会重启设备。\n\n# --------------------------------------------------------------------\n# [提示] 改成员号和激活堆叠口会重启设备并中断业务，务必在维护窗口内操作。\n# [提示] 两台设备的命令必须分别生成、分别执行，先配从设备再配主设备。\n# [提示] 堆叠线缆要按官方推荐的拓扑连接，避免单点故障。","cisco":"\n# ---- 设置堆叠优先级 ----\n# 堆叠编号用 show switch 确认，把命令里的 1 换成实际编号。StackWise 优先级 1-15，数值越大越优先成为 Active。\nconfigure terminal\nswitch 1 priority 1\n\n# ---- 保存并重启 ----\n# 保存后重启使堆叠生效。\nconfigure terminal\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] StackWise 优先级范围是 1-15，已按下限 1 处理（原值 32）。\n# [风险] 堆叠配置会重启设备，务必在维护窗口内操作。\n\n# --------------------------------------------------------------------\n# [提示] 思科不同系列的堆叠实现差异很大：StackWise（3750/3850/9300）、StackWise-480、VSS（4500/6500）命令各不相同，此处仅给出 StackWise 骨架。\n# [提示] 若是独立部署的 Nexus 系列做双活，应改用 vPC 方案，与 StackWise 无关。\n# [提示] 改成员号和激活堆叠口会重启设备并中断业务，务必在维护窗口内操作。\n# [提示] 两台设备的命令必须分别生成、分别执行，先配从设备再配主设备。\n# [提示] 堆叠线缆要按官方推荐的拓扑连接，避免单点故障。","ruijie":"\n# ---- 配置 VSU 虚拟域与 VSL 链路 ----\n# 锐捷的堆叠叫 VSU，互联链路叫 VSL，用 switch virtual domain 组织。两台设备分别填入各自的成员号与优先级。\nconfigure terminal\nswitch virtual domain 1\n switch 1\n  switch 1 priority 32\n  vsl-port\n   port-member interface TenGigabitEthernet 1/0/49\n   port-member interface TenGigabitEthernet 1/0/50\n   exit\n  exit\n exit\n\n# ---- 保存并激活 ----\n# 部分版本需在保存后手动执行 vsl-port-configuration active 或直接重启生效，请按本机手册确认。\nconfigure terminal\nwrite\nreload\n\n# --------------------------------------------------------------------\n# [风险] VSU 激活会重启设备，务必在维护窗口内操作。\n\n# --------------------------------------------------------------------\n# [提示] VSL 建议使用至少两条万兆链路并做跨设备聚合，避免单条链路故障导致分裂。\n# [提示] 改成员号和激活堆叠口会重启设备并中断业务，务必在维护窗口内操作。\n# [提示] 两台设备的命令必须分别生成、分别执行，先配从设备再配主设备。\n# [提示] 堆叠线缆要按官方推荐的拓扑连接，避免单点故障。"}}]},{"key":"stp","name":"生成树（MSTP / RSTP）","group":"二层","summary":"配置生成树模式、根桥角色与实例映射，消除二层环路。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。","根桥应放在核心层，接入层设备不要抢根。"],"params":[{"label":"生成树模式","help":"","example":"","default":"mstp"},{"label":"根桥角色","help":"","example":"","default":"primary"},{"label":"实例与 VLAN 映射","help":"仅 MSTP。格式 实例号:VLAN列表，多组用分号分隔。","example":"1:10,20;2:30,40","default":"1:10,20;2:30,40"},{"label":"MST 域名","help":"仅 MSTP。同域设备的域名、修订级别、映射必须完全一致。","example":"","default":"REGION-1"},{"label":"MST 修订级别","help":"仅 MSTP。","example":"","default":"0"},{"label":"接入口设为边缘端口","help":"接 PC / 服务器的端口，留空则不配置。支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":""}],"samples":[{"label":"默认参数","values":{"生成树模式":"MSTP（多实例）","根桥角色":"主根桥","实例与 VLAN 映射":"1:10,20;2:30,40","MST 域名":"REGION-1","MST 修订级别":"0","接入口设为边缘端口":""},"commands":{"h3c":"\n# ---- 启用并设置生成树模式 ----\n# Comware V5 的启用命令是 stp enable，V7 为 stp global enable。\nsystem-view\nstp global enable\nstp mode mstp\n\n# ---- MSTP 域配置 ----\n# 同一域内所有设备的域名、修订级别、实例映射必须完全一致。\nsystem-view\nstp region-configuration\n region-name REGION-1\n revision-level 0\n instance 1 vlan 10 20\n instance 2 vlan 30 40\n active region-configuration\n quit\n\n# ---- 指定根桥角色 ----\n# 根桥应部署在核心层，接入层设备不要抢根。\nsystem-view\nstp instance 1 root primary\nstp instance 2 root primary\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","huawei":"\n# ---- 设置生成树模式 ----\nsystem-view\nstp enable\nstp mode mstp\n\n# ---- MSTP 域配置 ----\n# 同一域内所有设备的域名、修订级别、实例映射必须完全一致。\nsystem-view\nstp region-configuration\n region-name REGION-1\n revision-level 0\n instance 1 vlan 10 20\n instance 2 vlan 30 40\n active region-configuration\n quit\n\n# ---- 指定根桥角色 ----\nsystem-view\nstp instance 1 root primary\nstp instance 2 root primary\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","cisco":"\n# ---- 设置生成树模式 ----\n# 思科默认是 PVST+，与对端设备混用 MSTP 时要注意实例映射。\nconfigure terminal\nspanning-tree mode mst\n\n# ---- MST 域配置 ----\n# 思科的域配置用 exit 退出即生效，不需要额外的激活命令。\nconfigure terminal\nspanning-tree mst configuration\n name REGION-1\n revision 0\n instance 1 vlan 10,20\n instance 2 vlan 30,40\nexit\n\n# ---- 指定根桥角色 ----\nconfigure terminal\nspanning-tree mst 1 root primary\nspanning-tree mst 2 root primary\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","ruijie":"\n# ---- 启用生成树并设置模式 ----\nconfigure terminal\nspanning-tree\nspanning-tree mode mstp\n\n# ---- MST 域配置 ----\n# 锐捷的修订级别字段用 revision，且退出配置模式后立即生效。\nconfigure terminal\nspanning-tree mst configuration\n name REGION-1\n revision 0\n instance 1 vlan 10,20\n instance 2 vlan 30,40\nexit\n\n# ---- 指定根桥角色 ----\n# 锐捷用优先级间接指定根桥，主根 4096、备根 8192，数值越小越优先，步长 4096。\nconfigure terminal\nspanning-tree mst 1 priority 4096\nspanning-tree mst 2 priority 4096\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。"}},{"label":"RSTP（快速）","values":{"生成树模式":"RSTP（快速）","根桥角色":"主根桥","实例与 VLAN 映射":"1:10,20;2:30,40","MST 域名":"REGION-1","MST 修订级别":"0","接入口设为边缘端口":""},"commands":{"h3c":"\n# ---- 启用并设置生成树模式 ----\n# Comware V5 的启用命令是 stp enable，V7 为 stp global enable。\nsystem-view\nstp global enable\nstp mode rstp\n\n# ---- 指定根桥角色 ----\n# 根桥应部署在核心层，接入层设备不要抢根。\nsystem-view\nstp root primary\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","huawei":"\n# ---- 设置生成树模式 ----\nsystem-view\nstp enable\nstp mode rstp\n\n# ---- 指定根桥角色 ----\nsystem-view\nstp root primary\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","cisco":"\n# ---- 设置生成树模式 ----\n# 思科默认是 PVST+，与对端设备混用 MSTP 时要注意实例映射。\nconfigure terminal\nspanning-tree mode rapid-pvst\n\n# ---- 指定根桥角色 ----\nconfigure terminal\nspanning-tree mst 1 root primary\nspanning-tree mst 2 root primary\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。","ruijie":"\n# ---- 启用生成树并设置模式 ----\nconfigure terminal\nspanning-tree\nspanning-tree mode rstp\n\n# ---- 指定根桥角色 ----\n# 锐捷用优先级间接指定根桥，主根 4096、备根 8192，数值越小越优先，步长 4096。\nconfigure terminal\nspanning-tree mst 1 priority 4096\nspanning-tree mst 2 priority 4096\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 全网生成树模式必须统一，混用 MSTP 与 RSTP 会算出意外的拓扑。\n# [提示] 根桥应放在核心层，接入层设备不要抢根。"}}]},{"key":"dhcp","name":"DHCP 服务与中继","group":"三层","summary":"在三层接口上下发地址池，或把 DHCP 请求中继给外部服务器。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。","中继模式只需在三层接口上指定服务器地址，不需要建地址池。"],"params":[{"label":"角色","help":"","example":"","default":"server"},{"label":"三层接口 VLAN","help":"","example":"10","default":"10"},{"label":"接口 IP","help":"","example":"","default":"192.168.10.1"},{"label":"掩码长度","help":"","example":"24","default":"24"},{"label":"地址池名称","help":"","example":"","default":"POOL-VLAN10"},{"label":"地址池网段","help":"仅服务器模式生效。","example":"192.168.10.0","default":"192.168.10.0"},{"label":"下发网关","help":"仅服务器模式生效。","example":"","default":"192.168.10.1"},{"label":"下发 DNS","help":"多个用逗号分隔。","example":"223.5.5.5,119.29.29.29","default":"223.5.5.5"},{"label":"排除地址","help":"仅服务器模式生效。留给网关、服务器等静态设备。","example":"","default":"192.168.10.1-192.168.10.20"},{"label":"中继目标服务器","help":"仅中继模式生效，可填多个用逗号分隔。","example":"10.0.0.100","default":"10.0.0.100"}],"samples":[{"label":"默认参数","values":{"角色":"本机做 DHCP 服务器","三层接口 VLAN":"10","接口 IP":"192.168.10.1","掩码长度":"24","地址池名称":"POOL-VLAN10","地址池网段":"192.168.10.0","下发网关":"192.168.10.1","下发 DNS":"223.5.5.5","排除地址":"192.168.10.1-192.168.10.20","中继目标服务器":"10.0.0.100"},"commands":{"h3c":"\n# ---- 配置 DHCP 服务器 ----\nsystem-view\ndhcp enable\ndhcp server ip-pool POOL-VLAN10\n network 192.168.10.0 mask 255.255.255.0\n gateway-list 192.168.10.1\n dns-list 223.5.5.5\n forbidden-ip 192.168.10.1 192.168.10.2 192.168.10.3 192.168.10.4 192.168.10.5 192.168.10.6 192.168.10.7 192.168.10.8 192.168.10.9 192.168.10.10 192.168.10.11 192.168.10.12 192.168.10.13 192.168.10.14 192.168.10.15 192.168.10.16 192.168.10.17 192.168.10.18 192.168.10.19 192.168.10.20\n quit\ninterface Vlan-interface 10\n ip address 192.168.10.1 24\n dhcp server apply ip-pool POOL-VLAN10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","huawei":"\n# ---- 配置 DHCP 服务器 ----\n# 华为的三层接口名是 Vlanif，H3C 是 Vlan-interface，思科是 Vlan。\nsystem-view\ndhcp enable\nip pool POOL-VLAN10\n network 192.168.10.0 mask 255.255.255.0\n gateway-list 192.168.10.1\n dns-list 223.5.5.5\n excluded-ip-address 192.168.10.1 192.168.10.20\n quit\ninterface Vlanif 10\n ip address 192.168.10.1 24\n dhcp select global\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","cisco":"\n# ---- 配置 DHCP 服务器 ----\n# 思科的三层接口是 Vlan10 这种写法，且需要 no shutdown 才会启用。接口地址落在地址池网段内即可自动分配，无需在接口上引用池名。\nconfigure terminal\nip dhcp excluded-address 192.168.10.1 192.168.10.20\nip dhcp pool POOL-VLAN10\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 223.5.5.5\n exit\ninterface Vlan10\n ip address 192.168.10.1 255.255.255.0\n no shutdown\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","ruijie":"\n# ---- 配置 DHCP 服务器 ----\n# 锐捷用的是 service dhcp 开启服务，接口写法是 Vlan 10（带空格）。\nconfigure terminal\nservice dhcp\nip dhcp excluded-address 192.168.10.1 192.168.10.20\nip dhcp pool POOL-VLAN10\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 223.5.5.5\n exit\ninterface Vlan 10\n ip address 192.168.10.1 255.255.255.0\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。"}},{"label":"DHCP 中继","values":{"角色":"DHCP 中继","三层接口 VLAN":"10","接口 IP":"192.168.10.1","掩码长度":"24","地址池名称":"POOL-VLAN10","地址池网段":"192.168.10.0","下发网关":"192.168.10.1","下发 DNS":"223.5.5.5","排除地址":"192.168.10.1-192.168.10.20","中继目标服务器":"10.0.0.100"},"commands":{"h3c":"\n# ---- 配置 DHCP 中继 ----\nsystem-view\ndhcp enable\ninterface Vlan-interface 10\n ip address 192.168.10.1 24\n dhcp select relay\n dhcp relay server-address 10.0.0.100\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 中继模式下由外部服务器分配地址，本机不建地址池。\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","huawei":"\n# ---- 配置 DHCP 中继 ----\n# 华为中继用 dhcp relay server-ip，H3C 用 dhcp relay server-address。\nsystem-view\ndhcp enable\ninterface Vlanif 10\n ip address 192.168.10.1 24\n dhcp select relay\n dhcp relay server-ip 10.0.0.100\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","cisco":"\n# ---- 配置 DHCP 中继 ----\n# 思科用 ip helper-address 转发 DHCP 请求，H3C/华为用专用的 relay 命令。\nconfigure terminal\ninterface Vlan10\n ip address 192.168.10.1 255.255.255.0\n ip helper-address 10.0.0.100\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。","ruijie":"\n# ---- 配置 DHCP 中继 ----\nconfigure terminal\ninterface Vlan 10\n ip address 192.168.10.1 255.255.255.0\n ip helper-address 10.0.0.100\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 服务器模式下要先在全局开启 DHCP 功能，否则地址池不生效。\n# [提示] 中继模式只需在三层接口上指定服务器地址，不需要建地址池。"}}]},{"key":"static_route","name":"静态路由","group":"三层","summary":"配置到目标网段的静态路由，可用优先级实现浮动备份。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["浮动路由的做法：主路由优先级取默认值，备份路由填一个更大的值（更低优先级）。","下一跳必须在本机直连网段内，否则路由不生效。"],"params":[{"label":"路由条目","help":"每行一条，格式：目标网段/掩码长度 下一跳 [优先级]。下一跳也可写出接口。","example":"0.0.0.0/0 10.1.1.1","default":"0.0.0.0/0 10.1.1.1\n192.168.100.0/24 10.1.1.2"},{"label":"优先级（留空用默认）","help":"留空则不下发优先级字段。H3C/华为的静态路由优先级默认 60；思科/锐捷最后一段是管理距离，默认 1。两者都是数值越大越不优先。","example":"100","default":""},{"label":"路由描述","help":"选填。仅 H3C/华为/锐捷支持描述字段。","example":"","default":""}],"samples":[{"label":"默认参数","values":{"路由条目":"0.0.0.0/0 10.1.1.1\n192.168.100.0/24 10.1.1.2","优先级（留空用默认）":"","路由描述":""},"commands":{"h3c":"\n# ---- 配置静态路由 ----\n# H3C 静态路由默认优先级 60，数值越大优先级越低。未填写优先级时不下发该字段，由设备使用默认值。\nsystem-view\nip route-static 0.0.0.0 0 10.1.1.1\nip route-static 192.168.100.0 24 10.1.1.2\n\n# ---- 下发后核对 ----\n# 确认路由已进入路由表且下一跳可达。\nsystem-view\ndisplay ip routing-table 0.0.0.0/0 verbose\ndisplay ip routing-table 192.168.100.0/24 verbose\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 浮动路由的做法：主路由优先级取默认值，备份路由填一个更大的值（更低优先级）。\n# [提示] 下一跳必须在本机直连网段内，否则路由不生效。","huawei":"\n# ---- 配置静态路由 ----\n# 华为静态路由默认优先级 60，数值越大优先级越低。\nsystem-view\nip route-static 0.0.0.0 0 10.1.1.1\nip route-static 192.168.100.0 24 10.1.1.2\n\n# ---- 下发后核对 ----\nsystem-view\ndisplay ip routing-table 0.0.0.0\ndisplay ip routing-table 192.168.100.0\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 浮动路由的做法：主路由优先级取默认值，备份路由填一个更大的值（更低优先级）。\n# [提示] 下一跳必须在本机直连网段内，否则路由不生效。","cisco":"\n# ---- 配置静态路由 ----\n# 思科最后一段是管理距离（AD），默认 1，数值越大越不优先。做浮动路由时给备份路由填一个更大的 AD，例如 200。\nconfigure terminal\nip route 0.0.0.0 0.0.0.0 10.1.1.1\nip route 192.168.100.0 255.255.255.0 10.1.1.2\n\n# ---- 下发后核对 ----\nconfigure terminal\nshow ip route static\nshow ip route summary\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 浮动路由的做法：主路由优先级取默认值，备份路由填一个更大的值（更低优先级）。\n# [提示] 下一跳必须在本机直连网段内，否则路由不生效。","ruijie":"\n# ---- 配置静态路由 ----\n# 最后一段是管理距离，默认 1，数值越大越不优先，可用于浮动路由。\nconfigure terminal\nip route 0.0.0.0 0.0.0.0 10.1.1.1\nip route 192.168.100.0 255.255.255.0 10.1.1.2\n\n# ---- 下发后核对 ----\nconfigure terminal\nshow ip route static\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 浮动路由的做法：主路由优先级取默认值，备份路由填一个更大的值（更低优先级）。\n# [提示] 下一跳必须在本机直连网段内，否则路由不生效。"}}]},{"key":"acl","name":"ACL 访问控制","group":"安全","summary":"定义访问控制列表并应用到接口，实现流量过滤。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。","命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。"],"params":[{"label":"ACL 编号 / 名称","help":"H3C/华为：2000-2999 基础、3000-3999 高级。思科/锐捷：1-99 标准、100-199 扩展。留空则按场景自动选。","example":"3000","default":""},{"label":"规则列表","help":"每行一条：动作 协议 源 目的 [目的端口]。网段写 a.b.c.d/掩码长度 或 any。","example":"permit ip 192.168.10.0/24 any","default":"permit ip 192.168.10.0/24 any\npermit ip 192.168.20.0/24 192.168.30.0/24\ndeny ip any any"},{"label":"应用到端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/24","default":"1/0/24"},{"label":"方向","help":"","example":"","default":"inbound"},{"label":"ACL 描述","help":"选填。","example":"","default":""}],"samples":[{"label":"默认参数","values":{"ACL 编号 / 名称":"","规则列表":"permit ip 192.168.10.0/24 any\npermit ip 192.168.20.0/24 192.168.30.0/24\ndeny ip any any","应用到端口":"1/0/24","方向":"入方向 in","ACL 描述":""},"commands":{"h3c":"\n# ---- 定义 ACL ----\n# Comware V5 使用 acl number 编号，V7 使用 acl basic / advanced。\nsystem-view\nacl advanced 3000\n step 10\n rule 10 permit ip source 192.168.10.0 0.0.0.255\n rule 20 permit ip source 192.168.20.0 0.0.0.255 destination 192.168.30.0 0.0.0.255\n rule 30 deny ip\n quit\n\n# ---- 应用到端口 ----\nsystem-view\ninterface GigabitEthernet1/0/24\n packet-filter 3000 inbound\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 3000。\n# [提示] packet-filter 只能过滤进入端口 inbound 方向的流量，请确认方向正确。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","huawei":"\n# ---- 定义 ACL ----\n# 华为 ACL 规则步长默认 5，编号按 5 递增。\nsystem-view\nacl number 3000\n rule 5 permit ip source 192.168.10.0 0.0.0.255\n rule 10 permit ip source 192.168.20.0 0.0.0.255 destination 192.168.30.0 0.0.0.255\n rule 15 deny ip\n quit\n\n# ---- 应用到端口 ----\n# 华为在接口下用 traffic-filter 调用 ACL。\nsystem-view\ninterface GigabitEthernet1/0/24\n traffic-filter inbound acl 3000\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 3000。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","cisco":"\n# ---- 定义 ACL ----\n# 思科的扩展 ACL 编号为 100-199 或 2000-2699；命名的写法则用名称代替编号。\nconfigure terminal\nip access-list extended 100\n 10 permit ip 192.168.10.0 0.0.0.255 any\n 20 permit ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255\n 30 deny ip any any\n exit\n\n# ---- 应用到端口 ----\n# 思科用 ip access-group 调用 ACL，H3C 用 packet-filter，华为用 traffic-filter。\nconfigure terminal\ninterface GigabitEthernet1/0/24\n ip access-group 100 in\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 100。\n# [提示] 思科 ACL 末尾自带隐式 deny any any，无需手工添加拒绝规则。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","ruijie":"\n# ---- 定义 ACL ----\n# 锐捷扩展 ACL 编号为 100-199，标准 ACL 为 1-99，命名的写法则用名称。\nconfigure terminal\nip access-list extended 100\n 10 permit ip 192.168.10.0 0.0.0.255 any\n 20 permit ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255\n 30 deny ip any any\n exit\n\n# ---- 应用到端口 ----\nconfigure terminal\ninterface GigabitEthernet 1/0/24\n ip access-group 100 in\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 100。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。"}},{"label":"出方向 out","values":{"ACL 编号 / 名称":"","规则列表":"permit ip 192.168.10.0/24 any\npermit ip 192.168.20.0/24 192.168.30.0/24\ndeny ip any any","应用到端口":"1/0/24","方向":"出方向 out","ACL 描述":""},"commands":{"h3c":"\n# ---- 定义 ACL ----\n# Comware V5 使用 acl number 编号，V7 使用 acl basic / advanced。\nsystem-view\nacl advanced 3000\n step 10\n rule 10 permit ip source 192.168.10.0 0.0.0.255\n rule 20 permit ip source 192.168.20.0 0.0.0.255 destination 192.168.30.0 0.0.0.255\n rule 30 deny ip\n quit\n\n# ---- 应用到端口 ----\nsystem-view\ninterface GigabitEthernet1/0/24\n packet-filter 3000 outbound\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 3000。\n# [提示] packet-filter 只能过滤进入端口 outbound 方向的流量，请确认方向正确。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","huawei":"\n# ---- 定义 ACL ----\n# 华为 ACL 规则步长默认 5，编号按 5 递增。\nsystem-view\nacl number 3000\n rule 5 permit ip source 192.168.10.0 0.0.0.255\n rule 10 permit ip source 192.168.20.0 0.0.0.255 destination 192.168.30.0 0.0.0.255\n rule 15 deny ip\n quit\n\n# ---- 应用到端口 ----\n# 华为在接口下用 traffic-filter 调用 ACL。\nsystem-view\ninterface GigabitEthernet1/0/24\n traffic-filter outbound acl 3000\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 3000。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","cisco":"\n# ---- 定义 ACL ----\n# 思科的扩展 ACL 编号为 100-199 或 2000-2699；命名的写法则用名称代替编号。\nconfigure terminal\nip access-list extended 100\n 10 permit ip 192.168.10.0 0.0.0.255 any\n 20 permit ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255\n 30 deny ip any any\n exit\n\n# ---- 应用到端口 ----\n# 思科用 ip access-group 调用 ACL，H3C 用 packet-filter，华为用 traffic-filter。\nconfigure terminal\ninterface GigabitEthernet1/0/24\n ip access-group 100 out\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 100。\n# [提示] 思科 ACL 末尾自带隐式 deny any any，无需手工添加拒绝规则。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。","ruijie":"\n# ---- 定义 ACL ----\n# 锐捷扩展 ACL 编号为 100-199，标准 ACL 为 1-99，命名的写法则用名称。\nconfigure terminal\nip access-list extended 100\n 10 permit ip 192.168.10.0 0.0.0.255 any\n 20 permit ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255\n 30 deny ip any any\n exit\n\n# ---- 应用到端口 ----\nconfigure terminal\ninterface GigabitEthernet 1/0/24\n ip access-group 100 out\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 未填写 ACL 编号，已默认使用 100。\n# [提示] 末尾建议保留显式拒绝规则，避免全部不匹配时默认放行。\n# [提示] 命中次数为 0 的规则会掩盖配置错误，下发后用 display 命令核对计数。"}}]},{"key":"mirror","name":"端口镜像","group":"运维","summary":"把指定端口的流量复制到监控口，接抓包主机或 IDS。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["监控端口的带宽要大于被镜像端口的总流量，否则会丢包。","被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。"],"params":[{"label":"镜像组号","help":"","example":"1","default":"1"},{"label":"被镜像端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-4","default":"1/0/1-4"},{"label":"镜像方向","help":"","example":"","default":"both"},{"label":"监控端口","help":"接抓包主机的端口。该口不要同时承载业务。","example":"1/0/24","default":"1/0/24"},{"label":"镜像 VLAN","help":"选填。填了就做 VLAN 镜像，而不是端口镜像。","example":"100","default":""}],"samples":[{"label":"默认参数","values":{"镜像组号":"1","被镜像端口":"1/0/1-4","镜像方向":"双向 both","监控端口":"1/0/24","镜像 VLAN":""},"commands":{"h3c":"\n# ---- 创建本地镜像组 ----\nsystem-view\nmirroring-group 1 local\n\n# ---- 指定被镜像端口 ----\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/4\n mirroring-group 1 mirroring-port both\n quit\n\n# ---- 指定监控端口 ----\n# 监控口不要承载业务，接抓包主机或 IDS。\nsystem-view\ninterface GigabitEthernet1/0/24\n mirroring-group 1 monitor-port\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","huawei":"\n# ---- 定义观察端口 ----\n# 华为的监控口叫 observe-port（观察端口），先定义再引用。\nsystem-view\nobserve-port 1 interface GigabitEthernet1/0/24\n\n# ---- 配置端口镜像 ----\n# 同一端口只能镜像到一个观察端口。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/4\n port-mirroring to observe-port 1 both\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","cisco":"\n# ---- 配置镜像会话 ----\n# 思科的镜像方向用 rx / tx / both，与其他厂商的 inbound / outbound 写法不同。\nconfigure terminal\nmonitor session 1 source interface GigabitEthernet1/0/1 - 4 both\nmonitor session 1 destination interface GigabitEthernet1/0/24\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","ruijie":"\n# ---- 配置镜像会话 ----\n# 锐捷的镜像命令与思科一致，方向用 rx / tx / both。\nconfigure terminal\nmonitor session 1 source interface GigabitEthernet 1/0/1-4 both\nmonitor session 1 destination interface GigabitEthernet 1/0/24\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。"}},{"label":"入方向 inbound","values":{"镜像组号":"1","被镜像端口":"1/0/1-4","镜像方向":"入方向 inbound","监控端口":"1/0/24","镜像 VLAN":""},"commands":{"h3c":"\n# ---- 创建本地镜像组 ----\nsystem-view\nmirroring-group 1 local\n\n# ---- 指定被镜像端口 ----\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/4\n mirroring-group 1 mirroring-port inbound\n quit\n\n# ---- 指定监控端口 ----\n# 监控口不要承载业务，接抓包主机或 IDS。\nsystem-view\ninterface GigabitEthernet1/0/24\n mirroring-group 1 monitor-port\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","huawei":"\n# ---- 定义观察端口 ----\n# 华为的监控口叫 observe-port（观察端口），先定义再引用。\nsystem-view\nobserve-port 1 interface GigabitEthernet1/0/24\n\n# ---- 配置端口镜像 ----\n# 同一端口只能镜像到一个观察端口。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/4\n port-mirroring to observe-port 1 inbound\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","cisco":"\n# ---- 配置镜像会话 ----\n# 思科的镜像方向用 rx / tx / both，与其他厂商的 inbound / outbound 写法不同。\nconfigure terminal\nmonitor session 1 source interface GigabitEthernet1/0/1 - 4 rx\nmonitor session 1 destination interface GigabitEthernet1/0/24\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。","ruijie":"\n# ---- 配置镜像会话 ----\n# 锐捷的镜像命令与思科一致，方向用 rx / tx / both。\nconfigure terminal\nmonitor session 1 source interface GigabitEthernet 1/0/1-4 rx\nmonitor session 1 destination interface GigabitEthernet 1/0/24\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 监控端口的带宽要大于被镜像端口的总流量，否则会丢包。\n# [提示] 被镜像端口若同时配了端口隔离或聚合，镜像可能不生效。"}}]},{"key":"mgmt","name":"管理面加固（账号 / SSH / NTP / SNMP）","group":"运维","summary":"改设备名、配管理地址、建管理员账号，并启用 SSH、NTP、SNMP。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["关闭 telnet、只保留 SSH，是管理面加固最基本的一条。","开局配置里的明文密码，交付前必须统一更换。","华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。"],"params":[{"label":"设备名","help":"","example":"","default":"SW-CORE-01"},{"label":"管理 VLAN","help":"","example":"","default":"99"},{"label":"管理地址","help":"","example":"","default":"10.0.99.1"},{"label":"掩码长度","help":"","example":"","default":"24"},{"label":"管理网关","help":"选填。","example":"","default":"10.0.99.254"},{"label":"管理员账号","help":"","example":"","default":"netadmin"},{"label":"密码","help":"生成的配置是明文，请仅用于开局，之后统一改密。","example":"","default":"N3t@dmin#2026"},{"label":"权限级别","help":"0-15，15 为最高。","example":"","default":"15"},{"label":"NTP 服务器","help":"选填。","example":"","default":"10.0.0.5"},{"label":"SNMP 版本","help":"","example":"","default":"v2c"},{"label":"SNMP 团体字","help":"v2c 时使用。生产环境务必改掉默认 public / private。","example":"","default":"Read@2026"},{"label":"Trap 接收地址","help":"选填。","example":"","default":"10.0.0.6"},{"label":"SSH 域名","help":"思科/锐捷生成 RSA 密钥前必须先配置域名。","example":"scg.local","default":"scg.local"}],"samples":[{"label":"默认参数","values":{"设备名":"SW-CORE-01","管理 VLAN":"99","管理地址":"10.0.99.1","掩码长度":"24","管理网关":"10.0.99.254","管理员账号":"netadmin","密码":"N3t@dmin#2026","权限级别":"15","NTP 服务器":"10.0.0.5","SNMP 版本":"v2c（团体字）","SNMP 团体字":"Read@2026","Trap 接收地址":"10.0.0.6","SSH 域名":"scg.local"},"commands":{"h3c":"\n# ---- 设备名与管理地址 ----\nsystem-view\nsysname SW-CORE-01\nvlan 99\n quit\ninterface Vlan-interface 99\n ip address 10.0.99.1 24\n quit\nip route-static 0.0.0.0 0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# Comware V5 用 local-user 下的 level 3 指定权限，没有 user-role 概念。\nsystem-view\nlocal-user netadmin class manage\n password simple N3t@dmin#2026\n service-type ssh\n authorization-attribute user-role network-admin\n quit\n\nline vty 0 4\n authentication-mode scheme\n protocol inbound ssh\n quit\nssh server enable\n undo telnet server enable\n\n# ---- NTP 时间同步 ----\n# 时间不准会导致日志、证书和审计记录失去参考价值。\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- SNMP（v2c） ----\nsystem-view\nsnmp-agent\nsnmp-agent community read simple Read@2026\nsnmp-agent sys-info version v2c\nsnmp-agent target-host trap address udp-domain 10.0.0.6 params securityname Read@2026 v2c\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 配置中的密码是明文，交付后请立即更换并改用本地保存的加密方式。\n# [风险] SNMP v2c 团体字以明文传输，生产环境建议改用 v3。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","huawei":"\n# ---- 设备名与管理地址 ----\nsystem-view\nsysname SW-CORE-01\nvlan 99\n quit\ninterface Vlanif 99\n ip address 10.0.99.1 24\n quit\nip route-static 0.0.0.0 0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# rsa local-key-pair create 会交互询问密钥长度，输入 2048；生成需数分钟。\nsystem-view\naaa\n local-user netadmin password irreversible-cipher N3t@dmin#2026\n local-user netadmin privilege level 15\n local-user netadmin service-type ssh\n quit\n\nuser-interface vty 0 4\n authentication-mode aaa\n protocol inbound ssh\n quit\nstelnet server enable\nrsa local-key-pair create\nundo telnet server enable\n\n# ---- NTP 时间同步 ----\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- SNMP（v2c） ----\nsystem-view\nsnmp-agent\nsnmp-agent community read simple Read@2026\nsnmp-agent sys-info version v2c\nsnmp-agent target-host trap address udp-domain 10.0.0.6 params securityname Read@2026 v2c\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n# [风险] 部分软件版本不接受 simple 明文团体字，此时请改用 cipher 并交互输入。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","cisco":"\n# ---- 设备名与管理地址 ----\n# 三层交换机用 ip route 0.0.0.0 0.0.0.0 配默认路由；二层交换机只能配 ip default-gateway。\nconfigure terminal\nhostname SW-CORE-01\nvlan 99\n exit\ninterface Vlan99\n ip address 10.0.99.1 255.255.255.0\n no shutdown\n exit\nip default-gateway 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# 生成 RSA 密钥前必须先配置 ip domain-name 和 hostname，否则会失败。exec-timeout 10 0 表示空闲 10 分钟自动断开。\nconfigure terminal\nusername netadmin privilege 15 secret N3t@dmin#2026\nip domain-name scg.local\ncrypto key generate rsa modulus 2048\nip ssh version 2\n\nline vty 0 4\n transport input ssh\n login local\n exec-timeout 10 0\n exit\nno ip http server\nno ip http secure-server\n\n# ---- NTP 时间同步 ----\n# 思科 IOS 使用 ntp server，部分平台还需 ntp master 或指定 source 接口。\nconfigure terminal\nntp server 10.0.0.5\n\n# ---- SNMP（v2c） ----\nconfigure terminal\nsnmp-server community Read@2026 RO\nsnmp-server host 10.0.0.6 version 2c Read@2026\nsnmp-server enable traps\nsnmp-server location DC-01\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n# [风险] SNMP v2c 团体字明文传输，生产环境建议升级到 v3。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","ruijie":"\n# ---- 设备名与管理地址 ----\nconfigure terminal\nhostname SW-CORE-01\nvlan 99\n exit\ninterface Vlan 99\n ip address 10.0.99.1 255.255.255.0\n exit\nip route 0.0.0.0 0.0.0.0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# 锐捷默认关闭 SSH 服务端，必须显式 enable service ssh-server，否则客户端一定连不上；生成 RSA 密钥前必须先配好 hostname 与 ip domain-name。\nconfigure terminal\nusername netadmin privilege 15 password N3t@dmin#2026\nip domain-name scg.local\ncrypto key generate rsa\nip ssh version 2\n\nline vty 0 4\n transport input ssh\n login local\n exec-timeout 10 0\n exit\nenable service ssh-server\nno enable service telnet-server\n\n# ---- NTP 时间同步 ----\nconfigure terminal\nntp server 10.0.0.5\n\n# ---- SNMP（v2c） ----\nconfigure terminal\nsnmp-server community Read@2026 ro\nsnmp-server host 10.0.0.6 version 2c Read@2026\nsnmp-server enable traps\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n# [风险] SNMP v2c 团体字明文传输，生产环境建议升级到 v3。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。"}},{"label":"v3（用户名 + 认证）","values":{"设备名":"SW-CORE-01","管理 VLAN":"99","管理地址":"10.0.99.1","掩码长度":"24","管理网关":"10.0.99.254","管理员账号":"netadmin","密码":"N3t@dmin#2026","权限级别":"15","NTP 服务器":"10.0.0.5","SNMP 版本":"v3（用户名 + 认证）","SNMP 团体字":"Read@2026","Trap 接收地址":"10.0.0.6","SSH 域名":"scg.local"},"commands":{"h3c":"\n# ---- 设备名与管理地址 ----\nsystem-view\nsysname SW-CORE-01\nvlan 99\n quit\ninterface Vlan-interface 99\n ip address 10.0.99.1 24\n quit\nip route-static 0.0.0.0 0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# Comware V5 用 local-user 下的 level 3 指定权限，没有 user-role 概念。\nsystem-view\nlocal-user netadmin class manage\n password simple N3t@dmin#2026\n service-type ssh\n authorization-attribute user-role network-admin\n quit\n\nline vty 0 4\n authentication-mode scheme\n protocol inbound ssh\n quit\nssh server enable\n undo telnet server enable\n\n# ---- NTP 时间同步 ----\n# 时间不准会导致日志、证书和审计记录失去参考价值。\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- SNMP（v3） ----\n# 此处仅给出骨架，认证与加密密码请在设备上交互输入，避免明文留在脚本里。\nsystem-view\nsnmp-agent\nsnmp-agent sys-info version v3\nsnmp-agent group v3 SCG-GROUP privacy\nsnmp-agent usm-user v3 scguser SCG-GROUP simple authentication-mode sha\nsnmp-agent usm-user v3 scguser SCG-GROUP privacy-mode aes128\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 配置中的密码是明文，交付后请立即更换并改用本地保存的加密方式。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","huawei":"\n# ---- 设备名与管理地址 ----\nsystem-view\nsysname SW-CORE-01\nvlan 99\n quit\ninterface Vlanif 99\n ip address 10.0.99.1 24\n quit\nip route-static 0.0.0.0 0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# rsa local-key-pair create 会交互询问密钥长度，输入 2048；生成需数分钟。\nsystem-view\naaa\n local-user netadmin password irreversible-cipher N3t@dmin#2026\n local-user netadmin privilege level 15\n local-user netadmin service-type ssh\n quit\n\nuser-interface vty 0 4\n authentication-mode aaa\n protocol inbound ssh\n quit\nstelnet server enable\nrsa local-key-pair create\nundo telnet server enable\n\n# ---- NTP 时间同步 ----\nsystem-view\nntp-service enable\nntp-service unicast-server 10.0.0.5\n\n# ---- SNMP（v3） ----\n# 用户认证与加密密码请交互输入，不要明文写进脚本。\nsystem-view\nsnmp-agent\nsnmp-agent sys-info version v3\nsnmp-agent group v3 SCG-GROUP privacy\nsnmp-agent usm-user v3 scguser SCG-GROUP\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","cisco":"\n# ---- 设备名与管理地址 ----\n# 三层交换机用 ip route 0.0.0.0 0.0.0.0 配默认路由；二层交换机只能配 ip default-gateway。\nconfigure terminal\nhostname SW-CORE-01\nvlan 99\n exit\ninterface Vlan99\n ip address 10.0.99.1 255.255.255.0\n no shutdown\n exit\nip default-gateway 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# 生成 RSA 密钥前必须先配置 ip domain-name 和 hostname，否则会失败。exec-timeout 10 0 表示空闲 10 分钟自动断开。\nconfigure terminal\nusername netadmin privilege 15 secret N3t@dmin#2026\nip domain-name scg.local\ncrypto key generate rsa modulus 2048\nip ssh version 2\n\nline vty 0 4\n transport input ssh\n login local\n exec-timeout 10 0\n exit\nno ip http server\nno ip http secure-server\n\n# ---- NTP 时间同步 ----\n# 思科 IOS 使用 ntp server，部分平台还需 ntp master 或指定 source 接口。\nconfigure terminal\nntp server 10.0.0.5\n\n# ---- SNMP（v3） ----\n# 请把 AuthPass / PrivPass 换成实际密码，并改用更安全的保存方式。\nconfigure terminal\nsnmp-server group SCG-GROUP v3 priv\nsnmp-server user scguser SCG-GROUP v3 auth sha AuthPass priv aes 128 PrivPass\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。","ruijie":"\n# ---- 设备名与管理地址 ----\nconfigure terminal\nhostname SW-CORE-01\nvlan 99\n exit\ninterface Vlan 99\n ip address 10.0.99.1 255.255.255.0\n exit\nip route 0.0.0.0 0.0.0.0 10.0.99.254\n\n# ---- 管理员账号与 SSH ----\n# 锐捷默认关闭 SSH 服务端，必须显式 enable service ssh-server，否则客户端一定连不上；生成 RSA 密钥前必须先配好 hostname 与 ip domain-name。\nconfigure terminal\nusername netadmin privilege 15 password N3t@dmin#2026\nip domain-name scg.local\ncrypto key generate rsa\nip ssh version 2\n\nline vty 0 4\n transport input ssh\n login local\n exec-timeout 10 0\n exit\nenable service ssh-server\nno enable service telnet-server\n\n# ---- NTP 时间同步 ----\nconfigure terminal\nntp server 10.0.0.5\n\n# ---- SNMP（v3） ----\n# 请把 AuthPass / PrivPass 换成实际密码。\nconfigure terminal\nsnmp-server group SCG-GROUP v3 priv\nsnmp-server user scguser SCG-GROUP v3 auth sha AuthPass priv aes 128 PrivPass\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [风险] 脚本中的密码是明文，交付后请立即更换。\n\n# --------------------------------------------------------------------\n# [提示] 关闭 telnet、只保留 SSH，是管理面加固最基本的一条。\n# [提示] 开局配置里的明文密码，交付前必须统一更换。\n# [提示] 华为/H3C 的 RSA 密钥生成需要几分钟，属正常现象。"}}]},{"key":"gateway","name":"网关冗余（VRRP / HSRP）","group":"高可用","summary":"两台设备共用虚拟网关 IP，主设备故障时备设备自动接管。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。","主备优先级要拉开差距，避免频繁切换。","只有思科 / 锐捷支持 HSRP；VRRP 四家通用。"],"params":[{"label":"协议","help":"","example":"","default":"vrrp"},{"label":"接口 VLAN","help":"","example":"10","default":"10"},{"label":"备份组号","help":"VRRP 组号 1-255；HSRP 组号 0-255。","example":"","default":"10"},{"label":"本机接口 IP","help":"","example":"","default":"192.168.10.1"},{"label":"掩码长度","help":"","example":"","default":"24"},{"label":"虚拟网关 IP","help":"","example":"","default":"192.168.10.254"},{"label":"优先级","help":"越大越优先。默认 100，主设备配 120、备设备保持默认即可。","example":"","default":"120"},{"label":"启用抢占","help":"主设备恢复后自动抢回，推荐开启。","example":"","default":"1"},{"label":"上行链路监控","help":"选填。上行口 down 时自动降优先级，触发主备切换。","example":"1/0/24","default":""}],"samples":[{"label":"默认参数","values":{"协议":"VRRP（四厂商通用）","接口 VLAN":"10","备份组号":"10","本机接口 IP":"192.168.10.1","掩码长度":"24","虚拟网关 IP":"192.168.10.254","优先级":"120","启用抢占":"启用","上行链路监控":""},"commands":{"h3c":"\n# ---- 配置 VRRP 虚拟网关 ----\n# 两台设备的 vrid、虚拟 IP 必须完全一致，否则会形成双主。\nsystem-view\ninterface Vlan-interface 10\n ip address 192.168.10.1 24\n vrrp vrid 10 virtual-ip 192.168.10.254\n vrrp vrid 10 priority 120\n vrrp vrid 10 preempt-mode delay 5\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。","huawei":"\n# ---- 配置 VRRP 虚拟网关 ----\n# 华为的端口联动直接写在 vrrp 命令里，不需要先建 track 项。\nsystem-view\ninterface Vlanif 10\n ip address 192.168.10.1 24\n vrrp vrid 10 virtual-ip 192.168.10.254\n vrrp vrid 10 priority 120\n vrrp vrid 10 preempt-mode timer delay 5\n quit\n\n# ---- 保存配置 ----\n# save 命令会提示确认，按 Y 继续。\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。","cisco":"\n# ---- 配置网关冗余 ----\n# VRRP 可与华为 / H3C / 锐捷设备互通，跨厂商组网请统一使用 VRRP。\nconfigure terminal\ninterface Vlan10\n ip address 192.168.10.1 255.255.255.0\n no shutdown\n vrrp 10 ip 192.168.10.254\n vrrp 10 priority 120\n vrrp 10 preempt\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。","ruijie":"\n# ---- 配置网关冗余 ----\n# 锐捷的 VRRP 语法与思科一致，能与其他厂商的 VRRP 互通。\nconfigure terminal\ninterface Vlan 10\n ip address 192.168.10.1 255.255.255.0\n vrrp 10 ip 192.168.10.254\n vrrp 10 priority 120\n vrrp 10 preempt\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。"}},{"label":"HSRP（思科 / 锐捷）","values":{"协议":"HSRP（思科 / 锐捷）","接口 VLAN":"10","备份组号":"10","本机接口 IP":"192.168.10.1","掩码长度":"24","虚拟网关 IP":"192.168.10.254","优先级":"120","启用抢占":"启用","上行链路监控":""},"commands":{"h3c":"# 该厂商不支持本场景\n# H3C 不支持 HSRP，请选择 VRRP。","huawei":"# 该厂商不支持本场景\n# 华为不支持 HSRP，请选择 VRRP。","cisco":"\n# ---- 配置网关冗余 ----\n# HSRP 是思科私有协议，与 VRRP 不能互通。默认优先级 100，范围 0-255。\nconfigure terminal\ninterface Vlan10\n ip address 192.168.10.1 255.255.255.0\n no shutdown\n standby 10 ip 192.168.10.254\n standby 10 priority 120\n standby 10 preempt delay minimum 30\n exit\n\n# ---- 保存配置 ----\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。","ruijie":"\n# ---- 配置网关冗余 ----\n# HSRP 为思科体系协议，锐捷仅部分型号支持，跨厂商组网请使用 VRRP。\nconfigure terminal\ninterface Vlan 10\n ip address 192.168.10.1 255.255.255.0\n standby 10 ip 192.168.10.254\n standby 10 priority 120\n standby 10 preempt delay minimum 30\n exit\n\n# ---- 保存配置 ----\nend\nwrite\n\n# --------------------------------------------------------------------\n# [提示] 两台设备的组号、虚拟 IP、认证参数必须完全一致，否则会形成双主。\n# [提示] 主备优先级要拉开差距，避免频繁切换。\n# [提示] 只有思科 / 锐捷支持 HSRP；VRRP 四家通用。"}}]},{"key":"port_isolation","name":"端口隔离（保护口）","group":"二层","summary":"同一个 VLAN 里让端口两两不能互访，接终端最常用的一招。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["隔离组内的端口互相不通，但与非隔离口（例如上行口）可以正常通信。","H3C 在 IRF 组网下不支持端口隔离；华为的管理口也不支持。","思科 / 锐捷的 switchport protected 关闭三层隔离需要额外一条全局命令。"],"params":[{"label":"需要隔离的端口","help":"接终端的口。支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-22","default":"1/0/1-22"},{"label":"上行口（不隔离）","help":"选填。隔离口与非隔离口之间仍可互通，所以上行口要留出来。","example":"1/0/24","default":"1/0/24"},{"label":"隔离组号","help":"仅 H3C / 华为使用。H3C 取值 1-8，华为取值 1-64。","example":"","default":"1"},{"label":"连三层一起隔离","help":"默认只隔离二层，隔离口之间仍可经网关互访；勾上才是彻底隔离。","example":"","default":"0"}],"samples":[{"label":"默认参数","values":{"需要隔离的端口":"1/0/1-22","上行口（不隔离）":"1/0/24","隔离组号":"1","连三层一起隔离":"不启用"},"commands":{"h3c":"\n# ---- 创建隔离组 ----\n# 隔离组编号 1-8。port-isolate mode all 表示二层三层都隔离，缺省只隔离二层、隔离口之间仍可经网关互访。\nsystem-view\nport-isolate group 1\n quit\n\n# ---- 端口加入隔离组 ----\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n port-isolate enable group 1\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] H3C 在 IRF 组网环境下不支持端口隔离功能，堆叠组网请改用其他方式。\n\n# --------------------------------------------------------------------\n# [提示] 上行口 GigabitEthernet1/0/24 未加入隔离组，隔离口与它之间可以正常通信。\n# [提示] 隔离组内的端口互相不通，但与非隔离口（例如上行口）可以正常通信。\n# [提示] H3C 在 IRF 组网下不支持端口隔离；华为的管理口也不支持。\n# [提示] 思科 / 锐捷的 switchport protected 关闭三层隔离需要额外一条全局命令。","huawei":"\n# ---- 端口加入隔离组 ----\n# 华为不需要预先创建隔离组，直接在接口下指定组号即可，取值 1-64。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n port-isolate enable group 1\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 上行口 GigabitEthernet1/0/24 未加入隔离组，隔离口与它之间可以正常通信。\n# [提示] 管理口不支持 port-isolate enable。\n# [提示] 隔离组内的端口互相不通，但与非隔离口（例如上行口）可以正常通信。\n# [提示] H3C 在 IRF 组网下不支持端口隔离；华为的管理口也不支持。\n# [提示] 思科 / 锐捷的 switchport protected 关闭三层隔离需要额外一条全局命令。","cisco":"\n# ---- 配置保护口（protected port） ----\n# 思科把端口隔离叫 protected port。保护口之间二层不通，保护口与非保护口之间正常。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 22\n switchport protected\n exit\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] switchport protected 只阻挡二层互通，保护口之间仍可经三层网关互访。要连三层一起隔离，只能上 Private VLAN（隔离型 VLAN），配置模型完全不同。\n\n# --------------------------------------------------------------------\n# [提示] 上行口 GigabitEthernet1/0/24 未设为保护口，保护口与它之间可以正常通信。\n# [提示] 隔离组内的端口互相不通，但与非隔离口（例如上行口）可以正常通信。\n# [提示] H3C 在 IRF 组网下不支持端口隔离；华为的管理口也不支持。\n# [提示] 思科 / 锐捷的 switchport protected 关闭三层隔离需要额外一条全局命令。","ruijie":"\n# ---- 配置保护口（端口隔离） ----\n# 锐捷把端口隔离叫保护口/protected port。protected-ports route-deny 是全局开关，开了之后保护口之间连三层路由也不通，不能按端口单独设置。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-22\n switchport protected\n exit\nend\nwrite\n\n# ---- 核对结果 ----\n# 列出当前已设为保护口的接口。\nconfigure terminal\nshow protected-ports\nend\n\n# --------------------------------------------------------------------\n# [提示] 上行口 GigabitEthernet 1/0/24 未设为保护口，保护口与它之间可以正常通信。\n# [提示] 保护口只支持以太网物理接口与聚合口；聚合口设为保护口后，其成员口一并生效。\n# [提示] 隔离组内的端口互相不通，但与非隔离口（例如上行口）可以正常通信。\n# [提示] H3C 在 IRF 组网下不支持端口隔离；华为的管理口也不支持。\n# [提示] 思科 / 锐捷的 switchport protected 关闭三层隔离需要额外一条全局命令。"}}]},{"key":"port_security","name":"端口安全与 MAC 绑定","group":"安全","summary":"限制端口下能接入的 MAC 数量，并可把 MAC 固化绑定，防私接。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["端口安全是全局开关 + 端口参数两级配置，缺一不可。","H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。","开启后端口不能同时做镜像目的口、不能加入聚合组。"],"params":[{"label":"受控端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-8","default":"1/0/1-8"},{"label":"最大 MAC 数","help":"端口下最多允许多少个 MAC 同时在线，超了就触发违例动作。","example":"","default":"3"},{"label":"违例动作","help":"","example":"","default":"restrict"},{"label":"自动学习并固化 MAC","help":"先让端口学到终端 MAC，再固化下来，适合成批部署。","example":"","default":"1"},{"label":"手工绑定的 MAC","help":"逗号分隔，写成 H-H-H 或 xxxx.xxxx.xxxx 均可。","example":"0001-0002-0003,0001-0002-0004","default":""},{"label":"绑定所属 VLAN","help":"选填。填了就按 VLAN 限定这条绑定。","example":"10","default":""},{"label":"安全 MAC 老化时间","help":"选填，单位分钟。留空用设备默认值。","example":"30","default":""}],"samples":[{"label":"默认参数","values":{"受控端口":"1/0/1-8","最大 MAC 数":"3","违例动作":"丢弃并告警 restrict","自动学习并固化 MAC":"启用","手工绑定的 MAC":"","绑定所属 VLAN":"","安全 MAC 老化时间":""},"commands":{"h3c":"\n# ---- 全局开启端口安全 ----\n# 端口安全是全局开关 + 端口参数两级配置，缺一不可。\nsystem-view\nport-security enable\n\n# ---- 端口安全参数 ----\n# autolearn 模式下端口先自动学习，学到最大值后再来新 MAC 就触发违例。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port-security max-mac-count 3\n port-security port-mode autolearn\n port-security intrusion-mode blockmac\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 端口安全不能与 802.1X、MAC 认证同时配置；开启时端口上的这两项配置会被重置。\n# [风险] 安全端口不能作为镜像目的口，也不能加入聚合组。\n\n# --------------------------------------------------------------------\n# [提示] 选了自动学习模式，设备会自己把学到的 MAC 转成安全 MAC，需要固定下来时可以用 display port-security 查到后再固化。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","huawei":"\n# ---- 配置端口安全 ----\n# 华为的端口安全是在接口下开启的，没有全局开关。protect-action 取值 protect / restrict / shutdown。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port-security enable\n port-security max-mac-num 3\n port-security protect-action restrict\n port-security mac-address sticky\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：display port-security；查看违例记录：display port-security intrusion。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","cisco":"\n# ---- 配置端口安全 ----\n# 思科必须先 switchport port-security 打开，再配参数。端口必须是 access 或 trunk 模式（不能是 dynamic），所以这里补了一句 switchport mode access——如果这些口要跑 trunk，请删掉它。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n switchport mode access\n switchport port-security\n switchport port-security maximum 3\n switchport port-security violation restrict\n switchport port-security mac-address sticky\n exit\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：show port-security；查看已绑定的地址：show port-security address。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","ruijie":"\n# ---- 配置端口安全 ----\n# 锐捷的命令是 switchport port-security（不是 port-security enable）。违例动作可取 protect / restrict / shutdown。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n switchport port-security\n switchport port-security maximum 3\n switchport port-security violation restrict\n switchport port-security mac-address sticky\n exit\nend\nwrite\n\n# ---- 查看端口安全状态 ----\n# 确认绑定表里是否已经出现了你想要的 MAC，以及违例计数有没有涨。\nconfigure terminal\nshow port-security\nshow port-security address\nend\n\n# --------------------------------------------------------------------\n# [风险] SPAN 的目的端口不能配端口安全；DHCP Snooping 的信任端口上也配不了。\n# [风险] 端口安全不能与全局 IP+MAC 绑定、IP Source Guard 同时生效，配了 MAC 绑定的口会绕过端口安全检查。\n\n# --------------------------------------------------------------------\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。"}},{"label":"关闭端口 shutdown","values":{"受控端口":"1/0/1-8","最大 MAC 数":"3","违例动作":"关闭端口 shutdown","自动学习并固化 MAC":"启用","手工绑定的 MAC":"","绑定所属 VLAN":"","安全 MAC 老化时间":""},"commands":{"h3c":"\n# ---- 全局开启端口安全 ----\n# 端口安全是全局开关 + 端口参数两级配置，缺一不可。\nsystem-view\nport-security enable\nport-security timer disableport 30\n\n# ---- 端口安全参数 ----\n# autolearn 模式下端口先自动学习，学到最大值后再来新 MAC 就触发违例。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port-security max-mac-count 3\n port-security port-mode autolearn\n port-security intrusion-mode disableport-temporarily\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 违例动作选了关闭端口，端口会被暂时关闭 30 秒，业务有中断风险。\n# [风险] 端口安全不能与 802.1X、MAC 认证同时配置；开启时端口上的这两项配置会被重置。\n# [风险] 安全端口不能作为镜像目的口，也不能加入聚合组。\n\n# --------------------------------------------------------------------\n# [提示] 选了自动学习模式，设备会自己把学到的 MAC 转成安全 MAC，需要固定下来时可以用 display port-security 查到后再固化。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","huawei":"\n# ---- 配置端口安全 ----\n# 华为的端口安全是在接口下开启的，没有全局开关。protect-action 取值 protect / restrict / shutdown。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/8\n port-security enable\n port-security max-mac-num 3\n port-security protect-action shutdown\n port-security mac-address sticky\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 违例动作选了 shutdown，端口一旦触发违例会直接关闭，需人工干预才能恢复。\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：display port-security；查看违例记录：display port-security intrusion。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","cisco":"\n# ---- 配置端口安全 ----\n# 思科必须先 switchport port-security 打开，再配参数。端口必须是 access 或 trunk 模式（不能是 dynamic），所以这里补了一句 switchport mode access——如果这些口要跑 trunk，请删掉它。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 8\n switchport mode access\n switchport port-security\n switchport port-security maximum 3\n switchport port-security violation shutdown\n switchport port-security mac-address sticky\n exit\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [风险] violation shutdown 会让端口进入 err-disabled，需要手动 shutdown / no shutdown 或配置 errdisable recovery 才能恢复。\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：show port-security；查看已绑定的地址：show port-security address。\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。","ruijie":"\n# ---- 配置端口安全 ----\n# 锐捷的命令是 switchport port-security（不是 port-security enable）。违例动作可取 protect / restrict / shutdown。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-8\n switchport port-security\n switchport port-security maximum 3\n switchport port-security violation shutdown\n switchport port-security mac-address sticky\n exit\nend\nwrite\n\n# ---- 查看端口安全状态 ----\n# 确认绑定表里是否已经出现了你想要的 MAC，以及违例计数有没有涨。\nconfigure terminal\nshow port-security\nshow port-security address\nend\n\n# --------------------------------------------------------------------\n# [风险] SPAN 的目的端口不能配端口安全；DHCP Snooping 的信任端口上也配不了。\n# [风险] 端口安全不能与全局 IP+MAC 绑定、IP Source Guard 同时生效，配了 MAC 绑定的口会绕过端口安全检查。\n\n# --------------------------------------------------------------------\n# [提示] 端口安全是全局开关 + 端口参数两级配置，缺一不可。\n# [提示] H3C 开启端口安全会重置端口上的 802.1X 与 MAC 认证配置，二者不能共存。\n# [提示] 开启后端口不能同时做镜像目的口、不能加入聚合组。"}}]},{"key":"storm_control","name":"广播风暴抑制","group":"安全","summary":"给端口设一个广播 / 组播 / 未知单播的流量上限，超了就丢包。","versions":"Comware V5/V7 · VRP V5/V8 · IOS 12.x/15.x · RGOS 10.x/11.x","notes":["阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。","华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。","同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。"],"params":[{"label":"受控端口","help":"支持 1/0/1-8、1/0/1-1/0/8、1/0/1,1/0/3，可带类型前缀如 XGE1/0/49。","example":"1/0/1-22","default":"1/0/1-22"},{"label":"抑制广播","help":"","example":"","default":"1"},{"label":"抑制组播","help":"","example":"","default":"1"},{"label":"抑制未知单播","help":"","example":"","default":"0"},{"label":"阈值单位","help":"","example":"","default":"percent"},{"label":"阈值","help":"百分比填 0-100；pps 填每秒包数。思科 / 锐捷通常默认就是 10%。","example":"10","default":"10"}],"samples":[{"label":"默认参数","values":{"受控端口":"1/0/1-22","抑制广播":"启用","抑制组播":"启用","抑制未知单播":"不启用","阈值单位":"按带宽百分比","阈值":"10"},"commands":{"h3c":"\n# ---- 配置风暴抑制 ----\n# H3C 的百分比关键字是 ratio（不是 percent）。pps 与 kbps 模式下设备会按芯片步长取整，实际生效值可能与填写的略有出入。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n broadcast-suppression ratio 10\n multicast-suppression ratio 10\n quit\n\n# ---- 保存配置 ----\nreturn\nsave force\n\n# --------------------------------------------------------------------\n# [风险] 同一类型报文的 broadcast-suppression 与 storm-constrain 不能同时配置，否则抑制效果不确定。\n\n# --------------------------------------------------------------------\n# [提示] 百分比模式下 10% 是较常见的保守取值；接入口可按现场广播量调整。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","huawei":"\n# ---- 配置风暴控制 ----\n# 华为必须同时给低阈值和高阈值两个值，只给一个会报错；工具按「高阈值的一半」自动算低阈值。超过了只丢包、不关端口，动作是 storm control action block。\nsystem-view\ninterface range GigabitEthernet1/0/1 to GigabitEthernet1/0/22\n storm control broadcast min-rate percent 5 max-rate percent 10\n storm control multicast min-rate percent 5 max-rate percent 10\n storm control action block\n quit\n\n# ---- 保存配置 ----\nreturn\nsave\n\n# --------------------------------------------------------------------\n# [风险] 部分 VRP V5 版本（如早期 S5700）的命令写作 storm-control（带连字符）且单位为 min-rate / max-rate 两个纯数字，下发前请用 storm control ? 确认本机写法。\n\n# --------------------------------------------------------------------\n# [提示] 查看运行情况：display storm-control。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","cisco":"\n# ---- 配置风暴控制 ----\n# level 后面跟一个数字表示带宽百分比；想按包速率限就用 level pps <值>，但部分平台不支持 pps 模式，下发前用 storm-control broadcast ? 确认。\nconfigure terminal\ninterface range GigabitEthernet1/0/1 - 22\n storm-control broadcast level 10\n storm-control multicast level 10\n exit\nend\nwrite memory\n\n# --------------------------------------------------------------------\n# [提示] 默认动作是丢弃超限报文、端口保持 up。\n# [提示] 查看运行情况：show storm-control broadcast。\n# [提示] 阈值要按现场流量来定，一开始可以按百分比给一个偏保守的值，观察后再收紧。\n# [提示] 华为的百分比模式必须同时给低阈值和高阈值两个值，工具会按阈值的一半自动算低阈值。\n# [提示] 同一类型的报文不要同时配风暴抑制和接口流量阈值，会冲突。","ruijie":"\n# ---- 配置风暴抑制 ----\n# level 后面跟数字表示带宽百分比；按包速率限速用 pps <值>。web 界面不支持 pps 模式，只能用命令行配。\nconfigure terminal\ninterface range GigabitEthernet 1/0/1-22\n storm-control broadcast level 10\n storm-control multicast level 10\n exit\nend\nwrite\n\n# ---- 核对结果 ----\n# 确认阈值已经按填写值生效。\nconfigure terminal\nsho
